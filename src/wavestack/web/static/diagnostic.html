<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <script src="/static/theme.js"></script>
  <title>WaveStack — Diagnostic de démarrage</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/static/fonts.css" />
  <link rel="stylesheet" href="/static/tokens.css" />
  <link rel="stylesheet" href="/static/pages.css" />
  <style>
    /* Story 31: colours by the tokens of tokens.css only, in both themes (DESIGN.md >
       diagnostic-row): a row's background says its state, a result its left rule. */
    body {
      font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem;
      background: var(--color-surface); color: var(--color-ink);
    }
    h1 { font-size: 1.4rem; }
    ul { list-style: none; padding: 0; }
    li { padding: 0.6rem; border-radius: 6px; margin-bottom: 0.5rem; }
    li.ok { background: var(--color-accent-soft); }
    li.warn { background: var(--color-warning-soft); }
    li.fail, li.incompatible { background: var(--color-danger-soft); }
    li.found, li.server { background: var(--color-accent-soft); }
    li.server.warn { background: var(--color-warning-soft); }
    .served { font-size: 0.9rem; color: var(--color-ink-soft); }
    .served-warning, .cloud-result.ok, .cloud-result.warn, .cloud-result.fail {
      color: var(--color-ink); border-left: 4px solid transparent; padding-left: 0.4rem;
    }
    .served-warning, .cloud-result.warn { border-left-color: var(--color-warning); }
    .cloud-result.ok { border-left-color: var(--color-state-ok); }
    .cloud-result.fail { border-left-color: var(--color-state-error); }
    .action { font-size: 0.9rem; color: var(--color-ink-soft); }
    #select-model { margin-top: 1.5rem; }
    .saved-mark { font-size: 0.85rem; font-weight: bold; margin-left: 0.5rem; }
    input[type="text"] { width: 100%; padding: 0.4rem; box-sizing: border-box; }
    button { margin-top: 0.5rem; padding: 0.4rem 1rem; }
    #select-model-status { font-size: 0.9rem; }
    h2 { font-size: 1.1rem; margin-top: 1.5rem; }
    li.cloud {
      background: var(--color-discipline-network-soft);
      border: 2px dashed var(--color-hosting-boundary);
    }
    .hosting-tag-network, .hosting-tag-local {
      display: inline-block; font-size: 0.75rem; font-weight: bold; padding: 0 0.4rem;
      border-radius: 4px; margin-right: 0.4rem;
    }
    .hosting-tag-network {
      background: var(--color-hosting-network); color: var(--color-on-vivid);
      border: 1px dashed var(--color-ink);
    }
    .hosting-tag-network::before { content: "🌐 "; }
    .hosting-tag-local {
      background: var(--color-surface-raised); color: var(--color-ink);
      border: 1px solid var(--color-ink-soft);
    }
    .cloud-key { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.4rem; }
    .cloud-key input { flex: 1; padding: 0.4rem; }
    .cloud-result { font-size: 0.9rem; margin-top: 0.3rem; }
    dialog#cloud-warning {
      max-width: 560px; border: 2px solid var(--color-ink); border-radius: 8px;
      background: var(--color-surface-raised); color: var(--color-ink);
    }
  </style>
</head>
<body>
  <nav class="page-tabs" aria-label="Pages de WaveStack">
    <a href="/diagnostic" aria-current="page">Diagnostic</a>
    <a href="/models">Modèles</a>
    <!-- Shown once the diagnostic is ready (`body.ready`), as the former link. -->
    <a href="/" id="open-link" hidden>Ouvrir WaveStack</a>
    <select id="theme-picker" class="theme-picker" data-theme-picker aria-label="Thème de l'interface" title="Thème de l'interface">
      <option value="system">◐ Système</option>
      <option value="light">☀ Clair</option>
      <option value="dark">☾ Sombre</option>
    </select>
  </nav>
  <h1>Diagnostic de démarrage WaveStack</h1>
  <ul id="checks"></ul>

  <h2>Modèles détectés</h2>
  <ul id="candidates"></ul>

  <h2>Modèles cloud</h2>
  <p class="action">Hors du poste : chaque appel envoie tout le contexte au fournisseur.</p>
  <ul id="cloud-models"></ul>

  <dialog id="cloud-warning" aria-labelledby="cloud-warning-title">
    <h3 id="cloud-warning-title"></h3>
    <ul id="cloud-warning-points"></ul>
    <button type="button" id="cloud-warning-confirm"></button>
    <button type="button" id="cloud-warning-cancel"></button>
  </dialog>

  <div id="select-model">
    <p>Ou indiquez le chemin d'un fichier GGUF :</p>
    <input type="text" id="model-path" placeholder="C:\chemin\vers\modele.gguf" />
    <button id="submit-path" class="choose">Choisir ce fichier</button>
    <p id="select-model-status"></p>
  </div>

  <script type="module">
    const checksEl = document.getElementById("checks");
    const candidatesEl = document.getElementById("candidates");
    const selectStatusEl = document.getElementById("select-model-status");
    const items = new Map();
    // `{kind, ref}` of the saved choice and of the loaded model, whatever their kind (story 18).
    let selectedModel = null;
    let loadedModel = null;
    const isModel = (model, kind, ref) => Boolean(model && model.kind === kind && model.ref === ref);
    let busy = false;  // one select_model request at a time
    // Story 17: a choice may start a hot switch, answered « Chargement de {modèle}… »; its
    // `model_load_ended` gives the outcome (it may come before the answer), then the marks
    // come from the application session.
    // `switching`: the request that may start a switch; `ref` (from its answer) is the model
    // it loads, and `outcomes` the `model_load_ended` texts that came before the answer.
    let switching = null; // { show(text), ref, answered, outcomes, timer }
    const SWITCH_TIMEOUT_MS = 5 * 60 * 1000; // a missed outcome never pins a message

    function startSwitch(show) {
      finishSwitch();
      switching = { show, ref: null, answered: false, outcomes: new Map() };
      const mine = switching;
      mine.timer = setTimeout(() => { if (switching === mine) finishSwitch(); }, SWITCH_TIMEOUT_MS);
      return mine;
    }

    function finishSwitch(text) {
      const pending = switching;
      if (!pending) return;
      clearTimeout(pending.timer);
      switching = null;
      if (text !== undefined) pending.show(text);
    }

    // The answer of the request `mine` started: its message now, unless the load it started
    // (`body.ref`) already ended.
    function answerSwitch(mine, body, message) {
      if (switching !== mine) {
        mine.show(message);
        return;
      }
      if (!body.switching) {
        finishSwitch(message);
        return;
      }
      mine.ref = body.ref;
      mine.answered = true;
      if (mine.outcomes.has(body.ref)) finishSwitch(mine.outcomes.get(body.ref));
      else mine.show(message);
    }

    // Messages carry file names and paths: build nodes, never innerHTML.
    function fillLine(li, label, text, detail) {
      const strong = document.createElement("strong");
      strong.textContent = label;
      li.replaceChildren(strong, ` — ${text}`);
      if (detail) {
        const div = document.createElement("div");
        div.className = "action";
        div.textContent = detail;
        li.appendChild(div);
      }
    }

    // Keeps every row whose rendering did not change, with its buttons, its typed key and
    // its focus: a button replaced under the pointer loses the click.
    function patchList(container, rows) {
      rows.forEach((row, i) => {
        const old = container.children[i];
        if (!old) container.appendChild(row);
        else if (old.outerHTML !== row.outerHTML) old.replaceWith(row);
      });
      while (container.children.length > rows.length) container.lastElementChild.remove();
    }

    // `live`: false for the journal's history, replayed by the stream when the page opens;
    // /api/diagnostic already says what it led to (the lists, each model's last test).
    function renderCheck(payload, live) {
      if (payload.check === "cloud_test") {
        if (!live) return;
        testResults.set(payload.model_id, payload);
        renderCloud();
        return;
      }
      const key = payload.check === "cloud" ? `cloud:${payload.message_fr}` : payload.check;
      let li = items.get(key);
      if (!li) {
        li = document.createElement("li");
        items.set(key, li);
        checksEl.appendChild(li);
      }
      li.className = payload.status;
      fillLine(li, payload.check, payload.message_fr, payload.action_fr);
      if (payload.check === "model" && live) loadDiagnostic();
    }

    function renderHarnessError(payload) {
      const li = document.createElement("li");
      li.className = "fail";
      fillLine(li, "erreur", payload.message_fr, payload.cause);
      checksEl.appendChild(li);
    }

    function renderCandidates(candidates) {
      if (!candidates.length) {
        const li = document.createElement("li");
        li.textContent = "Aucun candidat trouvé.";
        patchList(candidatesEl, [li]);
        return;
      }
      const rows = [];
      for (const c of candidates) {
        if (c.source === "server") {
          rows.push(servedRow(c));
          continue;
        }
        const li = document.createElement("li");
        li.className = c.status;
        const title = document.createElement("strong");
        title.textContent = c.name || c.server_url || c.source;
        li.appendChild(title);
        const details = [
          c.architecture ? `architecture ${c.architecture}` : null,
          c.source,
          c.reason,
        ].filter(Boolean).join(" · ");
        li.append(` — ${details}`);
        addMarks(li, "file", c.path);
        const where = document.createElement("div");
        where.className = "action";
        where.textContent = c.path || c.server_url || "";
        li.appendChild(where);
        if (c.status === "found" && c.path && !isModel(loadedModel, "file", c.path)) {
          li.appendChild(chooseButton({ kind: "file", ref: c.path }));
        }
        rows.push(li);
      }
      patchList(candidatesEl, rows);
    }

    function addMarks(li, kind, ref) {
      for (const [model, text] of [[loadedModel, "chargé"], [selectedModel, "choix enregistré"]]) {
        if (!ref || !isModel(model, kind, ref)) continue;
        const mark = document.createElement("span");
        mark.className = "saved-mark";
        mark.textContent = text;
        li.appendChild(mark);
      }
    }

    function chooseButton(model) {
      const button = document.createElement("button");
      button.className = "choose";
      button.disabled = busy;
      button.textContent = "Choisir";
      button.addEventListener("click", () => chooseModel(model));
      return button;
    }

    // Story 18: a model an already-running local server serves. « Local », `provider · nom`,
    // its address and the memory it takes; WaveStack neither launches nor stops the server.
    function servedRow(c) {
      const li = document.createElement("li");
      li.className = c.status;
      const tag = document.createElement("span");
      tag.className = "hosting-tag-local";
      tag.textContent = "Local";
      const title = document.createElement("strong");
      title.textContent = `${c.provider} · ${c.name}`;
      li.append(tag, title, " — serveur local déjà lancé");
      addMarks(li, "server", c.ref);
      const where = document.createElement("div");
      where.className = "action";
      where.textContent = c.server_url || "";
      li.appendChild(where);
      if (c.status !== "incompatible") {
        const size = document.createElement("div");
        size.className = "served";
        const go = c.served_bytes ? `≈ ${(c.served_bytes / 1024 ** 3).toFixed(1).replace(".", ",")} Go` : "inconnue";
        const where = c.resident ? "déjà en mémoire" : "chargé par le serveur au premier appel";
        // Lot E (E1): llama-server's context cache, when its GGUF could not be read here.
        const cache = c.engine === "llama_server" && c.context_counted === false
          ? ", sans son cache de contexte (fichier du modèle illisible depuis WaveStack)"
          : "";
        size.textContent = `Mémoire du modèle servi : ${go}${cache}, ${where} (processus distinct de WaveStack)`;
        li.appendChild(size);
      }
      if (c.warning_fr) {
        // Lot E (E1): llama-server launched with a context much larger than the window.
        li.classList.add("warn");
        const warning = document.createElement("div");
        warning.className = "served served-warning";
        warning.textContent = c.warning_fr;
        li.appendChild(warning);
      }
      if (c.status === "incompatible") {
        const why = document.createElement("div");
        why.className = "action";
        why.textContent = c.reason || "Modèle inutilisable.";
        li.appendChild(why);
      } else if (!isModel(loadedModel, "server", c.ref)) {
        li.appendChild(chooseButton({ kind: "server", ref: c.ref }));
      }
      return li;
    }

    // ---------- cloud models (story 11): key, « Tester », « Choisir » behind the warning ----------
    const cloudEl = document.getElementById("cloud-models");
    const warningEl = document.getElementById("cloud-warning");
    // model id -> the live `diagnostic_check{check: cloud_test}` (null: a test under way),
    // over the row's `last_test`
    const testResults = new Map();
    const cloudStatus = new Map(); // model id -> the last intention's message
    let cloud = { models: [], key_hint_fr: "" };
    let warningFor = null;
    let warningOpener = null; // the « Choisir » button that opened the warning

    function node(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;
      return element;
    }

    // A row kept by `patchList` keeps its listeners: they read the model as it is now.
    const currentModel = (m) => cloud.models.find((x) => x.id === m.id) || m;

    function renderCloud() {
      if (!cloud.models.length) {
        patchList(cloudEl, [node("li", "", "Aucun modèle cloud déclaré (voir wavestack.toml).")]);
        return;
      }
      const rows = [];
      for (const m of cloud.models) {
        const li = node("li", "cloud");
        const d = m.disclosure;
        li.title = [
          `Hébergement : ${d.hosting_fr}`,
          `Entraînement : ${m.training_fr}`,
          d.trial ? "Offre d'essai" : null,
          d.notes_fr,
        ].filter(Boolean).join("\n");
        li.append(node("span", "hosting-tag-network", "RÉSEAU"), node("strong", "", `${m.provider} · ${m.model}`));
        for (const [on, text] of [[m.loaded, "actif"], [m.selected && !m.loaded, "choix enregistré"]]) {
          if (on) li.appendChild(node("span", "saved-mark", text));
        }
        li.appendChild(node("div", "action", `Hébergement : ${d.hosting_fr} · Entraînement : ${m.training_fr}${d.trial ? " · offre d'essai" : ""}`));
        const keyRow = node("div", "cloud-key");
        const input = node("input");
        input.type = "password";
        input.autocomplete = "off";
        // AD-20: the variable's name only, never its value; a key typed here comes first.
        const fromEnv = m.key_source === "env";
        input.placeholder = fromEnv
          ? `Clé lue dans ${m.key_env} (en saisir une pour la remplacer)`
          : m.key_set ? "Clé enregistrée (la saisir de nouveau pour la remplacer)" : "Clé API";
        input.setAttribute("aria-label", `Clé API ${m.provider}`);
        const save = node("button", "choose", "Enregistrer la clé");
        save.type = "button";
        save.disabled = busy;
        save.addEventListener("click", () => {
          if (input.value.trim()) setApiKey(currentModel(m), input.value);
        });
        keyRow.append(input, save);
        if (fromEnv) li.appendChild(node("div", "action", `Clé fournie par la variable ${m.key_env}`));
        else if (m.key_env && !m.key_set) {
          li.appendChild(node("div", "action", `Ou définissez la variable ${m.key_env}, puis ouvrez un nouveau terminal.`));
        }
        li.append(keyRow, node("div", "action", cloud.key_hint_fr));
        const test = node("button", "choose", "Tester");
        const choose = node("button", "choose", "Choisir");
        for (const button of [test, choose]) {
          button.type = "button";
          button.disabled = busy || Boolean(m.disabled_fr);
          if (m.disabled_fr) {
            button.title = m.disabled_fr;
            button.dataset.blocked = "true"; // `setBusy(false)` leaves it disabled
          }
        }
        test.addEventListener("click", () => testCloud(currentModel(m)));
        choose.addEventListener("click", () => openWarning(currentModel(m), choose));
        li.append(test, " ", choose);
        if (m.disabled_fr) li.appendChild(node("div", "action", m.disabled_fr));
        li.appendChild(node("div", "action", m.test_hint_fr));
        const result = testResults.has(m.id) ? testResults.get(m.id) : m.last_test;
        if (result) {
          const parts = [result.message_fr];
          if (result.answer) parts.push(`Réponse : « ${result.answer} »`);
          if (result.tool_call) parts.push(`Appel d'outil reçu : ${result.tool_call.name} ${result.tool_call.arguments ?? ""}`);
          if (result.action_fr) parts.push(result.action_fr);
          li.appendChild(node("div", `cloud-result ${result.status}`, parts.join(" · ")));
        }
        if (cloudStatus.has(m.id)) li.appendChild(node("div", "cloud-result", cloudStatus.get(m.id)));
        rows.push(li);
      }
      patchList(cloudEl, rows);
    }

    async function post(path, payload) {
      const response = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const body = await response.json();
      return { ok: response.ok, body };
    }

    // `mine`: the switch this request may start (« Choisir »), else none.
    async function cloudIntention(m, path, payload, pending, mine = null) {
      if (busy) return;
      setBusy(true);
      cloudStatus.set(m.id, pending);
      renderCloud();
      try {
        const { body } = await post(path, payload);
        const message = body.message_fr || body.detail || "";
        if (mine) answerSwitch(mine, body, message);
        else cloudStatus.set(m.id, message);
      } catch (error) {
        if (mine && switching === mine) finishSwitch();
        cloudStatus.set(m.id, `La demande n'a pas abouti : ${error.message}. Réessayez.`);
      } finally {
        setBusy(false);
        loadDiagnostic();
      }
    }

    function setApiKey(m, key) {
      // The key goes out once, in this request; it is never shown nor sent back (AD-15).
      cloudIntention(m, "/api/intentions/set_api_key", { id: m.id, key }, "Enregistrement de la clé…");
    }

    function testCloud(m) {
      testResults.set(m.id, null);
      cloudIntention(m, "/api/intentions/test_cloud_model", { id: m.id }, "Test en cours…");
    }

    function openWarning(m, opener) {
      if (!m.warning) {
        // Without its warning, a cloud model cannot be confirmed, hence not chosen (AD-21).
        cloudStatus.set(m.id, "L'avertissement de ce modèle est indisponible (fichier " +
          "content/cloud.yaml absent ou invalide) : il ne peut pas être choisi tant que le " +
          "fichier n'est pas corrigé.");
        renderCloud();
        return;
      }
      warningFor = m;
      warningOpener = opener;
      document.getElementById("cloud-warning-title").textContent = m.warning.title_fr;
      const points = document.getElementById("cloud-warning-points");
      points.replaceChildren(...["sent_fr", "provider_fr", "unseen_fr"].map((k) => node("li", "", m.warning[k])));
      document.getElementById("cloud-warning-confirm").textContent = m.warning.confirm_fr;
      document.getElementById("cloud-warning-cancel").textContent = m.warning.cancel_fr;
      // In the page, never a browser dialog (EXPERIENCE.md cloud-warning); modal, so Échap
      // closes it and the rows behind wait.
      warningEl.showModal();
      document.getElementById("cloud-warning-confirm").focus();
    }

    // Échap, « Annuler » or « Utiliser ce modèle »: the warning is no longer pending.
    warningEl.addEventListener("close", () => {
      warningFor = null;
      if (warningOpener?.isConnected) warningOpener.focus();
      warningOpener = null;
    });
    document.getElementById("cloud-warning-cancel").addEventListener("click", () => {
      warningEl.close();
    });
    document.getElementById("cloud-warning-confirm").addEventListener("click", () => {
      const m = warningFor;
      warningEl.close();
      if (m && busy) {
        cloudStatus.set(m.id, "Une demande est déjà en cours : réessayez dans un instant.");
        renderCloud();
      } else if (m) {
        const mine = startSwitch((text) => {
          cloudStatus.set(m.id, text);
          renderCloud();
        });
        cloudIntention(
          m,
          "/api/intentions/select_model",
          { kind: "cloud", ref: m.id, acknowledged: true },
          "Choix en cours…",
          mine
        );
      }
    });

    // One `/api/diagnostic` request at a time; the calls made meanwhile give one more.
    let loading = null;
    let loadAgain = false;
    function loadDiagnostic() {
      if (loading) {
        loadAgain = true;
        return loading;
      }
      loading = fetchDiagnostic()
        .catch(() => {}) // the next event or intention reads it again
        .finally(() => {
          loading = null;
          if (loadAgain) {
            loadAgain = false;
            loadDiagnostic();
          }
        });
      return loading;
    }

    async function fetchDiagnostic() {
      const response = await fetch("/api/diagnostic");
      const body = await response.json();
      if (historyUpTo === null) historyUpTo = body.seq ?? 0;
      selectedModel = body.selected;
      loadedModel = body.loaded;
      cloud = body.cloud || cloud;
      renderCloud();
      renderCandidates(body.candidates || []);
      document.getElementById("open-link").hidden = !body.ready;
      // An outcome missed by the stream (a reconnection): the loaded model says it.
      const mine = switching;
      const active = body.loaded?.ref;
      if (mine?.answered && active === mine.ref) {
        // Named like `model_load_ended` would: the outcome reads the same whichever comes first.
        const text = `${body.loaded.label} est actif.`;
        setTimeout(() => { if (switching === mine) finishSwitch(text); }, 3000);
      }
    }

    // The stream replays the whole journal first. Its events up to `historyUpTo` (the
    // journal's `seq` when the page first read /api/diagnostic) are history: their lines
    // are shown, without reloading the lists nor being taken for a switch's outcome.
    let historyUpTo = null;

    // `live`: false for the history.
    function onEnvelope(event, handle) {
      const envelope = JSON.parse(event.data);
      handle(envelope.payload, historyUpTo === null || envelope.seq > historyUpTo);
    }

    function openStream() {
      const source = new EventSource("/api/diagnostic/stream");
      source.addEventListener("diagnostic_check", (event) => onEnvelope(event, renderCheck));
      source.addEventListener("harness_error", (event) => onEnvelope(event, renderHarnessError));
      source.addEventListener("model_load_ended", (event) => onEnvelope(event, onModelLoadEnded));
    }
    loadDiagnostic().then(openStream);

    function onModelLoadEnded(payload, live) {
      if (!live) return; // an earlier load: the lists already show where it led
      if (switching) {
        const text = payload.status === "ok"
          ? [`${payload.model.label} est actif.`, payload.reason_fr].filter(Boolean).join(" ")
          : payload.reason_fr || `${payload.model.label} n'a pas pu être chargé.`;
        const ref = payload.model.ref;
        if (!switching.answered) switching.outcomes.set(ref, text); // matched by the answer
        else if (ref === switching.ref) finishSwitch(text); // another model's load: ignored
      }
      loadDiagnostic();
    }

    function setBusy(value) {
      busy = value;
      for (const button of document.querySelectorAll("button.choose")) {
        button.disabled = value || button.dataset.blocked === "true";
      }
    }

    async function chooseModel(model) {
      if (busy) return;
      setBusy(true);
      selectStatusEl.textContent = "Vérification en cours…";
      const mine = startSwitch((text) => {
        selectStatusEl.textContent = text;
      });
      try {
        const response = await fetch("/api/intentions/select_model", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(model),
        });
        const body = await response.json();
        answerSwitch(mine, body, body.message_fr || body.detail ||
          (body.ready ? "Modèle prêt." : "Voir ci-dessus."));
      } catch (error) {
        if (switching === mine) finishSwitch();
        selectStatusEl.textContent = `La demande n'a pas abouti : ${error.message}. Réessayez.`;
      } finally {
        setBusy(false);
        loadDiagnostic();
      }
    }

    document.getElementById("submit-path").addEventListener("click", () => {
      const path = document.getElementById("model-path").value.trim();
      if (path) chooseModel({ kind: "file", ref: path });
    });
  </script>
</body>
</html>
