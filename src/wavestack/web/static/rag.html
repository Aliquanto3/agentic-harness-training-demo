<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <script src="/static/theme.js"></script>
  <script type="module" src="/static/i18n.js"></script>
  <script type="module" src="/static/site-nav.js"></script>
  <title data-i18n="rag.page_title">WaveStack — Atelier RAG</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/static/fonts.css" />
  <link rel="stylesheet" href="/static/tokens.css" />
  <link rel="stylesheet" href="/static/pages.css" />
  <link rel="stylesheet" href="/static/rag.css" />
</head>
<body class="rag-page">
  <!-- Story 2 (2026-09-30): the bar shared by the five pages, the same HTML in each but for
       `aria-current` and, on the main screen only, the projection mode (site-nav.js). -->
  <nav class="site-nav" aria-label="Pages de WaveStack" data-i18n-aria-label="common.links.pages" data-i18n-links>
    <a href="/" class="site-nav-brand">WaveStack</a>
    <a href="/">Atelier</a>
    <a href="/llm" title="LLM nu : l'intérieur du modèle actif (tokens, vecteurs, génération token par token)" data-i18n-title="common.links.llm_title">LLM nu</a>
    <a href="/rag" title="Atelier RAG : l'architecture RAG à manipuler (découpage, embedding, base vectorielle, recherche, reranking)" data-i18n-title="common.links.rag_title" aria-current="page">Atelier RAG</a>
    <a href="/diagnostic">Diagnostic</a>
    <a href="/models">Modèles</a>
    <div class="display-menu" id="display-menu">
      <button type="button" id="display-menu-toggle" class="display-menu-toggle" aria-haspopup="true" aria-expanded="false" aria-controls="display-menu-panel" aria-label="Affichage" data-i18n-aria-label="common.display.menu"><span class="display-menu-symbol" data-theme-symbol aria-hidden="true">◐</span> <span class="display-menu-word" data-i18n="common.display.menu">Affichage</span> <span class="language-picker-code" id="language-picker-code" aria-hidden="true">FR</span> ▾</button>
      <div id="display-menu-panel" class="display-menu-panel" role="group" aria-label="Affichage" data-i18n-aria-label="common.display.menu" hidden>
        <label class="display-menu-row"><span class="display-menu-label" data-i18n="common.display.theme">Thème</span>
          <span class="theme-picker-box" id="theme-picker-box">
            <select id="theme-picker" class="theme-picker" data-theme-picker autocomplete="off" aria-label="Thème de l'interface" data-i18n-aria-label="common.theme.name" title="Thème de l'interface" data-i18n-title="common.theme.name">
              <option value="system" data-i18n="common.theme.system">◐ Système</option>
              <option value="light" data-i18n="common.theme.light">☀ Clair</option>
              <option value="dark" data-i18n="common.theme.dark">☾ Sombre</option>
            </select>
          </span>
        </label>
        <label class="display-menu-row"><span class="display-menu-label" data-i18n="common.language.name">Langue</span>
          <span class="language-picker-box" id="language-picker-box">
            <select id="language-picker" class="language-picker" autocomplete="off" aria-label="Langue" data-i18n-aria-label="common.language.name">
              <option value="fr" lang="fr">Français</option>
              <option value="en" lang="en">English</option>
              <option value="de" lang="de">Deutsch</option>
            </select>
          </span>
        </label>
        <p class="display-menu-alert" id="display-menu-alert" role="alert" hidden></p>
      </div>
    </div>
  </nav>

  <main class="rag-main">
    <header class="rag-header">
      <h1 id="rag-title">Atelier RAG : l'architecture RAG à manipuler</h1>
      <p class="rag-intro" id="rag-intro"></p>
      <p class="rag-error" id="rag-content-error" role="alert" hidden></p>
      <p class="rag-busy" id="rag-busy" role="status" hidden></p>
    </header>

    <section class="rag-section" id="sec-chain" aria-labelledby="sec-chain-title">
      <h2 class="rag-section-title" id="sec-chain-title"><span class="rag-step" aria-hidden="true">1</span> <span data-text="chain_title_text">La chaîne</span></h2>
      <p class="rag-note" data-text="chain_help_text"></p>
      <h3 class="rag-chain-title" id="rag-chain-title-a" data-i18n="rag.chain_a" hidden>Chaîne A</h3>
      <ol class="rag-chain" id="rag-chain" aria-label="Étapes de la chaîne RAG" data-i18n-aria-label="rag.chain_steps" data-lane="a"></ol>
      <p class="rag-chain-refusal-general" id="rag-chain-refusal-a" hidden></p>
      <div class="rag-palette" id="rag-palette-a"></div>
      <h3 class="rag-chain-title" id="rag-chain-title-b" data-i18n="rag.chain_b" hidden>Chaîne B</h3>
      <ol class="rag-chain" id="rag-chain-b" aria-label="Étapes de la chaîne B" data-i18n-aria-label="rag.chain_b_steps" data-lane="b" hidden></ol>
      <p class="rag-chain-refusal-general" id="rag-chain-refusal-b" hidden></p>
      <p class="rag-visually-hidden" id="rag-refusal-live" role="status" aria-live="polite"></p>
      <div class="rag-palette" id="rag-palette-b"></div>
      <div class="rag-actions">
        <label class="rag-compare"><input type="checkbox" id="rag-compare" /> <span data-text="compare_text">Comparer avec une autre configuration</span></label>
        <button type="button" id="rag-reset-chain" class="rag-button-secondary" data-text="reset_chain_text">Revenir à la chaîne livrée</button>
      </div>
    </section>

    <section class="rag-section" id="sec-question" aria-labelledby="sec-question-title">
      <h2 class="rag-section-title" id="sec-question-title"><span class="rag-step" aria-hidden="true">2</span> <span data-text="question_label_text">Question</span></h2>
      <label class="rag-label" for="rag-question" data-text="question_label_text">Question</label>
      <input type="text" id="rag-question" class="rag-question" maxlength="500" autocomplete="off" />
      <div class="rag-actions">
        <button type="button" id="rag-run" class="rag-button-primary" data-text="run_text">Lancer la chaîne</button>
        <button type="button" id="rag-stop" class="rag-button-secondary" data-text="stop_text" disabled>Arrêter</button>
        <span class="rag-status" id="rag-status" role="status" aria-live="polite"></span>
      </div>
    </section>

    <section class="rag-section" id="sec-results" aria-labelledby="sec-results-title">
      <h2 class="rag-section-title" id="sec-results-title"><span class="rag-step" aria-hidden="true">3</span> <span data-text="results_title_text">Ce que fait chaque étape</span></h2>
      <p class="rag-note" id="rag-results-empty" data-text="results_empty_text"></p>
      <p class="rag-run-summary" id="rag-run-summary" role="status" hidden></p>
      <div class="rag-results" id="rag-results"></div>
      <section class="rag-comparison" id="rag-comparison" aria-labelledby="rag-comparison-title" hidden>
        <h3 class="rag-comparison-title" id="rag-comparison-title" data-text="comparison_title_text">Comparaison des deux contextes</h3>
        <p class="rag-comparison-summary" id="rag-comparison-summary"></p>
        <dl class="rag-comparison-lists" id="rag-comparison-lists"></dl>
      </section>
    </section>
  </main>

  <script type="module" src="/static/rag.js"></script>
</body>
</html>
