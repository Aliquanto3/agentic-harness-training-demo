<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>WaveStack</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/static/tokens.css" />
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <header class="top-bar">
    <span class="top-bar-title">WaveStack</span>
    <div class="gauge" id="gauge">
      <div class="gauge-bar" id="gauge-bar" role="img" aria-label="Jauge de contexte">
        <span class="gauge-threshold" id="gauge-threshold" hidden></span>
      </div>
      <span class="gauge-figures" id="gauge-figures">Contexte : en attente du modèle</span>
    </div>
    <div class="pane-chips" id="pane-chips"></div>
    <div class="pane-menu">
      <button id="pane-menu-toggle" type="button" aria-haspopup="true" aria-expanded="false">
        Volets ▾
      </button>
      <ul id="pane-menu-list" class="pane-menu-list" hidden></ul>
    </div>
  </header>

  <main class="layout" id="layout">
    <section class="pane" data-pane="bricks">
      <header class="pane-header">
        <h2 class="pane-title">Panneau des briques</h2>
        <div class="pane-actions">
          <button type="button" class="pane-focus" data-action="focus" title="Mode focus" aria-label="Mode focus">⛶</button>
          <button type="button" class="pane-hide" data-action="hide" title="Masquer le volet" aria-label="Masquer le volet">—</button>
        </div>
      </header>
      <div class="pane-body">
        <p class="empty-note">
          Aucune brique active. Le panneau des briques arrive à la story 4.
        </p>
      </div>
    </section>

    <div class="right">
      <div class="top-row">
        <section class="pane" data-pane="human">
          <header class="pane-header">
            <h2 class="pane-title">Vue humain</h2>
            <div class="pane-actions">
              <button type="button" class="pane-focus" data-action="focus" title="Mode focus" aria-label="Mode focus">⛶</button>
              <button type="button" class="pane-hide" data-action="hide" title="Masquer le volet" aria-label="Masquer le volet">—</button>
            </div>
          </header>
          <div class="pane-body pane-body-human">
            <div class="chat" id="chat"></div>
            <div class="sr-only" id="chat-live" aria-live="polite"></div>
            <p class="composer-reason" id="composer-reason" hidden></p>
            <form class="composer" id="composer">
              <input id="composer-input" type="text" autocomplete="off"
                     aria-label="Message" placeholder="Écrivez un message, puis Entrée" />
              <button type="submit" id="composer-send">Envoyer</button>
              <button type="button" id="composer-stop" class="composer-stop" hidden>Arrêter</button>
            </form>
          </div>
        </section>

        <section class="pane" data-pane="ctx">
          <header class="pane-header">
            <h2 class="pane-title">Contexte LLM</h2>
            <div class="pane-actions">
              <button type="button" class="pane-focus" data-action="focus" title="Mode focus" aria-label="Mode focus">⛶</button>
              <button type="button" class="pane-hide" data-action="hide" title="Masquer le volet" aria-label="Masquer le volet">—</button>
            </div>
          </header>
          <div class="pane-body" id="ctx"></div>
        </section>

        <section class="pane" data-pane="orch">
          <header class="pane-header">
            <h2 class="pane-title">Orchestration</h2>
            <div class="pane-actions">
              <button type="button" class="pane-focus" data-action="focus" title="Mode focus" aria-label="Mode focus">⛶</button>
              <button type="button" class="pane-hide" data-action="hide" title="Masquer le volet" aria-label="Masquer le volet">—</button>
            </div>
          </header>
          <div class="pane-body">
            <div class="steps" id="steps"></div>
            <ul class="journal" id="journal"></ul>
          </div>
        </section>
      </div>

      <section class="pane" data-pane="schema">
        <header class="pane-header">
          <h2 class="pane-title">Schéma d'architecture</h2>
          <div class="pane-actions">
            <button type="button" class="pane-focus" data-action="focus" title="Mode focus" aria-label="Mode focus">⛶</button>
            <button type="button" class="pane-hide" data-action="hide" title="Masquer le volet" aria-label="Masquer le volet">—</button>
          </div>
        </header>
        <div class="pane-body pane-body-schema">
          <svg id="schema-svg" viewBox="0 0 480 140" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
