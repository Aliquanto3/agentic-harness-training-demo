# Descriptions des outils du serveur MCP local (story 6, AD-19), lues par le modèle dans la
# variable `tools` du gabarit ; le serveur les lit au lancement, dans sa langue.
list_terms: Liste les termes du glossaire du démonstrateur WaveStack, un par ligne.
define_term: >-
  Donne la définition d'une notion du démonstrateur WaveStack (harnais, contexte, outil,
  MCP, skill, hook, RAG…). Appeler list_terms pour connaître les termes.
system_info: >-
  Lit la RAM (totale et disponible) et l'état du système (cœurs CPU, plateforme) du poste
  où WaveStack tourne.
create_path: >-
  Crée un fichier ou un dossier dans le bac à sable de WaveStack (jamais ailleurs sur le
  poste). Paramètres : path (chemin relatif au bac à sable), kind (« file » ou « folder »,
  « file » par défaut), content (le texte du fichier, optionnel).
take_screenshot: >-
  Prend une capture de l'écran principal et l'enregistre dans le bac à sable de WaveStack ;
  seuls son chemin et sa taille sont renvoyés, jamais l'image elle-même.
