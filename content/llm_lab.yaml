loading:
  empty_text: "Aucun chargement depuis le lancement de WaveStack."
  running_text: "Chargement en cours… {duree}"
  total_text: "{modele} : {statut} en {duree}"
  local_text: "En local : RAM du CPU, pas de GPU. Le modèle tourne sur le processeur de ce poste."
  status:
    ok: "chargé"
    restored: "échec, modèle précédent rechargé"
    cancelled: "chargement arrêté"
    error: "échec"

reasoning:
  toggle_text: "Raisonner avant de répondre"
  always_text: "Toujours : ce modèle raisonne à chaque réponse."
  thinking_text: "Réflexion"
  answer_text: "Réponse"
  empty_text: "Rien pour l'instant."
  # Correctif nuit du 2026-10-01 (restes différés) : même accord que `generation.count_text`.
  count_text:
    one: "{tokens} token"
    other: "{tokens} tokens"
  fragments_count_text:
    one: "{tokens} fragment"
    other: "{tokens} fragments"
  reserve_text:
    one: "Réserve de sortie : {reserve} token quand le modèle raisonne."
    other: "Réserve de sortie : {reserve} tokens quand le modèle raisonne."

candidates:
  toggle_text: "Montrer les tokens candidats"
  help_text: >-
    Pour chaque token produit, les cinq tokens que le modèle jugeait les plus probables à cet
    endroit. Survolez une puce, donnez-lui le focus ou cliquez dessus.
  title_text: "Candidats du token {index}"
  probability_text: "probabilité du modèle"
  chance_text: "chance d'être tiré : {chance}"
  dropped_text: "écarté par top-k, top-p ou min-p"
  chosen_text: "tiré"
  legend_text: >-
    La probabilité du modèle vient de ses logits (température 1). Dans l'ordre de llama.cpp,
    top-k, top-p et min-p écartent des candidats, puis la température redistribue la chance
    d'être tiré entre ceux qui restent.

# Story 5 du 2026-09-30 : la distribution vivante (étape 3 depuis le lot 6), la
# comparaison A/B (section 6), le schéma de la fenêtre (section 5).
distribution:
  title_text: "Ce que les réglages font aux candidats"
  intro_text: >-
    Les candidats d'un token déjà produit, tels que le modèle les a vus. Bougez un curseur :
    WaveStack recalcule qui reste en lice et la chance de chacun d'être tiré, sans nouvelle
    génération. La probabilité du modèle, elle, ne bouge pas.
  empty_text: >-
    Tirez le token suivant, ci-dessous. Générez une réponse avec « Montrer les tokens
    candidats » coché (section 6) : les candidats de son premier token apparaîtront aussi ici.
  token_text: "Token {index} de la dernière génération (A pour une comparaison) : {texte}. Cliquez sur une autre puce de la section 6 pour la choisir."
  probability_text: "Probabilité du modèle"
  chance_text: "Chance d'être tiré"
  dropped_text: "écarté"
  kept_text: "{gardes} candidats gardés parmi les {lus} plus probables lus."
  more_text: "… et {reste} autres candidats lus, plus bas, non affichés."
  tail_text: "Reste du vocabulaire"
  tail_help_text: >-
    WaveStack garde les {lus} candidats les plus probables de chaque token ; le reste du
    vocabulaire pèse {reste} de la probabilité. La chance d'être tiré est répartie entre les
    candidats gardés seulement : une approximation, fidèle tant que ce reste est petit.

compare:
  title_text: "Comparer deux réglages"
  intro_text: >-
    Le même prompt, généré deux fois : A avec les réglages de l'étape 3, B avec ceux
    ci-dessous. Un seul modèle tourne sur le processeur : B commence quand A a fini.
    « Arrêter » arrête les deux.
  b_settings_text: "Réglages B"
  button_text: "Comparer"
  running_text: "Comparaison en cours : A, puis B…"
  lane_a_text: "A"
  lane_b_text: "B"
  waiting_text: "En attente de la fin de A."
  empty_text: "Rien pour l'instant."

window:
  title_text: "La fenêtre, token après token"
  prompt_text: "Prompt : {tokens}"
  free_text: "Libre"
  reserve_text: "Réserve de sortie : {reserve}"
  # Correctif nuit du 2026-10-01 (restes différés) : « Réponse : 1 tokens ».
  output_text:
    one: "Réponse : {tokens} token"
    other: "Réponse : {tokens} tokens"
  output_fragments_text:
    one: "Réponse : {tokens} fragment reçu"
    other: "Réponse : {tokens} fragments reçus"
  caption_text: >-
    La fenêtre compte {fenetre} tokens : {utilisables} pour le prompt, {reserve} gardés pour
    la réponse. À chaque pas, le modèle relit toute la fenêtre remplie jusque-là (le cache lui
    évite de tout recalculer) et le token tiré s'ajoute au bout : la tête de lecture glisse
    d'un token. Un prompt plus long que sa part n'est pas envoyé.
