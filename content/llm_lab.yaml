sampling:
  reset_text: "Revenir aux valeurs du harnais"
  unsupported_text: "Non réglable"
  settings:
    temperature:
      label_text: "Température"
      help_text: >-
        Aplatit ou creuse les probabilités avant le tirage. À 0, le modèle prend toujours le
        token le plus probable (réponse identique à chaque fois) ; au-dessus de 1, les tokens
        peu probables ont leur chance.
    top_k:
      label_text: "Top-k"
      help_text: >-
        Ne garde que les k tokens les plus probables ; tous les autres sont écartés avant le
        tirage. À 0, top-k est désactivé : aucun token n'est écarté par lui.
    top_p:
      label_text: "Top-p"
      help_text: >-
        Garde les tokens les plus probables jusqu'à ce que leurs probabilités cumulées
        atteignent p ; 1 n'écarte rien.
    min_p:
      label_text: "Min-p"
      help_text: >-
        Écarte tout token dont la probabilité est inférieure à min-p fois celle du plus
        probable ; 0 n'écarte rien.

