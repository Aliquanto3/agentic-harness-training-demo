  special_text: "spécial"
  special_help_text: >-
    Token spécial : un marqueur du gabarit (début ou fin de message), lu comme un seul
    token.
  blanks_text: "␣ marque une espace, ↵ un retour à la ligne : ils sont des tokens comme les autres."
  exact_text: "Découpage exact, par le tokenizer du modèle actif."
  estimate_text: >-
    Estimation du harnais : ≈ {estimation} tokens ({caracteres} caractères, à raison de
    {ratio} caractères par token).
  empty_text: "Découpez un texte : ses tokens apparaîtront ici."

vectorization:
  title_text: "Du texte au vecteur"
  help_text: >-
    Chaque identifiant choisit une ligne de la table d'embedding. Cette ligne est un vecteur
    de nombres, que les couches du modèle transforment l'une après l'autre.
  unknown_text: "inconnue"
  steps:
    text_text: "Texte"
    tokens_text: "Tokens"
    ids_text: "Identifiants"
    table_text: "Table d'embedding"
    table_caption_text: "{vocabulaire} lignes (vocabulaire) × {dimension} colonnes (dimension)"
    params_text: "nombres appris : {parametres}"
    vector_text: "Vecteur"
    vector_caption_text: "{dimension} nombres par token"
    layers_text: "Couches"
    layers_caption_text: "{couches} couches, {tetes} têtes d'attention"
    layers_only_caption_text: "{couches} couches"

sampling:
  reset_text: "Revenir aux valeurs du harnais"
  unsupported_text: "Non réglable"
  settings:
    temperature:
      label_text: "Température"
      help_text: >-
        Aplatit ou creuse les probabilités avant le tirage. À 0, le modèle prend toujours le
        token le plus probable (réponse identique à chaque fois) ; au-dessus de 1, les tokens
        peu probables ont leur chance.
    top_k:
      label_text: "Top-k"
      help_text: >-
        Ne garde que les k tokens les plus probables ; tous les autres sont écartés avant le
        tirage. À 0, top-k est désactivé : aucun token n'est écarté par lui.
    top_p:
      label_text: "Top-p"
      help_text: >-
        Garde les tokens les plus probables jusqu'à ce que leurs probabilités cumulées
        atteignent p ; 1 n'écarte rien.
    min_p:
      label_text: "Min-p"
      help_text: >-
        Écarte tout token dont la probabilité est inférieure à min-p fois celle du plus
        probable ; 0 n'écarte rien.

