candidates:
  toggle_text: "Montrer les tokens candidats"
  help_text: >-
    Pour chaque token produit, les cinq tokens que le modèle jugeait les plus probables à cet
    endroit. Survolez une puce, donnez-lui le focus ou cliquez dessus.
  title_text: "Candidats du token {index}"
  probability_text: "probabilité du modèle"
  chance_text: "chance d'être tiré : {chance}"
  dropped_text: "écarté par top-k, top-p ou min-p"
  chosen_text: "tiré"
  legend_text: >-
    La probabilité du modèle vient de ses logits (température 1). Dans l'ordre de llama.cpp,
    top-k, top-p et min-p écartent des candidats, puis la température redistribue la chance
    d'être tiré entre ceux qui restent.
