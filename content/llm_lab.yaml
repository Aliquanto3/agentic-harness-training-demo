# Écran « LLM nu » (story 29, AD-19) : les textes de la page /llm, validés par pydantic
# (wavestack.session.llm_lab.LabContent). Un fichier invalide : la page reste servie et dit
# pourquoi. `{…}` : un nombre ou un nom que la session met en forme et que la page place.

title_fr: "LLM nu : l'intérieur du modèle"
intro_fr: >-
  Ici, aucune brique : ni prompt système, ni historique, ni outil, ni mémoire. On regarde ce
  que fait le modèle lui-même : découper le texte en tokens, les transformer en vecteurs,
  puis produire une réponse, token par token. Cet écran travaille sur le modèle actif de
  l'atelier, sans toucher à sa conversation.
back_fr: "← Atelier"
change_model_fr: "Changer de modèle dans l'atelier"
active_model_fr: "Modèle actif"
no_model_fr: "Aucun modèle actif : choisissez-en un dans l'atelier."
busy_fr: "Indisponible pour l'instant : {raison}"

sections:
  tokenization:
    title_fr: "Tokenisation et vectorisation"
    intro_fr: >-
      Le modèle ne lit pas des lettres : son tokenizer découpe le texte en tokens, des
      morceaux de mots pris dans un vocabulaire fixe. Chaque token a un identifiant, un
      simple numéro de ligne dans la table d'embedding, qui le transforme en vecteur de
      nombres.
  sampling:
    title_fr: "Réglages d'échantillonnage"
    intro_fr: >-
      À chaque pas, le modèle donne une probabilité à chaque token du vocabulaire. Ces
      réglages décident comment le token suivant est tiré parmi eux.
  loading:
    title_fr: "Chargement du modèle"
    intro_fr: >-
      Avant de répondre, le modèle doit être en mémoire. Voici les étapes du dernier
      chargement, leur durée et la mémoire qu'il occupe.
  reading:
    title_fr: "Lecture du prompt"
    intro_fr: >-
      Le prompt est rendu avec le gabarit du modèle, puis lu d'un bloc : c'est le temps
      d'attente avant le premier token.
  generation:
    title_fr: "Génération"
    intro_fr: >-
      Le modèle produit sa réponse un token à la fois : chaque token tiré est relu pour
      tirer le suivant.
  reasoning:
    title_fr: "Raisonnement"
    intro_fr: >-
      Un modèle qui raisonne écrit d'abord une réflexion, puis sa réponse. Les deux sont des
      tokens produits de la même façon.

