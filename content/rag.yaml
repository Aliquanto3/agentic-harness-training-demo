# Brique « RAG » : corpus de démonstration et textes de la brique (story 15, AD-19, AD-22).
# Textes fictifs rédigés pour WaveStack : « Exemplia » est une organisation imaginaire, et
# ces documents originaux sont sous la licence du dépôt.
notice_text: >-
  Textes fictifs rédigés pour WaveStack : Exemplia est une organisation imaginaire, ses
  règles ne décrivent aucune entreprise réelle.

# Placé avant les extraits, dans le message de l'utilisateur du tour.
intro_text: >-
  Extraits de la documentation interne d'Exemplia retrouvés par le harnais pour cette
  question. Ils ne sont pas forcément tous pertinents : appuie-toi sur ceux qui répondent
  et cite le document utilisé.

# Un extrait : {position} (rang, à partir de 1), {title_text} (document), {text}.
excerpt_format_text: "Extrait {position} — {title_text} :\n{text}"

# Où vont les extraits (étape « Recherche RAG » de l'Orchestration).
placement_text: Dans le message de l'utilisateur de ce tour, avant la question

# Indicateur de travail pendant la recherche.
phase_label_text: Recherche dans le corpus…

# Nœud du schéma qui représente l'index.
index_label_text: Index RAG (rag_index.sqlite)

# Bouton de la carte quand le modèle d'embedding manque ({size_mb} : taille en Mo).
download_label_text: "Télécharger le modèle d'embedding (≈ {size_mb} Mo)"

# Bouton de la carte quand le modèle est là et l'index absent, périmé ou d'un autre modèle.
build_label_text: Construire l'index

# Sous-option « Reranking » de la carte (story 16).
rerank_label_text: Reranking

# Indicateur de travail pendant le reranking.
rerank_phase_label_text: Reranking des extraits…

# Placement affiché par l'étape « Recherche RAG » quand le reranking suit ({candidates} :
# candidats retenus par l'embedding, {keep} : extraits gardés).
rerank_search_placement_text: >-
  Aucun directement : ces {candidates} candidats passent au reranking, qui n'en garde que
  {keep}

# Placement affiché par l'étape « Reranking ».
rerank_placement_text: >-
  Les {keep} premiers après reranking, dans le message de l'utilisateur de ce tour, avant la
  question

# Bouton de la sous-option quand le modèle de reranking manque ({size_mb} : taille en Mo).
rerank_download_label_text: "Télécharger le modèle de reranking (≈ {size_mb} Mo)"

