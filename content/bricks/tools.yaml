# Brique « Outils » (AD-12, AD-19).
label_text: Outils
category_text: harness engineering
hosting_text: Local
explanation_text:
  - >-
    Un modèle ne fait qu'écrire du texte : il ne connaît pas l'heure, calcule
    approximativement et ne lit aucun fichier. Le harnais lui décrit des outils ; le
    modèle répond par une demande d'appel, que le harnais vérifie, exécute, puis
    réinjecte dans le contexte avant de rappeler le modèle.
  - >-
    Les cinq étapes (description, demande, exécution, réinjection, réponse) et
    chaque échec s'affichent dans le volet Orchestration.
# Story 23 : ce qui sort du poste et où le lire. La session remplit {tools} (outils
# réseau déclarés) et {servers} (serveurs MCP publics).
outbound_text: >-
  Peuvent sortir du poste : {tools}, ainsi que les serveurs MCP publics ({servers}) de la
  brique MCP. Ce qu'ils envoient (adresse, en-têtes, corps) : volet Orchestration,
  bloc « 🌐 Données sortantes » de leur étape ; un clic sur leur nœud 🌐 du schéma y
  mène.
