# Brique « Raisonnement » (AD-6, AD-12, AD-19).
label_text: Raisonnement
category_text: prompt engineering
hosting_text: Local
explanation_text:
  - >-
    Certains modèles savent « réfléchir à voix haute » avant de répondre : ils écrivent
    d'abord un raisonnement, puis la réponse. Le harnais allume ce mode en local par une
    variable du gabarit de conversation, en cloud par un paramètre de la requête.
  - >-
    Le raisonnement est toujours visible dans Contexte LLM. Dans la Vue humain, l'option
    « Afficher le raisonnement » le montre ou le masque, comme le font les chatbots.
  - - "Gain : des réponses souvent plus justes sur un calcul ou un problème en plusieurs étapes."
    - >-
      Coût : plus de tokens de sortie, donc plus de temps. La réserve de sortie passe de
      512 à 1 536 tokens, ce qui laisse moins de place au contexte. En local, ces 1 536
      tokens se partagent entre la réflexion, jusqu'au budget de réflexion (768 tokens par
      défaut, réglage [reasoning] budget_tokens, en local), et la réponse : une réflexion qui
      atteint ce budget sans se fermer est fermée par le harnais, et le reste de la réserve va
      à la réponse.
  - >-
    Indisponible si le modèle actif ne sait pas raisonner. Certains modèles cloud raisonnent
    toujours : la brique s'affiche alors « toujours active pour ce modèle ».
