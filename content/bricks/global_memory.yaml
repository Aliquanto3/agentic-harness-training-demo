# Brique « Mémoire globale » (AD-12, AD-19, AD-20).
label_text: Mémoire globale
category_text: context engineering
hosting_text: Local
explanation_text:
  - >-
    La mémoire courte s'efface avec la conversation. La mémoire globale, elle, survit :
    le harnais garde quelques informations dans un fichier local, memory.json, et les
    replace dans le message système au début de chaque conversation.
  - >-
    Le modèle n'a aucun souvenir : il écrit en mémoire en appelant un outil du harnais,
    remember, et c'est le harnais qui écrit le fichier. Vous pouvez aussi forcer une
    écriture, ou consulter, modifier et effacer les entrées depuis « Modifier la mémoire ».
  - - "Gain : le modèle « se souvient » d'une conversation à l'autre, même après un redémarrage."
    - >-
      Coût : chaque entrée occupe le contexte à chaque appel, qu'elle serve ou non ; une
      information fausse ou périmée est relue tant qu'on ne l'efface pas.
    - >-
      Données : avec un modèle cloud, chaque entrée part chez le fournisseur à chaque appel,
      dans le message système. N'y mettez jamais de secret.
  - >-
    Une entrée écrite (par le modèle, par une écriture forcée ou dans « Modifier la
    mémoire ») est aussitôt dans le fichier, mais n'entre dans le message système qu'à la
    prochaine conversation : après « Vider la conversation » ou un changement de scénario.
    Une suppression ou une modification, elle, s'applique aussitôt. Le message système
    reste ainsi identique d'un tour à l'autre, et le moteur réutilise son cache au lieu de
    relire tout le contexte. « Réinitialiser » restaure la mémoire de
    démonstration.
