# Brique « MCP » (AD-12, AD-19).
label_fr: MCP
category_fr: harness engineering
hosting_fr: Local
explanation_fr: >-
  Un serveur MCP est un programme séparé du harnais, sur le poste ou sur Internet,
  qui expose ses propres outils. À l'activation d'un serveur, le harnais s'y
  connecte, lui demande la liste de ses outils, puis la décrit au modèle comme ses
  outils natifs, sous le nom « serveur__outil ». La documentation complète de
  chaque outil entre dans le contexte : la jauge montre ce qu'elle pèse, serveur
  par serveur. Un serveur public reçoit les données de chaque appel : elles
  s'affichent dans le volet Orchestration avant le résultat.
