# Brique « MCP » (AD-12, AD-19).
label_text: MCP
category_text: harness engineering
hosting_text: Local
explanation_text:
  - >-
    Un serveur MCP est un programme séparé du harnais, sur le poste ou sur Internet,
    qui expose ses propres outils. À l'activation d'un serveur, le harnais s'y
    connecte, lui demande la liste de ses outils, puis la décrit au modèle comme ses
    outils natifs, sous le nom « serveur__outil ».
  - - >-
      En documentation complète : la documentation de chaque outil entre dans le
      contexte, et la jauge montre ce qu'elle pèse, serveur par serveur.
    - >-
      En lazy loading : le modèle ne voit qu'une ligne par outil dans le
      méta-outil load_tool_doc, et le harnais ne charge une documentation que
      lorsque le modèle la demande. Une documentation chargée répond à l'appel
      pendant le tour. Avec un modèle local, elle reste ensuite dans
      l'historique, comme tout résultat d'outil, pour que le moteur réutilise son
      cache ; avec un modèle cloud, elle rejoint la liste des outils dès l'appel
      suivant (l'historique n'en garde qu'un court talon). Elle reste chargée
      jusqu'à « Vider la conversation ».
  - >-
    Cocher « Lazy loading » montre aussitôt dans la jauge l'écart de tokens entre
    les deux modes. Un serveur public reçoit les données de chaque appel : elles
    s'affichent dans le volet Orchestration avant le résultat.
# Story 23 : ce qui sort du poste et où le lire. La session remplit {servers}
# (serveurs MCP publics).
outbound_text: >-
  Peuvent sortir du poste : {servers}. Ce qu'ils reçoivent (adresse, en-têtes, corps) :
  volet Orchestration, bloc « 🌐 Données sortantes » de la connexion et de chaque
  appel ; un clic sur leur nœud 🌐 du schéma y mène.
