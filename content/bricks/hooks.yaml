# Brique « Hooks » (AD-12, AD-13, AD-19).
label_fr: Hooks
category_fr: harness engineering
hosting_fr: Local
explanation_fr:
  - >-
    Un hook est du code déterministe que le harnais exécute à un point fixe du tour :
    réception du message, avant l'appel au modèle, avant et après un outil, fin du
    tour. Ce n'est pas le modèle qui décide : le hook laisse passer, modifie,
    bloque ou demande l'avis d'un humain, et chaque décision s'affiche dans
    Orchestration.
  - - >-
      Le garde-fou empêche la lecture du dossier confidentiel même quand le
      modèle la demande (sécurité, DLP).
    - "La journalisation écrit un journal d'audit que le modèle ne voit pas."
    - "L'injection de contexte ajoute la date et les règles de la mission avant chaque message."
    - >-
      La validation humaine, à cocher dans la carte, suspend le tour avant
      l'appel d'un outil réseau et vous montre la requête exacte, qui ne part
      que si vous l'autorisez (human in the loop).
  - >-
    Comparez avec l'outil « Heure et date » : pour le même besoin, l'outil
    laisse le modèle choisir de demander l'heure, le hook la lui donne à chaque tour,
    qu'il en ait besoin ou non. Deux architectures, deux coûts en tokens.
