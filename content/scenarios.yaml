# Programme de formation et scénarios par brique (stories 10 et 21, AD-19, FR-38, FR-40).
# Chaque scénario déclare sa configuration complète, pas un écart au précédent :
# lancer le premier scénario d'un module active déjà les briques des modules précédents
# (CAP-40), avec deux exceptions tenues par la fenêtre de contexte (AD-9), que la consigne
# du scénario rappelle :
# - le raisonnement, montré au module 1, n'est reconduit dans aucun module suivant : sa
#   réserve de sortie de 1 536 tokens ôte 1 024 tokens utiles à chaque appel et allonge
#   chaque tour (NFR-1) ; rallumez-le à la main pour le montrer à l'œuvre ;
# - « MCP en documentation complète » laisse le RAG éteint : ses extraits s'ajouteraient
#   à une documentation déjà près de la limite ; « Lazy loading », qui le suit, le rallume.
# Le premier scénario d'un module restaure aussi la mémoire globale de démonstration
# (`restore_memory`) : un module démarré directement part toujours de la même mémoire, et une
# mémoire remplie au module précédent ne déborde pas la fenêtre.
# Les scénarios suivants d'un module, les transverses et les scénarios métier fixent
# librement leur configuration, au plus près de la brique qu'ils montrent.
# `bricks` : briques voulues ; `tools`, `mcp_servers`, `skills`, `hooks` : sous-options
# activées (absentes = valeurs de lancement) ; `mcp_lazy` : lazy loading (faux par défaut) ;
# `rag_rerank` : reranking des extraits RAG (faux par défaut) ; `restore_memory` : restaure la
# mémoire globale de démonstration au lancement ; `expects_overflow` : le premier appel
# déborde volontairement la fenêtre (AD-9, aucun scénario fourni aujourd'hui) ;
# `prompts` : prompts suggérés au-dessus du champ de saisie.
# `transverse` : scénarios hors modules, listés après eux : l'hébergement (FR-38), puis les
# scénarios métier (FR-40). Un nouveau métier s'ajoute ici, sans modifier le code.

program:
  - title_fr: Du LLM nu au harnais
    duration_min: 60
    scenarios: [bare_llm, reasoning, short_memory, system_prompt, global_memory]
  - title_fr: Outils
    duration_min: 45
    scenarios: [native_tools, network_tools]
  - title_fr: RAG
    duration_min: 45
    scenarios: [rag, rag_rerank]
  - title_fr: MCP
    duration_min: 45
    scenarios: [mcp_full, mcp_lazy]
  - title_fr: Skills et hooks
    duration_min: 60
    scenarios: [skills, caveman, hooks]
  - title_fr: Sous-agent et compression
    duration_min: 60
    scenarios: [subagent, compression]

transverse: [data_flows, soc, iam, sovereignty]

scenarios:
  bare_llm:
    title_fr: LLM nu
    description_fr: >-
      Toutes les briques sont éteintes : le modèle ne reçoit que votre message.
      Envoyez le prompt : sans outil, il ne peut pas connaître l'heure, il l'invente
      ou avoue ne pas la savoir.
    bricks: []
    prompts:
      - Quelle heure est-il ?

  reasoning:
    title_fr: Raisonnement
    description_fr: >-
      Seule la brique Raisonnement est active, sur le LLM nu : le modèle écrit d'abord son
      raisonnement, puis sa réponse. Envoyez le prompt et dépliez le raisonnement, dans la
      Vue humain ou dans Contexte LLM ; la jauge montre la réserve de sortie passée à
      1 536 tokens. Éteignez ensuite la brique, rejouez le prompt et ouvrez « Comparer » :
      moins de tokens en sortie et un tour plus court, mais une réponse souvent moins sûre.
      Si le modèle ne sait pas raisonner, la carte de la brique en donne la raison. Les
      modules suivants laissent le raisonnement éteint, pour garder de la place et des tours
      courts : rallumez-le à la main pour le montrer à l'œuvre.
    bricks: [reasoning]
    prompts:
      - >-
        Un train part de Paris à 14 h 47 et roule 2 h 38. Il a ensuite 25 minutes de
        retard. À quelle heure arrive-t-il ?

  short_memory:
    title_fr: Mémoire courte
    description_fr: >-
      Envoyez les deux prompts l'un après l'autre : le harnais réinjecte les tours
      précédents, le modèle se souvient du prénom. Éteignez la mémoire courte et
      renvoyez le second prompt pour voir l'oubli.
    bricks: [short_memory]
    prompts:
      - Je m'appelle Camille et je suis consultante en cybersécurité.
      - Comment je m'appelle, et quel est mon métier ?

  system_prompt:
    title_fr: Prompt système
    description_fr: >-
      Envoyez le prompt, puis modifiez le prompt système depuis sa carte (par exemple
      « Réponds toujours en une phrase, comme un pirate. ») et rejouez-le : la réponse
      change alors que le message est le même.
    bricks: [short_memory, system_prompt]
    prompts:
      - Présente-toi en quelques phrases.

  global_memory:
    title_fr: Mémoire globale
    description_fr: >-
      La mémoire courte et le prompt système restent actifs, et la mémoire globale s'y
      ajoute : lancer ce scénario restaure la mémoire de démonstration, dont les trois
      informations sont déjà dans le message système. Envoyez le premier prompt : le modèle
      appelle remember, un outil propre au harnais (le cycle d'un appel d'outil est détaillé
      au module 2), et le harnais écrit le fichier memory.json. S'il ne le fait pas, forcez
      « Écrire en mémoire » depuis la carte de la brique (après « Afficher les actions
      forcées ») et renvoyez le prompt. Videz ensuite la conversation, puis envoyez le second
      prompt : la préférence revient par le message système, pas par l'historique. Ouvrez
      enfin « Modifier la mémoire » (ou cliquez le fichier dans le schéma) pour consulter,
      modifier ou effacer les entrées. La mémoire globale reste active dans les modules
      suivants ; leur premier scénario restaure la mémoire de démonstration.
    bricks: [short_memory, system_prompt, global_memory]
    restore_memory: true
    prompts:
      - Retiens que je préfère des réponses en trois points au plus.
      - Rappelle-moi mon prénom, puis donne-moi des conseils pour préparer une formation.

  native_tools:
    title_fr: Outils natifs
    description_fr: >-
      Les briques du module 1 restent actives, sauf le raisonnement (la mémoire globale
      revient à sa démonstration), et les outils locaux s'y ajoutent. Envoyez un prompt et suivez dans Orchestration le cycle d'appel : le
      modèle demande l'outil, le harnais l'exécute et réinjecte son résultat.
    bricks: [short_memory, system_prompt, global_memory, tools]
    restore_memory: true
    prompts:
      - Quelle heure est-il ?
      - Combien font 1234 multiplié par 5678 ?
      - Lis le fichier recette_crepes.txt et donne-moi la liste des ingrédients.

  network_tools:
    title_fr: Outils réseau
    description_fr: >-
      Les outils réseau s'ajoutent aux outils locaux : leur nœud est dessiné dans la
      zone Réseau. Envoyez un prompt, puis ouvrez dans Orchestration les données
      sortantes : c'est le texte exact qui a quitté le poste.
    bricks: [short_memory, system_prompt, global_memory, tools]
    tools:
      [get_datetime, calculator, read_file, public_holidays, wikipedia_summary, fetch_page]
    prompts:
      - Quels sont les jours fériés en France cette année ?
      - Résume l'article Wikipédia sur le Mont-Saint-Michel.

  rag:
    title_fr: RAG
    description_fr: >-
      Les briques des modules précédents restent actives, sauf le raisonnement, et la brique
      RAG s'y ajoute : le corpus décrit Exemplia, une organisation imaginaire. Éteignez
      d'abord la brique RAG et envoyez le premier prompt : le modèle ne connaît pas Exemplia,
      il invente ou avoue ne pas savoir. Rallumez la brique, rejouez le prompt et ouvrez
      « Comparer » : les extraits RAG sont dans votre message, et la réponse s'appuie sur le
      bon document.
      Dépliez l'étape « Recherche RAG » dans Orchestration (requête, extraits, scores) et
      regardez le fichier d'index dans le schéma. Première installation : si la carte
      propose « Télécharger », cliquez-y, puis sur « Construire l'index » quand elle le
      propose ; la brique devient disponible sans ligne de commande.
    bricks: [short_memory, system_prompt, global_memory, tools, rag]
    restore_memory: true
    prompts:
      - Combien de caractères doit compter au minimum un mot de passe chez Exemplia ?
      - Quel plafond de remboursement s'applique à une nuit d'hôtel à Paris chez Exemplia ?

  rag_rerank:
    title_fr: RAG avec reranking
    description_fr: >-
      Les briques du scénario RAG, avec la sous-option « Reranking » cochée sur la carte RAG :
      le harnais retient 8 candidats par embedding, un second modèle local les note avec la
      question, puis seuls les 3 premiers entrent dans votre message. Envoyez le premier
      prompt et dépliez l'étape « Reranking » dans Orchestration : l'ordre avant et après,
      les extraits gardés et écartés, et les deux scores. Décochez « Reranking », rejouez et
      ouvrez « Comparer » : quels extraits ont changé ? Première utilisation : si la carte
      propose « Télécharger le modèle de reranking », cliquez-y d'abord.
    bricks: [short_memory, system_prompt, global_memory, tools, rag]
    rag_rerank: true
    prompts:
      - Combien de caractères doit compter au minimum un mot de passe chez Exemplia ?
      - Que faut-il faire en premier quand on perd son ordinateur portable chez Exemplia ?

  mcp_full:
    title_fr: MCP en documentation complète
    description_fr: >-
      Les briques des modules précédents restent actives, sauf le raisonnement et le RAG,
      éteint pour laisser la place : le serveur MCP local et data.gouv.fr sont connectés, et
      la documentation complète de chaque outil entre dans le contexte. Regardez la jauge
      avant d'envoyer le prompt : elle est déjà presque pleine. Passez ensuite au scénario
      « Lazy loading » pour voir le même besoin tenir dans un contexte bien plus léger, au
      point de pouvoir rallumer le RAG. Sans réseau, data.gouv.fr reste dessiné comme
      indisponible : poursuivez avec le serveur local.
    bricks: [short_memory, system_prompt, global_memory, tools, mcp]
    mcp_servers: [local, datagouv]
    restore_memory: true
    prompts:
      - Que veut dire MCP ?

  mcp_lazy:
    title_fr: Lazy loading
    description_fr: >-
      Mêmes serveurs, en lazy loading : seule une ligne par outil entre dans le contexte, et
      le RAG est rallumé. Comparez la jauge au scénario précédent, bien plus légère malgré
      les extraits RAG, envoyez le prompt et suivez le chargement de la documentation dans
      Orchestration. Sans réseau, data.gouv.fr reste dessiné comme indisponible : poursuivez
      avec le serveur local.
    bricks: [short_memory, system_prompt, global_memory, tools, rag, mcp]
    mcp_servers: [local, datagouv]
    mcp_lazy: true
    prompts:
      - Que veut dire MCP ?
      - Quels jeux de données publics existent sur la qualité de l'air ?

  skills:
    title_fr: Skills
    description_fr: >-
      Les briques des modules précédents restent actives (MCP en lazy loading, sans le
      raisonnement), et les skills s'y ajoutent : seuls le nom et la description de chaque
      skill sont dans le contexte. Envoyez le prompt : quand le modèle charge un skill, son
      contenu complet rejoint le contexte et la jauge grandit.
    bricks: [short_memory, system_prompt, global_memory, tools, rag, mcp, skills]
    mcp_lazy: true
    restore_memory: true
    prompts:
      - >-
        Rédige le compte rendu de cette réunion : Paul présente le budget, Julie
        valide le planning, prochaine réunion lundi à 10 h.

  caveman:
    title_fr: Caveman
    description_fr: >-
      Envoyez le prompt, puis armez « Déclencher le skill » sur Caveman dans la carte
      Skills (après « Afficher les actions forcées »), rejouez le dernier prompt et
      ouvrez « Comparer » : même question, bien moins de tokens en sortie.
    bricks: [short_memory, system_prompt, skills]
    prompts:
      - Explique en quelques phrases ce qu'est un harnais d'agent.

  hooks:
    title_fr: Hooks
    description_fr: >-
      Envoyez le prompt, puis regardez la bande « Points d'accroche » du schéma : le
      garde-fou H1 bloque la lecture, c'est du code et non le modèle qui décide. Si le
      modèle n'appelle pas l'outil, forcez l'appel de read_file avec le préréglage
      « Fichier sensible » (après « Afficher les actions forcées ») et rejouez.
    bricks: [short_memory, system_prompt, tools, hooks]
    tools: [get_datetime, read_file]
    hooks: [h1, h2]
    prompts:
      - Lis le fichier confidentiel/budget_projet.txt et résume-le.

  subagent:
    title_fr: Sous-agent
    description_fr: >-
      Les briques des modules précédents restent actives (MCP en lazy loading, sans le
      raisonnement pour laisser de la place au sous-agent) et la brique Sous-agent s'y
      ajoute. Le document long est un fichier local, guide_harnais.md, pour une démonstration
      hors ligne. Envoyez le premier prompt : le modèle confie la lecture à un sous-agent, et
      seul son résumé revient. Dépliez « Délégation au sous-agent » dans Orchestration : les
      résultats d'outils restés chez le sous-agent face au résumé réinjecté, c'est
      l'économie. Basculez Contexte LLM entre le contexte principal (le résumé seul, en
      « Résultat du sous-agent ») et celui du sous-agent (le guide entier). Si le modèle lit
      le fichier lui-même, le guide entre dans le contexte principal : comparez la jauge,
      puis armez « Déléguer au sous-agent » sur la carte (après « Afficher les actions
      forcées ») avec le préréglage « Résumer le guide du harnais » et rejouez. Les trois
      questions suivantes testent le résumé : ce qu'il a laissé de côté est perdu pour
      l'agent principal, qui doit redéléguer ou avouer qu'il ne sait pas.
    bricks: [short_memory, system_prompt, global_memory, tools, rag, mcp, skills, hooks, subagent]
    tools: [read_file]
    mcp_lazy: true
    restore_memory: true
    prompts:
      - >-
        Délègue à ton sous-agent la lecture du fichier guide_harnais.md, sans le lire
        toi-même : il doit le lire et te rendre un résumé en cinq points. Puis présente-moi
        ce résumé.
      - "Quiz : quelles bornes le harnais pose-t-il à la boucle d'un agent ?"
      - "Quiz : pourquoi déléguer à un sous-agent économise-t-il le contexte principal ?"
      - "Quiz : que se passe-t-il si le contexte du sous-agent déborde ?"

  compression:
    title_fr: Compression du contexte
    description_fr: >-
      Les briques du scénario Sous-agent restent actives, sans le sous-agent, et la brique
      Compression s'y ajoute : Headroom raccourcit les gros résultats d'outils et les
      extraits RAG avant l'appel au modèle. Éteignez d'abord la compression et envoyez le
      premier prompt : le journal de sauvegarde entre en entier dans le contexte.
      Rallumez-la, rejouez le prompt et ouvrez « Comparer ». Dépliez l'étape « Compression
      (Headroom) » dans Orchestration : tokens avant et après, texte d'origine et version
      courte, où l'erreur est restée. Dans Contexte LLM, le résultat d'outil est marqué
      « compressé » et l'en-tête donne le total sans compression. Les extraits RAG, de la
      prose, passent tels quels : c'est la limite de l'outil. Posez enfin le second prompt :
      ce que Headroom a coupé est perdu pour le modèle. La compression réduit ce qui entre,
      Caveman ce qui sort. Si la carte indique que Headroom n'est pas installé, lancez
      `uv sync --extra compression` puis relancez WaveStack.
    bricks: [short_memory, system_prompt, global_memory, tools, rag, mcp, skills, hooks, compression]
    tools: [read_file]
    mcp_lazy: true
    hooks: [h1, h2]
    prompts:
      - >-
        Lis le fichier journal_serveur.log et dis-moi quelle erreur grave la sauvegarde de
        cette nuit a rencontrée.
      - Dans le journal_serveur.log, à quelle heure le lot 12 a-t-il été copié ?

  data_flows:
    title_fr: Où vont mes données ?
    description_fr: >-
      Seuls les outils locaux sont actifs. Activez la brique MCP (serveur local), puis
      le serveur public data.gouv.fr, et regardez le schéma : seul le flux vers le
      serveur public franchit la frontière du poste.
    bricks: [short_memory, system_prompt, tools]
    prompts:
      - Quels jeux de données publics existent sur la qualité de l'air ?

  # ---------- scénarios métier (story 21, FR-40) : fictifs, sans donnée client ----------

  soc:
    title_fr: "Métier SOC : journal d'audit et garde-fou"
    description_fr: >-
      Pour la practice SOC, environ 20 minutes. La lecture de fichier et les hooks H1
      (garde-fou) et H2 (journal d'audit) sont actifs. Envoyez le premier prompt : le modèle
      lit les alertes d'un SIEM fictif (heures en UTC) et doit relier en un seul incident les
      quatre alertes du compte adm.leroy, survenues pendant une fenêtre de maintenance où des
      alertes étaient en sourdine ; H2 consigne chaque appel, horodaté. Envoyez le second :
      le modèle cherche lui-même dans les fichiers, trouve l'inventaire des comptes à
      privilèges dans le dossier confidentiel, et H1 bloque sa lecture. L'agent n'a pas ce
      privilège : c'est le harnais qui en décide, pas le modèle, et l'agent doit escalader
      vers un analyste habilité. Cliquez enfin « Journal d'audit » dans le schéma : les
      lectures permises et la lecture bloquée y sont. Si le modèle n'appelle pas l'outil,
      forcez read_file (après « Afficher les actions forcées ») avec le préréglage « Alertes
      SIEM (SOC) » au premier prompt, « Comptes à privilèges (SOC, confidentiel) » au second,
      et rejouez. À retenir : le journal du harnais trace chaque action de l'agent, la
      traçabilité qu'attendent NIS2 et DORA d'un outil qui agit sur le système
      d'information ; le garde-fou applique le moindre privilège, et la décision sensible
      reste à un humain.
    bricks: [short_memory, system_prompt, tools, hooks]
    tools: [read_file]
    hooks: [h1, h2]
    prompts:
      - >-
        Lis le fichier alertes_siem.log, regroupe les alertes qui relèvent d'un même
        incident et reconstitue sa chronologie, avec pour chaque étape la tactique MITRE
        ATT&CK probable.
      - >-
        Pour qualifier cet incident, vérifie le rôle et le titulaire du compte adm.leroy en
        t'aidant des fichiers disponibles.

  iam:
    title_fr: "Métier IAM : Entra ID avec Microsoft Learn"
    description_fr: >-
      Pour la practice IAM, environ 15 minutes. Seul le serveur MCP public Microsoft Learn
      est connecté, en documentation complète, avec la mémoire courte et le prompt système :
      un petit modèle ne connaît pas les écrans récents d'Entra ID, la documentation
      officielle, si. Envoyez le premier prompt : le modèle cherche dans Microsoft Learn, et
      Orchestration montre la destination et les données exactement envoyées, avant le
      résultat. Le schéma dessine le serveur dans la zone Réseau : la question part chez
      Microsoft, le modèle reste sur le poste. Les résultats de recherche sont volumineux :
      si la jauge annonce un dépassement, c'est le coût réel d'un MCP public ; posez une
      question plus précise. Sans réseau (ou derrière un proxy qui bloque
      learn.microsoft.com), Microsoft Learn est dessiné indisponible avec sa raison :
      décochez puis recochez le serveur dans la carte MCP pour réessayer. À retenir : une
      réponse sourcée, avec les liens de Microsoft Learn, plutôt qu'un écran
      d'administration inventé ; en échange, la question part chez l'éditeur.
    bricks: [short_memory, system_prompt, mcp]
    mcp_servers: [mslearn]
    prompts:
      - >-
        Dans Microsoft Entra ID, comment exiger l'authentification multifacteur pour tous
        les administrateurs ? Appuie-toi sur la documentation Microsoft Learn.
      - >-
        Qu'est-ce que Privileged Identity Management dans Entra ID, et à quoi sert
        l'activation juste-à-temps d'un rôle ?

  sovereignty:
    title_fr: "Métier Souveraineté : où partent les requêtes ?"
    description_fr: >-
      Pour la practice souveraineté, environ 15 minutes. Deux serveurs MCP publics sont
      connectés, en lazy loading : data.gouv.fr, opéré par l'administration française, et
      Microsoft Learn, opéré par un éditeur américain. Envoyez les deux prompts, puis ouvrez
      dans Orchestration les données sortantes de chaque appel : la requête révèle à elle
      seule le sujet de la mission, et elle part chez deux opérateurs soumis à deux droits
      différents ; un éditeur américain relève du Cloud Act, même quand ses serveurs sont en
      Europe. Le schéma ne montre que ce qui quitte le poste : où tourne chaque serveur MCP,
      chez quel hébergeur, avec quelle qualification (SecNumCloud par exemple), reste à
      vérifier flux par flux, et un service public n'est pas souverain par nature. Le
      modèle, lui, reste sur le poste ; avec un modèle cloud, toute la conversation
      partirait aussi chez son fournisseur. Sans réseau (ou derrière un proxy qui bloque ces
      adresses), les deux serveurs sont dessinés indisponibles avec leur raison : décochez
      puis recochez un serveur dans la carte MCP pour réessayer. À retenir : la souveraineté
      se vérifie flux par flux, pour le harnais, les données, le modèle et chaque serveur
      MCP.
    bricks: [short_memory, system_prompt, mcp]
    mcp_servers: [datagouv, mslearn]
    mcp_lazy: true
    prompts:
      - Cherche sur data.gouv.fr des jeux de données publics sur la cybersécurité en France.
      - >-
        Cherche maintenant dans la documentation Microsoft Learn comment Entra ID journalise
        les connexions des comptes administrateurs.
