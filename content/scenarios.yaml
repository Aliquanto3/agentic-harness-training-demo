# Programme de formation et scénarios par brique (story 10, AD-19, FR-38).
# Chaque scénario déclare sa configuration complète, pas un écart au précédent :
# lancer le premier scénario d'un module active déjà les briques des modules précédents.
# `bricks` : briques voulues ; `tools`, `mcp_servers`, `skills`, `hooks` : sous-options
# activées (absentes = valeurs de lancement) ; `mcp_lazy` : lazy loading (faux par défaut) ;
# `prompts` : prompts suggérés au-dessus du champ de saisie.

program:
  - title_fr: Du LLM nu au harnais
    duration_min: 45
    scenarios: [bare_llm, short_memory, system_prompt]
  - title_fr: Outils
    duration_min: 45
    scenarios: [native_tools, network_tools]
  - title_fr: MCP
    duration_min: 45
    scenarios: [mcp_full, mcp_lazy]
  - title_fr: Skills et hooks
    duration_min: 60
    scenarios: [skills, caveman, hooks]
  - title_fr: Raisonnement
    duration_min: 30
    scenarios: [reasoning]
  - title_fr: Mémoire globale
    duration_min: 30
    scenarios: [global_memory]
  - title_fr: Sous-agent
    duration_min: 30
    scenarios: [subagent]

transverse: [data_flows]

scenarios:
  bare_llm:
    title_fr: LLM nu
    description_fr: >-
      Toutes les briques sont éteintes : le modèle ne reçoit que votre message.
      Envoyez le prompt : sans outil, il ne peut pas connaître l'heure, il l'invente
      ou avoue ne pas la savoir.
    bricks: []
    prompts:
      - Quelle heure est-il ?

  short_memory:
    title_fr: Mémoire courte
    description_fr: >-
      Envoyez les deux prompts l'un après l'autre : le harnais réinjecte les tours
      précédents, le modèle se souvient du prénom. Éteignez la mémoire courte et
      renvoyez le second prompt pour voir l'oubli.
    bricks: [short_memory]
    prompts:
      - Je m'appelle Camille et je suis consultante en cybersécurité.
      - Comment je m'appelle, et quel est mon métier ?

  system_prompt:
    title_fr: Prompt système
    description_fr: >-
      Envoyez le prompt, puis modifiez le prompt système depuis sa carte (par exemple
      « Réponds toujours en une phrase, comme un pirate. ») et rejouez-le : la réponse
      change alors que le message est le même.
    bricks: [short_memory, system_prompt]
    prompts:
      - Présente-toi en quelques phrases.

  native_tools:
    title_fr: Outils natifs
    description_fr: >-
      Les outils locaux sont actifs. Envoyez un prompt et suivez dans Orchestration
      le cycle d'appel : le modèle demande l'outil, le harnais l'exécute et réinjecte
      son résultat.
    bricks: [short_memory, system_prompt, tools]
    prompts:
      - Quelle heure est-il ?
      - Combien font 1234 multiplié par 5678 ?
      - Lis le fichier recette_crepes.txt et donne-moi la liste des ingrédients.

  network_tools:
    title_fr: Outils réseau
    description_fr: >-
      Les outils réseau s'ajoutent aux outils locaux : leur nœud est dessiné dans la
      zone Réseau. Envoyez un prompt, puis ouvrez dans Orchestration les données
      sortantes : c'est le texte exact qui a quitté le poste.
    bricks: [short_memory, system_prompt, tools]
    tools:
      [get_datetime, calculator, read_file, public_holidays, wikipedia_summary, fetch_page]
    prompts:
      - Quels sont les jours fériés en France cette année ?
      - Résume l'article Wikipédia sur le Mont-Saint-Michel.

  mcp_full:
    title_fr: MCP en documentation complète
    description_fr: >-
      Le serveur MCP local et data.gouv.fr sont connectés : la documentation complète
      de chaque outil entre dans le contexte. Regardez la jauge avant d'envoyer le
      prompt : elle est déjà presque pleine. Passez ensuite au scénario « Lazy
      loading » pour voir le même besoin tenir dans un contexte bien plus léger.
      Sans réseau, data.gouv.fr reste dessiné comme indisponible : poursuivez avec le
      serveur local.
    bricks: [short_memory, system_prompt, tools, mcp]
    mcp_servers: [local, datagouv]
    prompts:
      - Que veut dire MCP ?

  mcp_lazy:
    title_fr: Lazy loading
    description_fr: >-
      Mêmes serveurs, en lazy loading : seule une ligne par outil entre dans le
      contexte. Comparez la jauge au scénario précédent, bien plus légère, envoyez le
      prompt et suivez le chargement de la documentation dans Orchestration.
      Sans réseau, data.gouv.fr reste dessiné comme indisponible : poursuivez avec le
      serveur local.
    bricks: [short_memory, system_prompt, tools, mcp]
    mcp_servers: [local, datagouv]
    mcp_lazy: true
    prompts:
      - Que veut dire MCP ?
      - Quels jeux de données publics existent sur la qualité de l'air ?

  skills:
    title_fr: Skills
    description_fr: >-
      Seuls le nom et la description de chaque skill sont dans le contexte. Envoyez le
      prompt : quand le modèle charge un skill, son contenu complet rejoint le contexte
      et la jauge grandit.
    bricks: [short_memory, system_prompt, tools, mcp, skills]
    prompts:
      - >-
        Rédige le compte rendu de cette réunion : Paul présente le budget, Julie
        valide le planning, prochaine réunion lundi à 10 h.

  caveman:
    title_fr: Caveman
    description_fr: >-
      Envoyez le prompt, puis armez « Déclencher le skill » sur Caveman dans la carte
      Skills (après « Afficher les actions forcées »), rejouez le dernier prompt et
      ouvrez « Comparer » : même question, bien moins de tokens en sortie.
    bricks: [short_memory, system_prompt, skills]
    prompts:
      - Explique en quelques phrases ce qu'est un harnais d'agent.

  hooks:
    title_fr: Hooks
    description_fr: >-
      Envoyez le prompt, puis regardez la bande « Points d'accroche » du schéma : le
      garde-fou H1 bloque la lecture, c'est du code et non le modèle qui décide. Si le
      modèle n'appelle pas l'outil, forcez l'appel de read_file avec le préréglage
      « Fichier sensible » (après « Afficher les actions forcées ») et rejouez.
    bricks: [short_memory, system_prompt, tools, hooks]
    tools: [get_datetime, read_file]
    hooks: [h1, h2]
    prompts:
      - Lis le fichier confidentiel/budget_projet.txt et résume-le.

  reasoning:
    title_fr: Raisonnement
    description_fr: >-
      Les briques des modules précédents restent actives, MCP en lazy loading pour garder
      de la place, et la brique Raisonnement s'y ajoute : le modèle écrit d'abord son
      raisonnement, puis sa réponse. Envoyez le prompt et dépliez le raisonnement, dans la
      Vue humain ou dans Contexte LLM ; la jauge montre la réserve de sortie passée à
      1 536 tokens. Éteignez ensuite la brique, rejouez le prompt et ouvrez « Comparer » :
      moins de tokens en sortie et un tour plus court, mais une réponse souvent moins sûre.
      Si le modèle ne sait pas raisonner, la carte de la brique en donne la raison.
    bricks: [short_memory, system_prompt, tools, mcp, skills, hooks, reasoning]
    mcp_lazy: true
    prompts:
      - >-
        Un train part de Paris à 14 h 47 et roule 2 h 38. Il a ensuite 25 minutes de
        retard. À quelle heure arrive-t-il ?

  global_memory:
    title_fr: Mémoire globale
    description_fr: >-
      Les briques des modules précédents restent actives, MCP en lazy loading, et la mémoire
      globale s'y ajoute : trois informations de démonstration sont déjà dans le message
      système. Si une séance précédente a laissé la préférence en mémoire, cliquez d'abord
      sur « Réinitialiser » puis relancez ce scénario : la démonstration est restaurée.
      Envoyez le premier prompt : le modèle appelle l'outil remember et le harnais écrit le
      fichier memory.json. S'il ne le fait pas, forcez « Écrire en mémoire » depuis la carte
      de la brique (après « Afficher les actions forcées ») et renvoyez le prompt. Videz
      ensuite la conversation, puis envoyez le second prompt : la préférence revient par le
      message système, pas par l'historique. Ouvrez enfin « Modifier la mémoire » (ou
      cliquez le fichier dans le schéma) pour consulter, modifier ou effacer les entrées.
      Pour des tours plus rapides, éteignez le raisonnement.
    bricks: [short_memory, system_prompt, tools, mcp, skills, hooks, reasoning, global_memory]
    mcp_lazy: true
    prompts:
      - Retiens que je préfère des réponses en trois points au plus.
      - Rappelle-moi mon prénom, puis donne-moi des conseils pour préparer une formation.

  subagent:
    title_fr: Sous-agent
    description_fr: >-
      Les briques des modules précédents restent actives (MCP en lazy loading, sans le
      raisonnement pour laisser de la place au sous-agent) et la brique Sous-agent s'y
      ajoute. Le document long est un fichier local, guide_harnais.md, pour une démonstration
      hors ligne. Envoyez le premier prompt : le modèle confie la lecture à un sous-agent, et
      seul son résumé revient. Dépliez « Délégation au sous-agent » dans Orchestration : les
      résultats d'outils restés chez le sous-agent face au résumé réinjecté, c'est
      l'économie. Basculez Contexte LLM entre le contexte principal (le résumé seul, en
      « Résultat du sous-agent ») et celui du sous-agent (le guide entier). Si le modèle lit
      le fichier lui-même, le guide entre dans le contexte principal : comparez la jauge,
      puis armez « Déléguer au sous-agent » sur la carte (après « Afficher les actions
      forcées ») avec le préréglage « Résumer le guide du harnais » et rejouez. Les trois
      questions suivantes testent le résumé : ce qu'il a laissé de côté est perdu pour
      l'agent principal, qui doit redéléguer ou avouer qu'il ne sait pas.
    bricks: [short_memory, system_prompt, tools, mcp, skills, hooks, global_memory, subagent]
    tools: [read_file]
    mcp_lazy: true
    prompts:
      - >-
        Délègue à ton sous-agent la lecture du fichier guide_harnais.md, sans le lire
        toi-même : il doit le lire et te rendre un résumé en cinq points. Puis présente-moi
        ce résumé.
      - "Quiz : quelles bornes le harnais pose-t-il à la boucle d'un agent ?"
      - "Quiz : pourquoi déléguer à un sous-agent économise-t-il le contexte principal ?"
      - "Quiz : que se passe-t-il si le contexte du sous-agent déborde ?"

  data_flows:
    title_fr: Où vont mes données ?
    description_fr: >-
      Seuls les outils locaux sont actifs. Activez la brique MCP (serveur local), puis
      le serveur public data.gouv.fr, et regardez le schéma : seul le flux vers le
      serveur public franchit la frontière du poste.
    bricks: [short_memory, system_prompt, tools]
    prompts:
      - Quels jeux de données publics existent sur la qualité de l'air ?
