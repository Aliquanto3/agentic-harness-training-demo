# Skills de la brique « Skills » (story 7, AD-19). Chaque skill est un fichier
# content/skills/{id}/SKILL.md ; ce fichier-ci porte les textes du harnais.
# `catalog_intro` est lu par le modèle, dans le message système, avant une ligne par
# skill chargeable.
catalog_intro: >-
  Skills disponibles. Un skill est un ensemble d'instructions pour un type de
  demande. Quand une demande correspond à l'un d'eux, appelle d'abord l'outil
  load_skill avec son nom, puis suis les instructions reçues.
# Méta-outil du harnais (AD-25). `description` et `skill` sont lus par le modèle.
load_skill:
  label_fr: Chargement du skill
  description: >-
    Charge les instructions complètes d'un skill de la liste « Skills disponibles ».
  skill: Nom exact du skill, tel qu'il figure dans la liste.
