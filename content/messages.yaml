    model_noun:
      embedding: d'embedding
      reranking: de reranking
    model_mismatch: "Indisponible : le fichier {names} de {folder} n'est pas le modèle {noun} déclaré ({label}, {size} Mo attendus). Cliquez sur « Télécharger » pour le remplacer.{tail}"
    model_absent: "Indisponible : modèle absent. Le modèle {noun} {label} ({size} Mo) n'est pas sur le poste. Cliquez sur « Télécharger », ou copiez à la main {names} dans {folder}, puis cliquez de nouveau sur « Télécharger ».{tail}"
    works_without_reranking: " Le RAG fonctionne sans reranking."
    section_invalid: La section [rag.embedding] est invalide.
    declaration_invalid: La déclaration du modèle d'embedding est invalide.
    build: Cliquez sur « Construire l'index » sur la carte RAG
    download_then_build: Téléchargez d'abord le modèle d'embedding, puis cliquez sur « Construire l'index »
    vec_unavailable: "Indisponible : l'extension sqlite-vec ne se charge pas dans ce Python ({why}). Le RAG ne peut pas lire son index ; les autres briques fonctionnent."
    index_absent: "Indisponible : index absent ({path}). {build} (ou lancez uv run python {script})."
    index_unreadable: "Indisponible : l'index {path} est illisible ({kind}). {build} pour le reconstruire."
    built_file: ", fichier de {size} Mo"
    other_model: "Indisponible : l'index a été construit avec le modèle d'embedding « {built_id} » ({built_dims} dimensions{built_file}), alors que [rag.embedding] déclare « {model} » ({dims} dimensions, fichier de {size} Mo). {build} pour le reconstruire."
    stale: "Indisponible : index périmé. Le corpus (content/corpus) ou [rag] chunk_max_chars ont changé depuis sa construction ({built_at}). {build} pour le reconstruire."
    loading: "Chargement du modèle d'embedding {label}…"
    not_loaded: "Modèle d'embedding non chargé : désactivez puis réactivez la brique RAG."
    detail_absent: "{path} · index absent ou illisible"
    detail: "{path} · {chunks} extraits · modèle d'embedding {model}"
    not_configured: Brique RAG non configurée.
    model_missing: modèle absent
    embedding_label: "le modèle d'embedding {label}"
    refused_effect: "La brique « RAG » est indisponible ; rien n'est chargé. Elle se charge d'elle-même après un changement de modèle, ou en la réactivant."
    sha256: "le fichier {path} n'est pas le modèle déclaré (sha256 différent de celui de [{section}])"
    load_failed: Le modèle d'embedding n'a pas pu être chargé.
    load_failed_reason: "Indisponible : le modèle d'embedding n'a pas pu être chargé ({kind}: {cause}). Vérifiez le fichier {path}, ou supprimez-le, puis désactivez et réactivez la brique RAG : elle relit ses fichiers et propose de le télécharger à nouveau."
