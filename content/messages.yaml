    model: Modèle
    model_sub: Modèle (sous-agent)
    embedding: "Modèle d'embedding {model}, processus local"
    reranking: "Modèle de reranking {model}, processus local"
    compressor: "{label}, bibliothèque dans le processus du harnais, hors ligne"
