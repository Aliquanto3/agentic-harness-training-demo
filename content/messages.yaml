    hybrid: ", et tout le contexte ({tokens} tokens) sur un modèle hybride comme Qwen3.5, qui ne sait pas tronquer son cache."
    in_cache: " Les {tokens} tokens du contexte sont déjà en cache, suivis d'autres ({cached} en tout) : le moteur doit recalculer au moins le dernier token{hybrid}"
    partly: " Seuls {common} tokens sur {cached} en cache sont réutilisés : le moteur relit {again} tokens{end}"
    all: " Le moteur relit les {again} tokens du contexte."
