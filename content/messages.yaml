    tool_catalog_full: "Cause : les descriptions d'outils occupent la plus grande part du contexte, chaque outil y entrant avec sa documentation complète. Pour continuer la démo : passez la carte MCP en lazy loading, ou désactivez un serveur MCP (ou des outils) dans le panneau des briques."
    strategies:
      sliding_window: "Fenêtre glissante : ne garder que les échanges les plus récents."
      compaction: "Compaction : résumer les anciens échanges en quelques lignes."
      old_tool_results: Retrait des anciens résultats d'outils.
      lazy_loading: "Lazy loading : ne charger la documentation des outils qu'à la demande."
