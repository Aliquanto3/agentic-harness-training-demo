    kv_no_model: "Cache de contexte : calculé au chargement d'un modèle"
    read_cloud: "Temps de lecture : chez le fournisseur, non estimé (le temps mesuré est surtout celui du réseau)"
    read_no_model: "Temps de lecture : pas encore mesuré, aucun modèle actif"
    reloading: "Rechargement de {label} avec une fenêtre de {window} tokens…"
    locked: "Réglage désactivé : fenêtre fixée par la déclaration du modèle ({model} déclare window = {window})."
    already: "La fenêtre est déjà de {window} tokens."
    cloud_next_turn: "Fenêtre de contexte : {window} tokens, prise en compte au prochain tour, sans rechargement{bound}."
    saved_for_next: "Fenêtre de {window} tokens enregistrée : elle s'appliquera au prochain chargement d'un modèle."
    unchanged: "Fenêtre de {window} tokens enregistrée ; la fenêtre effective de {label} reste de {effective} tokens{bound}, sans rechargement."
    nothing_reloaded: Rien n'est libéré, écrit ni rechargé.
    cost_unknown: "Fenêtre de {window} tokens refusée : le coût de {label} avec cette fenêtre est inconnu (fichier du modèle illisible depuis WaveStack). {label} reste actif avec {current} tokens."
    kv_llama_slot: "Cache de contexte : réservé par llama-server (-c {slot}), inchangé"
