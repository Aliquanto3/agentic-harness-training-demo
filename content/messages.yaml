      tool_catalog: "Cause : les descriptions d'outils occupent la plus grande part du contexte. Pour continuer la démo : désactivez un serveur MCP (ou des outils) dans le panneau des briques, ou videz la conversation pour décharger les documentations chargées."
      tool_result: "Cause : les résultats d'outils (fichiers lus, recherches) occupent la plus grande part du contexte. Pour continuer la démo : posez une question plus précise, pour des résultats plus courts{compression}, ou videz la conversation."
      hook_injection: "Cause : le texte injecté par le hook H3 (injection de contexte) occupe la plus grande part du contexte. Pour continuer la démo : désactivez H3 dans la carte des hooks, ou raccourcissez son texte (injection dans content/hooks.yaml)."
      subagent_result: "Cause : le résultat du sous-agent occupe la plus grande part du contexte. Pour continuer la démo : confiez-lui une tâche plus ciblée, ou videz la conversation."
