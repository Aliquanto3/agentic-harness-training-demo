      not_measured: "« Appliquer » recharge {label}, la conversation est gardée. Débit de lecture pas encore mesuré : envoyez un message, le temps de lecture de chaque fenêtre s'affichera."
      measured: "« Appliquer » recharge {label}, la conversation est gardée. Débit de lecture mesuré : {tps} tokens/s, sur le dernier appel qui a lu au moins {min} tokens. Le temps affiché est une borne basse : le débit baisse quand le contexte s'allonge."
    error:
      message: Le coût des fenêtres de contexte n'a pas pu être calculé.
      effect: Le panneau « Fenêtre » garde ses chiffres précédents.
  # Lot A (AD-4): why a turn's first call does not extend what the engine holds in cache.
