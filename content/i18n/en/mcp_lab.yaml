# English translation of content/mcp_lab.yaml (story 6 of 2026-09-30, lot 4 of 2026-10-04;
# AD-19, AD-27): the /mcp page's pedagogical texts. `{…}`: a value the page or the session
# places.

title_text: "MCP workshop"
intro_text: >-
  The protocol between the host and a server, message by message. A sandbox: the harness's MCP
  brick does not change.
busy_text: "Unavailable for now: {reason}"

servers_help_text: >-
  The three servers of the MCP brick. The glossary is a Python process the host launches on this
  workstation and talks to through standard input and output; the other two are public services
  reached over HTTP, behind WaveStack's network guard.
handshake_help_text: >-
  As in a restaurant: “Hello, I am WaveStack's waiter” (initialize); “Hello, here is what we
  serve: dishes à la carte, what we put on the table, set menus” (capabilities: tools,
  resources, prompts); “Noted” (notifications/initialized); “The menu, please” (tools/list,
  resources/list, prompts/list). Only then does one order.
handshake_empty_text: "Connect to a server: the handshake will show here, message by message."
tools_help_text: >-
  What the server says of each tool, and what it costs in the context. With full documentation,
  each tool enters whole (name, description, schema); with lazy loading, it leaves only a line in
  load_tool_doc's description, and its documentation enters only if the model asks for it.
tools_empty_text: "Connect to a server: its tool documentation and its weight will show here."
call_help_text: >-
  One field per parameter of the tool's schema. The host sends tools/call through the client;
  the server answers with a JSON-RPC result, from which the host takes the text it reinjects to
  the model.
by_hand_text: "You play the model: you choose the tool and its arguments."
by_model_text: >-
  The active model receives your question and the tools, then chooses by itself. Slow on CPU:
  10 to 40 s.
reinjected_help_text: >-
  The text the harness hands back to the model: the result's text blocks, bounded by the cap on
  network and MCP tool results.
context_help_text: >-
  The “tools” block as the host sends it to the model: the JSON definitions, without the
  wrapping the model's template adds. This is what the model reads before choosing a tool.
outside_text: "Resources and prompts do not enter it: they wait for a choice of the application or of the user."
arch_empty_text: "The pieces will appear here, one by one, as they come into play."
ask_resource_text: |-
  Content of the resource {uri}:

  {content}

  {question}

transports:
  stdio:
    label_text: "stdio (child process)"
    explain_text: >-
      The host launches the server on this workstation and the client exchanges with it through
      standard input and output: one JSON line per message. Nothing leaves the workstation.
  streamable_http:
    label_text: "Streamable HTTP"
    explain_text: >-
      The client sends each message as a POST to the server's address, which answers in JSON or
      as an event stream. The request leaves the workstation: it is traced as outgoing data.

methods:
  initialize: "The client introduces itself: protocol version, client capabilities, name and version. The server answers with the version kept, its name and its capabilities: the primitives it offers."
  "notifications/initialized": "A notification, with neither answer nor id: the client confirms the session is open."
  "tools/list": "The client asks for the list of tools. Each tool comes with its name, its description and the schema of its arguments: this is what the host puts in the model's context."
  "resources/list": "The server announced resources: the client asks for their list. Each resource has an address (URI), a name and a type; nothing enters the context."
  "prompts/list": "The server announced prompts: the client asks for their list. Each prompt has a name, a description and its arguments; the host offers them to the user, as commands."
  "tools/call": "The client asks the server to run a tool with its arguments; the server answers with content blocks and isError."
  "resources/read": "The client asks for a resource's content by its address; the server sends it back with its address and type."
  "prompts/get": "The client asks for a prompt with its arguments; the server sends back messages ready to enter the conversation."

columns:
  user:
    name_text: "User"
    sub_text: "you"
    explain_text: "You, or the participant. The user talks to the host, never to the MCP server. With an MCP prompt, the user is the one who chooses (like a / command)."
  model:
    name_text: "Local SLM"
    sub_text: ""
    explain_text: "The model never talks to the MCP server. It reads the tools in its context and asks the host for a call, which goes through the client."
  host:
    name_text: "WaveStack host"
    sub_text: "the harness"
    explain_text: "The application that hosts the model and the MCP clients: here, the WaveStack harness. It decides which tools to show the model and runs its requests."
  client:
    name_text: "MCP client"
    sub_text: "one per server"
    explain_text: "One MCP client per server (1 to 1 connection). It speaks JSON-RPC to the server and hands the answers to the host; the host itself does not speak JSON-RPC."
  server:
    name_text: "MCP server"
    sub_text: ""
    explain_text: "A separate program exposing tools, resources and prompts: on the workstation (stdio) or outside it (Streamable HTTP)."
  source:
    name_text: "Data source"
    sub_text: ""
    explain_text: "What the server reads or calls. The host never reaches it: this exchange happens inside the server, the workshop does not see it."

phases:
  connect:
    why_label_text: "Why a handshake?"
    why_text: >-
      As in a restaurant: “Hello, I am WaveStack's waiter” (initialize); “Hello, here is what we
      serve: dishes à la carte, what we put on the table, set menus” (capabilities: tools,
      resources, prompts); “Noted” (notifications/initialized); “The menu, please” (tools/list,
      resources/list, prompts/list). Only then does one order.
  call:
    why_label_text: "Who chooses the tool?"
    why_text: >-
      A tool is chosen by the model. The host shows it the tools, the model asks for a call, the
      host passes it through the client. The model never talks to the server.
  read:
    why_label_text: "Who chooses the resource?"
    why_text: >-
      A resource is chosen by the application (the host), not by the model: it gives context,
      like a file attached with @.
  prompt:
    why_label_text: "Who chooses the prompt?"
    why_text: >-
      A prompt is chosen by the user: a request template the server prepares, like a / command.
  ask:
    why_label_text: "What does the model receive?"
    why_text: >-
      What the application or the user chose enters the context; the model answers, or asks for
      a tool, which the host runs through the client.

primitives:
  tools:
    note_text: "A tool is chosen by the model: the host shows it, the model asks for the call."
  resources:
    note_text: "You play the application: it is the one that chooses a resource."
  prompts:
    note_text: "A prompt is chosen by the user, like a / command: its messages enter the conversation as yours do."

servers:
  local:
    source_label_text: "glossary.yaml"
    source_action_text: "reads glossary.yaml"
    source_explain_text: "The glossary's source: a YAML file the server reads. The host never reads it itself."
  datagouv:
    source_label_text: "data.gouv.fr API"
    source_action_text: "calls the data.gouv.fr API"
    source_explain_text: "The data.gouv.fr API, called by the server. This exchange happens at the server's: the workstation does not see it."
  mslearn:
    source_label_text: "Microsoft docs"
    source_action_text: "reads the Microsoft documentation"
    source_explain_text: "The Microsoft Learn documentation, read by the server, out of the workstation's sight."

restaurant:
  host:
    place_text: "the restaurant's dining room"
    meaning_text: "it welcomes, seats, serves; it does not cook"
  client:
    place_text: "one waiter per kitchen"
    meaning_text: "it carries the orders and brings back the dishes; one waiter per kitchen (1 client = 1 server)"
  server_stdio:
    place_text: "the back-room kitchen"
    meaning_text: "same building (the workstation), but a separate room (another process)"
  server_http:
    place_text: "an outside caterer"
    meaning_text: "the order goes out into the street (the network)"
  source:
    place_text: "the kitchen's pantry"
    meaning_text: "the dining room never goes in"
  model:
    place_text: "the guest"
    meaning_text: "reads the menu and orders; never goes into the kitchen"
  tool:
    place_text: "a dish à la carte"
    meaning_text: "chosen by the guest"
  resource:
    place_text: "what the house puts on the table, bread or a carafe"
    meaning_text: "chosen by the dining room, without the guest asking"
  prompt:
    place_text: "the set menu of the day"
    meaning_text: "chosen by the host of the meal (the user)"

before:
  banner_text: "Schema of principle: nothing is captured"
  integrations:
    local: "Code to read glossary.yaml"
    datagouv: "Code for the data.gouv.fr API (REST, its format)"
    mslearn: "Code for the Microsoft API (another format, another authentication)"
  captions:
    - "One integration to write and maintain per tool."
    - "An API that changes breaks its integration, until the code catches up."
  after_caption_text: "One protocol: the same client for every server; each server follows its API's changes."
