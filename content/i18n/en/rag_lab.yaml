# A stage of the pipeline: its technical name (English, the same in the three languages) and
# what it does (2 to 3 sentences).
stages:
  chunking:
    label_text: "Chunking"
    explain_text: >-
      The corpus documents are cut into chunks: paragraphs are grouped as long as they fit
      within the maximum size, and a paragraph that is too long is cut at the end of a
      sentence. A chunk that is too small loses its context; too large, it drowns the
      information.
  embedding:
    label_text: "Embedding"
    explain_text: >-
      An embedding model turns each chunk, then the question, into a vector of numbers. Two
      texts with a similar meaning give close vectors, even with no word in common.
  vector_store:
    label_text: "Vector store"
    explain_text: >-
      The chunks' vectors are stored in a vector store, computed once and for all: this is
      indexing. It quickly finds the vectors closest to another one; for each question, only
      the question still needs embedding.
  vector_search:
    label_text: "Dense retrieval"
    explain_text: >-
      The vector store returns the chunks whose vector is closest to the question's (cosine
      similarity), with no threshold: the k closest, relevant or not.
  lexical_search:
    label_text: "BM25"
    explain_text: >-
      A keyword search, with no embedding: chunks that share words with the question come
      first, a rare word weighing more than a common one (BM25); accents and short English
      function words (the, of, and…) are ignored. It finds an acronym, a code or an exact
      number (“HR”, “IT”, “35”) that an embedding may miss.
  fusion:
    label_text: "Fusion (RRF)"
    explain_text: >-
      Two searches give two rankings; reciprocal rank fusion (RRF) combines them: each chunk
      earns 1 / (60 + its rank) in each list. A chunk ranked well by both comes first: this
      is hybrid search.
  rerank:
    label_text: "Reranking"
    explain_text: >-
      A reranker reads the question and each candidate together, and scores their relevance.
      Dense retrieval compared two vectors computed apart; the reranker reads both texts side
      by side: it judges better, but it is much slower. That is why it only sees the
      candidates kept, then reorders them. Each reranking model is calibrated its own way: the
      same 0.8 does not mean the same thing from one reranker to another. Scores from different
      rerankers therefore cannot be compared: only the order each one produces matters.
  context:
    label_text: "Prompt augmentation"
    explain_text: >-
      Only the top chunks enter the prompt, numbered, with their document's title, before the
      question: this is the augmented prompt. Each chunk costs tokens in the model's window.
  generation:
    label_text: "Generation"
    explain_text: >-
      The LLM reads the augmented prompt and answers based on the chunks. A good answer
      depends on what the previous steps brought it.

