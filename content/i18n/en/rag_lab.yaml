# Lot 5a: the lines of the sequence. The technical name is the same in the three languages;
# the action and the explanation are in the page's language. Without `explain_text`, the
# focus takes its pipeline stage's.
steps:
  documents:
    label_text: "Documents"
    action_text: "Load the corpus"
    explain_text: >-
      The corpus the RAG makes searchable: the documents of a fictitious company, Exemplia. It
      does not change from one question to the next; that is why all the work on it is done
      once, before the questions: this is indexing.
  chunking:
    label_text: "Chunking"
    action_text: "Cut the documents into chunks"
  embed_passages:
    label_text: "Embedding"
    action_text: "Embed each chunk"
    explain_text: >-
      The embedding model turns each chunk into a vector of numbers. Two texts with a similar
      meaning give close vectors, even with no word in common. This is computed once: the
      vectors of the RAG brick's index are read again, not recomputed. Each model offered
      has its own vector cache. A chunk longer than what the model reads at once (max_tokens)
      is truncated: the step says how many.
  vector_store:
    label_text: "Indexing"
    action_text: "Store the vectors in the vector store"
  question:
    label_text: "Question"
    action_text: "Receive the question"
    explain_text: >-
      The question asked in natural language. It goes to the Embedding for a search by meaning,
      as it is to BM25 if the pipeline has one, and finally joins the model's prompt.
  embed_query:
    label_text: "Embedding"
    action_text: "Embed the question"
    explain_text: >-
      The same embedding model turns the question into a vector. It must be the one used for
      the chunks: two different models do not place meanings in the same space, their vectors
      cannot be compared.
  vector_search:
    label_text: "Dense retrieval"
    action_text: "Find the closest chunks"
  lexical_search:
    label_text: "BM25"
    action_text: "Search by keywords"
  fusion:
    label_text: "Fusion (RRF)"
    action_text: "Merge the two rankings"
  rerank:
    label_text: "Reranking"
    action_text: "Reorder the candidates"
  context:
    label_text: "Prompt augmentation"
    action_text: "Build the prompt with the chunks kept"
  generation:
    label_text: "Generation"
    action_text: "Generate the answer"
    note_text: "Not run in the RAG workshop for now: here is what the LLM would receive."

