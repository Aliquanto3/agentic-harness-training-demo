# stage, option and param ids, same placeholders. Validated by wavestack.rag.lab.RagLabContent.

title_text: "RAG workshop: the RAG architecture to handle"
intro_text: >-
  A RAG in two phases: indexing (build) stores the corpus's chunks in a vector store once and
  for all; the query (run), for each question, searches it for the useful chunks and places
  them in the model's prompt. Run the pipeline on a question to see what each step receives,
  produces and costs. This is a sandbox: the workshop's RAG brick does not change.
busy_text: "Unavailable for now: {raison}"

chain_title_text: "The RAG pipeline, step by step"
chain_help_text: >-
  The sequence of steps, the components it calls on and the focus on the chosen step. In Play
  mode, the steps and their components arrive one by one, by hand (◀ ▶) or as a run goes. In
  Compose mode, the steps of the retrieval segment (Dense retrieval,
  BM25, Fusion, Reranking) can be removed, added and moved; Generation is drawn to show what
  the model would receive, but it does not run here.

