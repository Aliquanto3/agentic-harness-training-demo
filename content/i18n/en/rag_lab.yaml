# One card per step type: its name and what it does (2 to 3 sentences).
stages:
  chunking:
    label_text: "Chunking"
    explain_text: >-
      The corpus documents are cut into excerpts: paragraphs are grouped as long as they fit
      within the maximum size, and a paragraph that is too long is cut at the end of a
      sentence. An excerpt that is too small loses its context; too large, it drowns the
      information.
  embedding:
    label_text: "Embedding"
    explain_text: >-
      An embedding model turns each excerpt, then the question, into a vector of numbers.
      Two texts with a similar meaning give close vectors, even with no word in common.
  vector_store:
    label_text: "Vector database"
    explain_text: >-
      The excerpts' vectors are stored in a database, computed once and for all: this is
      indexing. For each question, only the question still needs embedding.
  vector_search:
    label_text: "Search"
    explain_text: >-
      The database returns the excerpts whose vector is closest to the question's (cosine
      similarity), with no threshold: the k closest, relevant or not.
  lexical_search:
    label_text: "BM25 lexical search"
    explain_text: >-
      A search by words, with no embedding: excerpts that share words with the question come
      first, a rare word weighing more than a common one (BM25); accents and short English
      function words (the, of, and…) are ignored. It finds an acronym, a code or an exact
      number (“HR”, “IT”, “35”) that an embedding may miss.
  fusion:
    label_text: "Fusion"
    explain_text: >-
      Two searches give two rankings; reciprocal rank fusion combines them: each excerpt
      earns 1 / (60 + its rank) in each list. An excerpt ranked well by both comes first:
      this is hybrid search.
  rerank:
    label_text: "Reranking"
    explain_text: >-
      A reranker reads the question and each candidate together, and scores their relevance.
      Slower than a vector search, it only sees the candidates that search kept, then
      reorders them.
  context:
    label_text: "Context building"
    explain_text: >-
      Only the top excerpts enter the context, numbered, with their document's title, before
      the question. Each excerpt costs tokens in the model's window.
  generation:
    label_text: "Generation"
    explain_text: >-
      The model reads this context and the question, then answers based on the excerpts. A
      good answer depends on what the previous steps brought it.

