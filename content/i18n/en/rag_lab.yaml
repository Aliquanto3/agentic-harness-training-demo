# English translation of content/rag_lab.yaml (languages 4/5, AD-19): same keys, same
# stage, option and param ids, same placeholders. Validated by wavestack.rag.lab.RagLabContent.

title_text: "RAG workshop: the RAG architecture to handle"
intro_text: >-
  A RAG pipeline, piece by piece: the corpus is split into excerpts, each excerpt becomes a
  vector, the vectors are stored in a database, then the question is compared with them to
  find the useful excerpts, which a reranker can reorder before they enter the model's
  context. Run the pipeline on a question to see what each step receives, produces and
  costs. This is a sandbox: the workshop's RAG brick does not change.
busy_text: "Unavailable for now: {raison}"

chain_title_text: "The pipeline"
chain_help_text: >-
  The steps, from left to right. Between the vector database and the context, the searches,
  the fusion and the reranking can be removed, added and moved. Generation is drawn to show
  what the model would receive, but it does not run here.

