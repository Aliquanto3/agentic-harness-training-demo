candidates:
  toggle_text: "Show the candidate tokens"
  help_text: >-
    For each token produced, the five tokens the model judged most probable at that point.
    Hover over a chip, give it focus or click it.
  title_text: "Candidates for token {index}"
  probability_text: "model probability"
  chance_text: "chance of being drawn: {chance}"
  dropped_text: "discarded by top-k, top-p or min-p"
  chosen_text: "drawn"
  legend_text: >-
    The model probability comes from its logits (temperature 1). In llama.cpp's order,
    top-k, top-p and min-p discard candidates, then the temperature redistributes the chance
    of being drawn among those that remain.

# Story 5 of 2026-09-30: the live distribution (section 2), the A/B comparison (section 5),
# the diagram of the window (section 4).
distribution:
  title_text: "What the settings do to the candidates"
  intro_text: >-
    The candidates of a token already produced, as the model saw them. Move a slider:
    WaveStack works out again which ones stay in the running and each one's chance of being
    drawn, without a new generation. The model probability does not move.
  empty_text: >-
    Generate an answer with “Show the candidate tokens” ticked (section 5): the candidates
    of its first token will appear here.
  token_text: "Token {index} of the last generation: {texte}. Click another chip in section 5 to choose it."
  probability_text: "Model probability"
  chance_text: "Chance of being drawn"
  dropped_text: "discarded"
  kept_text: "{gardes} candidates kept among the {lus} most probable read."
  more_text: "… and {reste} other candidates read, further down, not shown."
  tail_text: "Rest of the vocabulary"
  tail_help_text: >-
    WaveStack keeps the {lus} most probable candidates of each token; the rest of the
    vocabulary weighs {reste} of the probability. The chance of being drawn is shared among
    the candidates kept only: an approximation, faithful as long as this rest is small.

compare:
  title_text: "Compare two settings"
  intro_text: >-
    The same prompt, generated twice: A with the settings of section 2, B with those below.
    A single model runs on the processor: B starts once A has finished. “Stop” stops both.
  b_settings_text: "Settings B"
  button_text: "Compare"
  running_text: "Comparison in progress: A, then B…"
  lane_a_text: "A"
  lane_b_text: "B"
  waiting_text: "Waiting for A to finish."
  empty_text: "Nothing yet."

window:
  title_text: "The window, token after token"
  prompt_text: "Prompt: {tokens}"
  free_text: "Free"
  reserve_text: "Output reserve: {reserve}"
  output_text: "Answer: {tokens} tokens"
  output_fragments_text: "Answer: {tokens} fragments received"
  caption_text: >-
    The window holds {fenetre} tokens: {utilisables} for the prompt, {reserve} kept for the
    answer. At each step, the model reads the whole window filled so far again (the cache
    spares it from computing everything again) and the token drawn is added at the end: the
    reading head slides by one token. A prompt longer than its share is not sent.
