sampling:
  reset_text: "Back to the harness values"
  unsupported_text: "Not adjustable"
  settings:
    temperature:
      label_text: "Temperature"
      help_text: >-
        Flattens or sharpens the probabilities before the draw. At 0, the model always takes
        the most probable token (the same answer every time); above 1, unlikely tokens get
        their chance.
    top_k:
      label_text: "Top-k"
      help_text: >-
        Keeps only the k most probable tokens; all the others are discarded before the draw.
        At 0, top-k is off: it discards no token.
    top_p:
      label_text: "Top-p"
      help_text: >-
        Keeps the most probable tokens until their cumulative probabilities reach p; 1
        discards nothing.
    min_p:
      label_text: "Min-p"
      help_text: >-
        Discards any token whose probability is below min-p times that of the most probable
        one; 0 discards nothing.

