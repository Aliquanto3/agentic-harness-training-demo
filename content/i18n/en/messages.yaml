      server: "context of one server slot"
      override: window declared for this model (window)
      tpm: half the quota of tokens per minute (tpm)
    window_with_native: "{reason}; native context: {native} tokens"
    tokens: "{n} tokens"
    unusable: Unusable model.
    header_unreadable: "GGUF header unreadable: capabilities unknown."
    prefix_local: "Local · {served_by}"
    prefix_network: "NETWORK · {provider}"
    served_title: "{provider} on {url}"
    cloud_title: "{provider}: {hosting}"
    no_price: price not declared
  # `models/load_registry.py` (AD-8, stories 24 and 26): a load refused by the budget.
  load_registry:
    refused: "Change refused: {label} requires about {cost}; WaveStack occupies {without} without the active model, for a budget of {budget}.{stays} {advice}"
    stays: " {label} stays active."
    window_refused: "{window}-token window refused: {label} would require about {cost}; WaveStack occupies {without} without the active model, for a budget of {budget}. {label} stays active with {current} tokens. {advice}"
    component_refused: "Not enough memory to load {label}: WaveStack occupies {without} and needs about {cost} more, beyond the budget of {budget}. {advice}"
    advice:
      model_ram: Choose a smaller model, or close some applications then restart WaveStack.
      model: Choose a smaller model.
      window_ram: Choose a smaller window, or close some applications then restart WaveStack.
      window: Choose a smaller window.
      component_ram: Disable a brick, or close some applications then restart WaveStack.
      component: Disable a brick or raise [memory] budget_mb in settings.json.
  # `models/download.py` (story 15): why a model file download did not complete.
  download:
    stopped: download stopped
    not_https: "non-https address refused: {url}"
    write_failed: "cannot write {path} ({cause})"
    http_error: "the server answered {status} ({reason}) for {url}"
    too_large: "the received file exceeds the declared size ({size} bytes)"
    wrong_size: "incorrect received size: {written} bytes instead of {size}"
    wrong_sha256: sha256 fingerprint differs from the declared one
    too_many_redirects: too many redirects
    blocked: "connection refused by the harness ({cause})"
    unreachable: "server unreachable ({kind}): the workstation has no access to {host}"
  # `models/probe.py` (lot E): why a GGUF file could not be probed.
  probe:
    incompatible: "{lib} cannot load this file (unsupported architecture, incomplete or damaged file). Choose another model, or serve it with Ollama or llama-server."
    transient: "The probe could not measure this file, for lack of memory or time (creating the context or reading a first prompt). Close some applications, then choose it again: nothing is remembered."
    not_found: File not found.
    not_installed: llama-cpp-python not installed.
  # `models/discovery.py` (AD-7): why a candidate cannot be loaded.
  discovery:
    ollama_tensor: Ollama tensor format, cannot be loaded in process.
    not_gguf: "The model file is not a readable GGUF."
    blob_missing: "The model's GGUF file was not found in Ollama's folder ({root}): WaveStack cannot read its tokenizer."
  # `models/embedding.py`, `models/reranker.py` (stories 15, 16, 30): a RAG model refused.
  embedding:
    wrong_dims: "the model produces vectors of {found} dimensions, whereas [rag.embedding] declares {declared}"
    not_pooled: "the model does not return one vector per text (pooling missing or “none” in its GGUF metadata): it is not a sentence embedding model"
    fastembed_dims: "the fastembed model returns vectors that do not have {dims} dimensions ([rag_lab.fastembed] dims)"
  reranker:
    embedding_pooling: "the file declares pooling {pooling} in its GGUF metadata, not RANK (4): it is an embedding model, not a reranking model"
    no_score: "the model does not score a question-excerpt pair ({kind}): it is not a reranking model with RANK pooling"
    not_finite: "the model returns a non-finite score for a question-excerpt pair: it is not a usable reranking model"

net:
