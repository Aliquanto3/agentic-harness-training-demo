    unknown_skill: "Unknown skill: “{target}”. Nothing is armed."
    unknown_mcp_tool: "Unknown MCP tool: “{target}” is not the tool of any connected server. Nothing is armed."
    doc_label: "Documentation of {target}"
    unknown_memory_action: "Unknown memory action: “{target}”. Nothing is armed."
    memory_label: "Write to memory ({text})"
    not_delegation: "Unknown action: “{target}” is not the delegation to the sub-agent. Nothing is armed."
    delegation_argument: "Unknown argument for the delegation: {args}. Only the task (“task”) is expected. Nothing is armed."
    task_not_text: "The sub-agent's task must be a text. Nothing is armed."
    task_empty: "The sub-agent's task is empty. Nothing is armed."
    delegation_label: "Delegation: “{task}”"
    unknown_action: "Unknown action: “{kind}”. Nothing is armed."
