# Languages (5/5): English texts of `content/messages.yaml`, same keys and variables.

common:
  # A text written elsewhere (a third party's error), kept in its language.
  verbatim: "{text}"
  # `join`: the last two items of an enumeration, « a, b et c ».
  and: and
  # Units of sizes (`config.size_fr` and its kin).
  units:
    mb: MB
    gb: GB

session:
  translation_invalid:
    message: "A translated file ({lang}) under content/i18n/{lang}/ is invalid."
    effect: "The French text of this file replaces it; the rest of WaveStack works."
  rag:
    index_held: "another program is holding the index open (an antivirus, a synchronisation tool or the build script): close it, then click “Build the index” again"
    model_noun:
      embedding: embedding
      reranking: reranking
    model_mismatch: "Unavailable: the file {names} in {folder} is not the declared {noun} model ({label}, {size} MB expected). Click “Download” to replace it.{tail}"
    model_absent: "Unavailable: model missing. The {noun} model {label} ({size} MB) is not on the workstation. Click “Download”, or copy {names} by hand into {folder}, then click “Download” again.{tail}"
    works_without_reranking: " The RAG works without reranking."
    section_invalid: The [rag.embedding] section is invalid.
    declaration_invalid: The embedding model's declaration is invalid.
    build: Click “Build the index” on the RAG card
    download_then_build: First download the embedding model, then click “Build the index”
    vec_unavailable: "Unavailable: the sqlite-vec extension does not load in this Python ({why}). The RAG cannot read its index; the other bricks work."
    index_absent: "Unavailable: index missing ({path}). {build} (or run uv run python {script})."
    index_unreadable: "Unavailable: the index {path} is unreadable ({kind}). {build} to rebuild it."
    built_file: ", {size} MB file"
    other_model: "Unavailable: the index was built with the embedding model “{built_id}” ({built_dims} dimensions{built_file}), whereas [rag.embedding] declares “{model}” ({dims} dimensions, {size} MB file). {build} to rebuild it."
    stale: "Unavailable: index out of date. The corpus (content/corpus) or [rag] chunk_max_chars have changed since it was built ({built_at}). {build} to rebuild it."
    loading: "Loading the embedding model {label}…"
    not_loaded: "Embedding model not loaded: disable then re-enable the RAG brick."
    detail_absent: "{path} · index missing or unreadable"
    detail: "{path} · {chunks} excerpts · embedding model {model}"
    not_configured: RAG brick not configured.
    model_missing: model missing
    embedding_label: "the embedding model {label}"
    refused_effect: "The “RAG” brick is unavailable; nothing is loaded. It loads by itself after a model change, or when re-enabled."
    sha256: "the file {path} is not the declared model (sha256 differs from that of [{section}])"
    load_failed: The embedding model could not be loaded.
    load_failed_reason: "Unavailable: the embedding model could not be loaded ({kind}: {cause}). Check the file {path}, or delete it, then disable and re-enable the RAG brick: it rereads its files and offers to download it again."
    close_failed: The embedding model could not be closed.
    embedder_not_loaded: the embedding model is not loaded
    index_replaced: "the index was replaced during the session. {reason}"
    search_failed:
      message: The RAG search failed.
      effect: The turn goes on without RAG excerpts.
      text: "The search failed ({kind}: {cause}). The turn goes on without RAG excerpts."
  architecture:
    harness: WaveStack harness
    model: Model
    model_sub: Model (sub-agent)
    embedding: "Embedding model {model}, local process"
    reranking: "Reranking model {model}, local process"
    compressor: "{label}, library in the harness process, offline"
  outbound:
    no_tool: no network tool
  # The session's state (`session_state.reason_text`).
  state:
    diagnostic: Start-up diagnostics in progress.
    turn: "A turn is in progress: wait for it to end or stop it."
    llm_lab: "The LLM workshop is generating an answer: wait for it to end or stop it."
    rag_lab: "RAG workshop: run in progress; wait for it to end or stop it."
    mcp_lab: "MCP workshop: exchange in progress; wait for it to end or stop it."
    awaiting: "Awaiting your approval: allow or refuse the network call."
    no_model: "Sending unavailable: no model is chosen. Choose one on the diagnostics page."
    load_failed: "Sending unavailable: the model could not be loaded. Choose another GGUF file on the diagnostics page."
    cloud_failed: "Sending unavailable: the cloud model could not be prepared. Choose a model on the diagnostics page."
    no_turn: No turn possible.
    load_stopped: "Sending unavailable: the model loading was stopped and no model is loaded. Choose a model on the diagnostics page."
  # Story 26 (AD-9): the window panel, when the cache and the read time are not WaveStack's to measure.
  window:
    kv_cloud: "Context cache: at the provider, no memory on this workstation"
    kv_no_model: "Context cache: computed when a model is loaded"
    read_cloud: "Reading time: at the provider, not estimated (the measured time is mostly the network's)"
    read_no_model: "Reading time: not measured yet, no active model"
    reloading: "Reloading {label} with a {window}-token window…"
    locked: "Setting disabled: window fixed by the model's declaration ({model} declares window = {window})."
    already: "The window is already {window} tokens."
    cloud_next_turn: "Context window: {window} tokens, taken into account at the next turn, without reloading{bound}."
    saved_for_next: "{window}-token window saved: it will apply at the next model load."
    unchanged: "{window}-token window saved; the effective window of {label} stays at {effective} tokens{bound}, without reloading."
    nothing_reloaded: Nothing is released, written or reloaded.
    cost_unknown: "{window}-token window refused: the cost of {label} with this window is unknown (model file unreadable from WaveStack). {label} stays active with {current} tokens."
    kv_llama_slot: "Context cache: reserved by llama-server (-c {slot}), unchanged"
    kv_llama: "Context cache: reserved by llama-server, unchanged"
    kv: "Context cache: {size}"
    read: "Reading time: {time}"
    note:
      no_model: "No active model: the chosen window will apply at the next load."
      cloud: "Cloud model: “Apply” reloads nothing; the window counts from the next turn. The context is read at the provider."
      not_measured: "“Apply” reloads {label}; the conversation is kept. Reading rate not measured yet: send a message, and the reading time of each window will be shown."
      measured: "“Apply” reloads {label}; the conversation is kept. Reading rate measured: {tps} tokens/s, on the last call that read at least {min} tokens. The time shown is a lower bound: the rate drops as the context grows."
    error:
      message: The cost of the context windows could not be computed.
      effect: The “Window” panel keeps its previous figures.
  # Lot A (AD-4): why a turn's first call does not extend what the engine holds in cache.
  prefix:
    causes:
      system: "The system message has changed since the previous turn (system prompt, global memory, tool descriptions, skills catalogue or loaded skill)."
      history: "The history is no longer rendered as the model read it (short-term memory off: the previous exchange is not sent again; RAG excerpts removed, compressed text or rewritten answer)."
      template: "A brick switched on or off, or the template, renders part of the context already read differently."
      reset: "The conversation was cleared, or a scenario or the reset replaced it: the engine's cache still holds the old one."
      replay: "Replay: the turn starts again from the state before the replayed turn, whereas the engine's cache holds that turn."
      abandoned: "The previous turn did not complete (stopped, failed, blocked or exceeded): its output is in the engine's cache, not in the history."
      subagent: "The sub-agent occupied the engine's cache{why}."
      llm: "The LLM workshop occupied the engine's cache{why}."
    evicted:
      stateless: ": this engine cannot save the state of the main context"
      failed: ": saving or restoring the state of the main context failed"
    in_turn: "This call does not exactly extend the previous one: only {common} of {expected} tokens are reused; the model rereads the rest. The template rewrites the model's output differently from how it was produced."
    hybrid: ", and the whole context ({tokens} tokens) on a hybrid model such as Qwen3.5, which cannot truncate its cache."
    in_cache: " The {tokens} tokens of the context are already in cache, followed by others ({cached} in all): the engine must recompute at least the last token{hybrid}"
    partly: " Only {common} of the {cached} cached tokens are reused: the engine rereads {again} tokens{end}"
    all: " The engine rereads the {again} tokens of the context."
  overflow:
    message: "The context holds {shown} tokens for {usable} usable (window of {window} minus {reserve} reserved for the answer). {cause}"
    causes:
      user_message: "Cause: the message alone is too long. To continue the demo: shorten the message and send it again."
      rag_excerpt: "Cause: the RAG excerpts take up most of the context. To continue the demo: disable the RAG brick or lower [rag] top_k in settings.json."
      history: "Cause: the conversation history takes up most of the context. To continue the demo: clear the conversation or shorten the message."
      system_prompt: "Cause: the system prompt takes up most of the context. To continue the demo: shorten the system prompt or restore the default prompt."
      tool_catalog: "Cause: the tool descriptions take up most of the context. To continue the demo: disable an MCP server (or tools) in the bricks panel, or clear the conversation to unload the loaded documentation."
      tool_result: "Cause: the tool results (files read, searches) take up most of the context. To continue the demo: ask a more precise question, for shorter results{compression}, or clear the conversation."
      hook_injection: "Cause: the text injected by hook H3 (context injection) takes up most of the context. To continue the demo: disable H3 in the hooks card, or shorten its text (injection in content/hooks.yaml)."
      subagent_result: "Cause: the sub-agent's result takes up most of the context. To continue the demo: give it a more focused task, or clear the conversation."
      global_memory: "Cause: global memory takes up most of the context. To continue the demo: remove entries from “Edit the memory”, or disable the Global memory brick."
      skill_body: "Cause: the skills (their catalogue and the loaded skills) take up most of the context. To continue the demo: clear the conversation to unload the loaded skills, or disable the Skills brick."
    compression: "; switch on compression, which shortens large results"
    tool_catalog_full: "Cause: the tool descriptions take up most of the context, each tool entering with its full documentation. To continue the demo: switch the MCP card to lazy loading, or disable an MCP server (or tools) in the bricks panel."
    strategies:
      sliding_window: "Sliding window: keep only the most recent exchanges."
      compaction: "Compaction: summarise the old exchanges in a few lines."
      old_tool_results: Removal of old tool results.
      lazy_loading: "Lazy loading: load the tools' documentation only on demand."
  # AD-6: the name of a model capability a brick requires.
  capabilities:
    tool_call_parser: "tool calling ({parser})"
  limits:
    calls: "Bound reached: {n} model calls in this turn. The harness stops the loop to prevent a model from calling tools endlessly."
    retries: "The model could not use the tool: {n} calls refused in this turn (malformed, unknown tool or invalid arguments). The harness stops here instead of retrying indefinitely."
    sub_retries: "The sub-agent could not use its tools: {n} calls refused (malformed, unknown tool or invalid arguments). The harness stops the sub-agent; the main turn goes on with an error in place of the result."
    sub_calls: "Sub-agent bound reached: {n} model calls for this delegation. The harness stops the sub-agent; the main turn goes on with an error in place of the result."
  hosting:
    network: NETWORK
    local: Local
  bricks:
    limits: "Turn bounds: at most {calls} model calls, including {retries} retries after a refused call (malformed, unknown tool or invalid arguments)."
    subagent_limits:
      one: "Sub-agent: at most {count} model call, retries included; tools: {tools}, if they are enabled in the Tools brick."
      other: "Sub-agent: at most {count} model calls, retries included; tools: {tools}, if they are enabled in the Tools brick."
  load:
    cloud: "Preparing the cloud model {model} at {provider}…"
    server: "Preparing the model served by {provider}…"
    file: "Loading the model {file}…"
    already_active: "{label} is already active."
    budget_cause: memory budget exceeded (AD-8)
    nothing_released: Nothing is released or written.
    loading: "Loading {label}…"
    incompatible_model: Incompatible model.
    no_key: no key saved for this address
    incompatible: "The file {file} is incompatible."
    over_budget: The model exceeds the memory budget once measured.
    window_applied: "Context window: {window} tokens (conversation kept)."
    interrupted: The model change was interrupted.
    scenario_bricks:
      message: The scenario's unavailable bricks could not be reread.
      effect: "The loading finishes; each brick's card stays correct."
    back: "Back to the previous model: {label}."
    previous_failed: "The previous model ({label}) could not be reloaded."
    way_back_failed: "Going back to {label} failed: no model is active ({refused} is unloaded). Choose a model in the top bar."
    failed:
      cloud: "The cloud model {label} could not be prepared."
      server: "The model {label}, served by {provider}, could not be prepared."
      file: The model could not be loaded.
      and_previous: "{message} The previous model ({label}) could not be reloaded."
      window: "{window}-token window not applied ({cause}): {label} is active again with {current} tokens."
      restored: "{label} could not be loaded ({cause}): {previous} is active again."
    # E119: a served model whose architecture its server cannot run, seen at the first turn.
    unsupported:
      back: "WaveStack goes back to the previous model, {label}."
      none: "The turn is over; choose another model in the top bar."
      restored: "{label} does not run under Ollama (architecture “{architecture}”): {previous} is active again."
    stopped:
      none: "Loading stopped: no model is active."
      previous_failed: "Loading stopped; the previous model ({label}) could not be reloaded."
      reload: "Reloading stopped: {label} is active again with {window} tokens."
      restored: "Loading stopped: {label} is active again."
    steps:
      probe: "Probe of the file in a separate process: {outcome}"
      probe_ok: it loads.
      probe_incompatible: incompatible.
      ready: "Ready: {label} is active."
      occupies: ": WaveStack occupies {size}"
      nothing_to_release: "No model to release{after}."
      released: "Previous model released ({label}){after}."
      budget_checked: "Budget confirmed: checked before the previous model was released."
      budget_cloud: "Budget confirmed: nothing to load on this workstation (cloud model)."
      budget_server: "Budget confirmed: {cost} already in memory at {provider}, counted without refusal (budget of {budget})."
      budget_file: "Budget confirmed (checked before the release): about {cost} requested, budget of {budget}."
      engine_cloud: Preparing, without loading (cloud model)
      engine_server: "Connecting to {provider}"
      engine_file: Reading the file and copying the weights into RAM
    memory:
      the_provider: the provider
      cloud: "No memory on this workstation: the model runs at {provider}."
      server: "Loaded by {provider}, in its own process, in this workstation's RAM: about {cost} counted by the budget."
      file: "Processor RAM, no graphics card: WaveStack went from {before} to {after}; the budget counts about {cost}. The weights, read with mmap, move into RAM at the first call."
  refused:
    turn: "A turn is already in progress: wait for it to end or click “Stop”."
    no_model: "No model is loaded: finish the start-up diagnostics."
    nothing_to_replay: "No prompt to replay: send a message first."
  # AD-19: a content file that cannot be read makes its brick unavailable.
  content:
    file_invalid: "The file {file} is missing or invalid: fix it, then restart WaveStack."
    skills_file_invalid: "A skills file (content/skills.yaml or content/skills/*/SKILL.md) is missing or invalid: fix it, then restart WaveStack."
    subagent_file_invalid: "The file content/subagent.yaml or the sub-agent's prompt (content/prompts/subagent.md) is missing or invalid: fix it, then restart WaveStack."
    system_prompt_file_invalid: "The default system prompt (content/prompts/system.md) is missing or empty: fix it, then restart WaveStack."
    explanation_invalid: "The explanation of the “{brick}” brick is invalid."
    brick_unavailable: "The brick is unavailable; the rest of WaveStack works."
    ui_invalid:
      message: The file content/ui.yaml is missing or invalid.
      effect: "The interface stays in its page's French; the rest of WaveStack works."
    scenarios_invalid:
      message: The scenarios file (content/scenarios.yaml) is missing or invalid.
      effect: "The scenario selector is empty; the rest of WaveStack works."
    labels:
      message: The segment labels file is invalid.
      effect: The segment types are shown under their technical name.
    invalid:
      tools: The tool descriptions are invalid.
      mcp: The MCP server labels are invalid.
      skills: The skills are invalid.
      hooks: The hook texts are invalid.
      subagent: The sub-agent texts are invalid.
      compression: The compression texts are invalid.
      system_prompt: The default system prompt is unreadable.
      global_memory: The global memory texts are invalid.
      rag: The RAG brick texts are invalid.
    unavailable:
      tools: "The “Tools” brick is unavailable; the rest of WaveStack works."
      mcp: "The “MCP” brick is unavailable; the rest of WaveStack works."
      skills: "The “Skills” brick is unavailable; the rest of WaveStack works."
      hooks: "The “Hooks” brick is unavailable; the rest of WaveStack works."
      subagent: "The “Sub-agent” brick is unavailable; the rest of WaveStack works."
      compression: "The “Compression” brick is unavailable; the rest works."
      system_prompt: "The “System prompt” brick is unavailable; the rest works."
      global_memory: "The “Global memory” brick is unavailable; the rest of WaveStack works."
      rag: "The “RAG” brick is unavailable; the rest of WaveStack works."
  memory:
    file_unreadable: "The global memory file ({path}) is unreadable or invalid: fix it, then restart WaveStack, or click “Reset” to restore the demonstration memory (the file will be replaced)."
    unreadable: Global memory is unreadable.
    unreadable_effect: "The “Global memory” brick is unavailable; the file is not modified."
    no_parser: "The active model cannot call tools: it cannot write to memory itself, and “Write to memory” does not apply. The memory is still injected into the context and can be edited from “Edit the memory”."
    duplicate: "“{text}” is already in memory: nothing is changed."
    unknown_op: "Unknown operation: “{op}”."
    not_written: "Global memory could not be written: it stays unchanged."
  # AD-12: why a brick is unavailable.
  availability:
    unknown_brick: "The “{brick}” brick does not exist in this version."
    requires: "Requires the “{brick}” brick: enable it first."
    cloud_no_tools: "The cloud model “{model}” does not declare tool calling (tools): no tool action, not even a forced one. Declare tools = true if the model supports it, or choose another model."
    lacks: "The loaded model does not offer {needs}: choose another model."
    no_model: "Unavailable: no model loaded."
    cloud_no_reasoning: "Unavailable: the active model cannot reason. The cloud model “{model}” does not declare reasoning (reasoning): declare it if the model supports it, or choose another model."
    no_reasoning: "Unavailable: the active model cannot reason. Its chat template has no reasoning variable: choose a model that reasons."
  reasoning:
    cut: "Reasoning cut by the harness at {tokens} tokens: the thinking reached the {budget}-token budget without closing. The harness closes it itself ({tag}) and restarts the model, which keeps {left} tokens for the answer."
    always: "Always on for this model: {model} reasons in every answer; this model cannot switch it off. The output reserve stays at {reserve} tokens."
    budget: "Thinking budget: {budget} tokens; beyond that, the harness closes the thinking and keeps {left} tokens for the answer."
  skills:
    # The header line of a loaded skill's body, in the context.
    body_header: "Skill “{label}” ({skill}):"
  preview:
    error:
      message: The context preview could not be computed.
      effect: The gauge stays empty until the first turn.
  # Story 4 of the deferred leftovers (E122): the first turn's context evaluated at the
  # scenario's launch, while the instructions are read (journal only).
  prefill:
    phase: "Cache prefill ({tokens} tokens)"
    started: "Cache prefill: the engine reads the {tokens} tokens of the first turn's context (system message, tools, memory) while the instructions are read."
    completed: "Prefill finished: {evaluated} tokens evaluated in {seconds} s. The first message will only make it read what follows them."
    abandoned: "Prefill abandoned after {evaluated} tokens out of {tokens} (a turn, a load, a workshop, a setting or another scenario came first): the part evaluated stays reusable."
    error: "Prefill interrupted by an error after {evaluated} tokens out of {tokens}: {cause}. The first turn will read the context as usual."
  # Story 9 (AD-3): an action armed for the next turn, or why it is not.
