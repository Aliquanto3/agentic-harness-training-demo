# English translation of content/rag.yaml (languages 1/5 and 4/5, AD-19): same fields, same
# placeholders. `documents` keeps the French ids and files (the corpus is translated under
# content/i18n/en/corpus/, same names); only the titles change, and the index of this
# language (data/rag_index.en.sqlite) holds them.
notice_text: >-
  Fictitious texts written for WaveStack: Exemplia is an imaginary organisation, its
  rules describe no real company.

intro_text: >-
  Excerpts from Exemplia's internal documentation that the harness found for this
  question. They are not all necessarily relevant: rely on the ones that answer and cite
  the document used.

excerpt_format_text: "Excerpt {position} — {title_text}:\n{text}"

placement_text: In the user's message of this turn, before the question

phase_label_text: Searching the corpus…

index_label_text: "RAG index (rag_index.en.sqlite)"

download_label_text: "Download the embedding model (≈ {size_mb} MB)"

build_label_text: Build the index

rerank_label_text: Reranking

rerank_phase_label_text: Reranking the excerpts…

rerank_search_placement_text: >-
  None directly: these {candidates} candidates go on to reranking, which keeps only
  {keep} of them

rerank_placement_text: >-
  The first {keep} after reranking, in the user's message of this turn, before the
  question

rerank_download_label_text: "Download the reranking model (≈ {size_mb} MB)"

