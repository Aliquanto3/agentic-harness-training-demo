# English translation of content/bricks/global_memory.yaml (languages 3/5, AD-19): same
# fields, same number of paragraphs and bullets.
label_text: Global memory
category_text: context engineering
hosting_text: Local
explanation_text:
  - >-
    Short-term memory is wiped with the conversation. Global memory survives it: the
    harness keeps a few pieces of information in a local file, memory.json, and puts them
    back into the system message at the start of each conversation.
  - >-
    The model remembers nothing: it writes to memory by calling a harness tool, remember,
    and it is the harness that writes the file. You can also force a write, or view, edit
    and erase the entries from “Edit the memory”.
  - - "Gain: the model “remembers” from one conversation to the next, even after a restart."
    - >-
      Cost: every entry takes up context at every call, whether it helps or not; a wrong or
      outdated piece of information is reread until it is erased.
    - >-
      Data: with a cloud model, every entry goes to the provider at every call, in the
      system message. Never put a secret in it.
  - >-
    A written entry (by the model, by a forced write or in “Edit the memory”) is in the
    file at once, but only enters the system message at the next conversation: after
    “Clear the conversation” or a change of scenario. A deletion or an edit, on the other
    hand, applies at once. The system message thus stays identical from one turn to the
    next, and the engine reuses its cache instead of rereading the whole context. “Reset”
    restores the demonstration memory.
