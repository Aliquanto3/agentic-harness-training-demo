# German translation of content/hooks.yaml (languages 1/5, AD-19): same hook ids, same
# points, same `{date}` placeholder (H3 writes the date in German).
hooks:
  h1:
    label_text: Schutz sensibler Dateien
    description_text: >-
      Vor der Ausführung eines Tools: blockiert jeden Lesezugriff im vertraulichen
      Ordner der Demo-Dateien.
  h2:
    label_text: Protokollierung
    description_text: >-
      Nach jedem Tool und am Ende der Runde: trägt die Modellaufrufe, die
      Tool-Aufrufe, die Blockierungen und das Ende der Runde ins Audit-Protokoll ein.
  h3:
    label_text: Kontextinjektion
    description_text: >-
      Beim Eingang der Nachricht: stellt ihr das Datum des Arbeitsplatzes und die
      Regeln der Mission voran.
  h5:
    label_text: Menschliche Freigabe
    description_text: >-
      Vor der Ausführung eines Netzwerk-Tools: hält die Runde an und zeigt Ihnen
      die genaue Anfrage, die den Arbeitsplatz verlassen würde; sie wird nur
      gesendet, wenn Sie sie erlauben.
points:
  on_user_message: Eingang der Nachricht
  before_model_call: Vor dem Modellaufruf
  before_tool: Vor der Ausführung eines Tools
  after_tool: Nach der Ausführung eines Tools
  on_turn_end: Ende der Runde
injection: >-
  Datum und Uhrzeit des Arbeitsplatzes: {date}. Regeln der Mission: Antworte auf
  Deutsch und bleib sachlich; nutze nur die Dateien des Demo-Ordners; weise auf
  jede Anfrage hin, die vertrauliche Daten berühren würde.
audit_label_text: Audit-Protokoll
