# German translation of content/skills.yaml (languages 1/5, AD-19); each skill's text is
# in content/i18n/de/skills/{id}/SKILL.md.
catalog_intro: >-
  Verfügbare Skills. Ein Skill ist eine Sammlung von Anweisungen für eine Art von
  Anfrage. Wenn eine Anfrage zu einem davon passt, rufe das Tool load_skill mit
  seinem Namen auf und befolge dann die erhaltenen Anweisungen.
load_skill:
  label_text: Laden des Skills
  description: >-
    Lädt anhand seines Namens die vollständigen Anweisungen eines Skills aus der
    Liste „Verfügbare Skills“ (zum Beispiel meeting_minutes). Es ist kein MCP-Tool.
  skill: Genauer Name des Skills, wie er in der Liste steht.
