# German translation of content/mcp.yaml (languages 1/5, AD-19): same server ids, same
# tool names in `call_presets`, same argument names.
servers:
  local:
    label_text: WaveStack-Glossar
  datagouv:
    label_text: data.gouv.fr
    sends_text: die Suche und ihre Argumente
  mslearn:
    label_text: Microsoft Learn
    sends_text: die gestellte Frage
lazy_label_text: Lazy Loading
load_tool_doc:
  label_text: Laden der Dokumentation
  intro: >-
    Lädt die Dokumentation eines MCP-Tools, das danach aufrufbar ist; lädt keinen
    Skill. Vor jedem Tool dieser Liste aufrufen:
  tool: Genauer Name des Tools, wie er in der Liste steht.
call_presets:
  local__define_term:
    - label_text: MCP
      args:
        term: MCP
  datagouv__search_datasets:
    - label_text: Cybersicherheit
      args:
        query: cybersécurité
  mslearn__microsoft_docs_search:
    - label_text: MFA für Administratoren (IAM)
      args:
        query: Multi-Faktor-Authentifizierung für alle Entra ID-Administratoren erzwingen
    - label_text: Just-in-Time-PIM (IAM)
      args:
        query: Privileged Identity Management Just-in-Time-Aktivierung einer Entra ID-Rolle
    - label_text: Protokollierung der Admin-Anmeldungen (Souveränität)
      args:
        query: Anmeldeprotokolle der Entra ID-Administratorkonten
