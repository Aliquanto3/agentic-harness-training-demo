      embedding: Embedding
      reranking: Reranking
    model_mismatch: "Nicht verfügbar: Die Datei {names} in {folder} ist nicht das deklarierte {noun}-Modell ({label}, {size} MB erwartet). Klicken Sie auf „{noun}-Modell herunterladen“, um sie zu ersetzen.{tail}"
    model_absent: "Nicht verfügbar: Modell fehlt. Das {noun}-Modell {label} ({size} MB) ist nicht auf dem Arbeitsplatz. Klicken Sie auf „{noun}-Modell herunterladen“, oder kopieren Sie {names} von Hand nach {folder} und klicken Sie dann erneut auf „{noun}-Modell herunterladen“.{tail}"
    works_without_reranking: " Das RAG funktioniert ohne Reranking."
    section_invalid: Der Abschnitt [rag.embedding] ist ungültig.
    declaration_invalid: Die Deklaration des Embedding-Modells ist ungültig.
    build: "Klicken Sie auf der RAG-Karte auf „Index erstellen“"
    download_then_build: "Laden Sie zuerst das Embedding-Modell herunter und klicken Sie dann auf „Index erstellen“"
    vec_unavailable: "Nicht verfügbar: Die Erweiterung sqlite-vec lässt sich in diesem Python nicht laden ({why}). Das RAG kann seinen Index nicht lesen; die anderen Bausteine funktionieren."
    index_absent: "Nicht verfügbar: Index fehlt ({path}). {build} (oder führen Sie uv run python {script} aus)."
    index_unreadable: "Nicht verfügbar: Der Index {path} ist unlesbar ({kind}). {build}, um ihn neu zu erstellen."
    built_file: ", Datei von {size} MB"
