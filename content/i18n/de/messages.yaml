    kv_no_model: "Kontext-Cache: wird beim Laden eines Modells berechnet"
    read_cloud: "Lesezeit: beim Anbieter, nicht geschätzt (die gemessene Zeit ist vor allem die des Netzwerks)"
    read_no_model: "Lesezeit: noch nicht gemessen, kein aktives Modell"
    reloading: "{label} wird mit einem Fenster von {window} Tokens neu geladen…"
    locked: "Einstellung deaktiviert: Fenster durch die Deklaration des Modells festgelegt ({model} deklariert window = {window})."
    already: "Das Fenster hat bereits {window} Tokens."
    cloud_next_turn: "Kontextfenster: {window} Tokens, wirksam ab der nächsten Runde, ohne Neuladen{bound}."
