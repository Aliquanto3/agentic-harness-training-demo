    kv_llama_slot: "Kontext-Cache: von llama-server reserviert (-c {slot}), unverändert"
    kv_llama: "Kontext-Cache: von llama-server reserviert, unverändert"
    kv: "Kontext-Cache: {size}"
    read: "Lesezeit: {time}"
    note:
      no_model: "Kein aktives Modell: Das gewählte Fenster gilt beim nächsten Laden."
      cloud: "Cloud-Modell: „Anwenden“ lädt nichts neu, das Fenster zählt ab der nächsten Runde. Der Kontext wird beim Anbieter gelesen."
      not_measured: "„Anwenden“ lädt {label} neu, die Unterhaltung bleibt erhalten. Lesedurchsatz noch nicht gemessen: Senden Sie eine Nachricht, dann wird die Lesezeit jedes Fensters angezeigt."
      measured: "„Anwenden“ lädt {label} neu, die Unterhaltung bleibt erhalten. Gemessener Lesedurchsatz: {tps} Tokens/s, beim letzten Aufruf, der mindestens {min} Tokens gelesen hat. Die angezeigte Zeit ist eine Untergrenze: Der Durchsatz sinkt, wenn der Kontext länger wird."
    error:
      message: Die Kosten der Kontextfenster konnten nicht berechnet werden.
      effect: Der Bereich „Kontextfenster“ behält seine vorherigen Zahlen.
