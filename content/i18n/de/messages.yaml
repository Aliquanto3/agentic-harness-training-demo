    load_failed: "Senden nicht verfügbar: Das Modell konnte nicht geladen werden. Wählen Sie auf der Diagnoseseite eine andere GGUF-Datei."
    cloud_failed: "Senden nicht verfügbar: Das Cloud-Modell konnte nicht vorbereitet werden. Wählen Sie ein Modell auf der Diagnoseseite."
