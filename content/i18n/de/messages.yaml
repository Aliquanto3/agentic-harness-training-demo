  prefix:
    causes:
      system: "Die Systemnachricht hat sich seit der vorigen Runde geändert (System-Prompt, globales Gedächtnis, Tool-Beschreibungen, Skill-Katalog oder geladener Skill)."
      history: "Der Verlauf wird nicht mehr so gerendert, wie das Modell ihn gelesen hat (Kurzzeitgedächtnis ausgeschaltet: Der vorige Wechsel wird nicht erneut gesendet; RAG-Auszüge entfernt, Dokumentation durch ihre Kurzfassung ersetzt, Text komprimiert oder Antwort umgeschrieben)."
      template: "Ein aktivierter oder deaktivierter Baustein, oder die Vorlage, rendert einen bereits gelesenen Teil des Kontexts anders."
      reset: "Die Unterhaltung wurde geleert, oder ein Szenario bzw. das Zurücksetzen hat sie ersetzt: Der Cache der Engine enthält noch die alte."
      replay: "Wiederholung: Die Runde startet wieder vom Zustand vor der wiederholten Runde, während der Cache der Engine diese Runde enthält."
      abandoned: "Die vorige Runde wurde nicht abgeschlossen (gestoppt, mit Fehler, blockiert oder überschritten): Ihre Ausgabe steht im Cache der Engine, nicht im Verlauf."
