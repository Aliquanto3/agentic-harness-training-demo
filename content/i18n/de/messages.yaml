# Languages (5/5): German texts of `content/messages.yaml`, same keys and variables.

common:
  verbatim: "{text}"
  and: und

session:
  translation_invalid:
    message: "Eine übersetzte Datei ({lang}) unter content/i18n/{lang}/ ist ungültig."
    effect: "Der französische Text dieser Datei ersetzt sie; der Rest von WaveStack funktioniert."

tools:
  datetime:
    weekdays:
      monday: Montag
      tuesday: Dienstag
      wednesday: Mittwoch
      thursday: Donnerstag
      friday: Freitag
      saturday: Samstag
      sunday: Sonntag

mcp:
  glossary:
    unknown_term: "Begriff nicht im Glossar: „{term}“. Verfügbare Begriffe: {known}."

# `cli.py`: the terminal speaks English; this German `cli` section is a subset (story R0's
# keys only) until story 7 completes the translations.
cli:
  already_running: "WaveStack läuft bereits auf Port {port}, gestartet aus {root} ({commit}). Der Browser wird geöffnet."
  already_running_no_commit: "WaveStack läuft bereits auf Port {port}, gestartet aus {root} (Commit unbekannt). Der Browser wird geöffnet."
  already_running_unknown: "WaveStack läuft bereits auf Port {port}, gestartet aus einem unbekannten Ordner (frühere Version). Der Browser wird geöffnet."
  other_tree: "Achtung: Diese Instanz stammt nicht aus diesem Ordner ({here}). Um diesen zu starten, beenden Sie sie (Strg+C in ihrem Terminal) oder starten Sie mit --port <anderer_port> neu."

# Story 4: why the compression brick is unavailable when its tiktoken table is not usable.
compression:
  tiktoken_missing: "Nicht verfügbar: Die Zähltabelle von Headroom (tiktoken cl100k_base), die mit WaveStack geliefert wird, fehlt ({path}). WaveStack lädt sie nicht herunter: Stellen Sie diese Datei aus dem Repository von WaveStack (git checkout -- src/wavestack/compression/tiktoken) oder seinem Archiv wieder her und starten Sie WaveStack dann neu. Die anderen Bausteine funktionieren ohne sie."
  tiktoken_altered: "Nicht verfügbar: Die Zähltabelle von Headroom (tiktoken cl100k_base), die mit WaveStack geliefert wird, ist verändert (anderer sha256-Fingerabdruck, oft umgewandelte Zeilenenden): {path}. WaveStack lädt sie nicht herunter: Stellen Sie diese Datei aus dem Repository von WaveStack (git checkout -- src/wavestack/compression/tiktoken) oder seinem Archiv wieder her und starten Sie WaveStack dann neu. Die anderen Bausteine funktionieren ohne sie."
