    loading: "Embedding-Modell {label} wird geladen…"
    not_loaded: "Embedding-Modell nicht geladen: Deaktivieren und aktivieren Sie den RAG-Baustein erneut."
    detail_absent: "{path} · Index fehlt oder ist unlesbar"
    detail: "{path} · {chunks} Auszüge · Embedding-Modell {model}"
    not_configured: RAG-Baustein nicht konfiguriert.
    model_missing: Modell fehlt
    embedding_label: "das Embedding-Modell {label}"
    refused_effect: "Der Baustein „RAG“ ist nicht verfügbar; nichts wird geladen. Er lädt sich nach einem Modellwechsel von selbst oder wenn Sie ihn wieder aktivieren."
    sha256: "die Datei {path} ist nicht das deklarierte Modell (sha256 weicht von dem in [{section}] ab)"
