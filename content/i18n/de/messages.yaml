# Languages (5/5, AD-19): German texts of `content/messages.yaml`, read by `msg(key, lang)`
# (`src/wavestack/messages.py`): same keys and, key by key, the same variables.
# Keys in English, `snake_case`; `{name}` variables; a plural is a `{one, other}` pair.

common:
  # A text written elsewhere (a third party's error), kept in its language.
  verbatim: "{text}"
  # `join`: the last two items of an enumeration, « a, b et c ».
  and: und
  # Units of sizes (`config.size_fr` and its kin).
  units:
    mb: MB
    gb: GB

session:
  translation_invalid:
    message: "Eine übersetzte Datei ({lang}) unter content/i18n/{lang}/ ist ungültig."
    effect: "Der französische Text dieser Datei ersetzt sie; der Rest von WaveStack funktioniert."
  rag:
    index_held: "ein anderes Programm hält den Index geöffnet (ein Virenschutz, ein Synchronisierungstool oder das Erstellungsskript): Schließen Sie es und klicken Sie dann erneut auf „Index erstellen“"
