      subagent_result: "Ursache: Das Ergebnis des Sub-Agenten belegt den größten Teil des Kontexts. Um die Demo fortzusetzen: Übertragen Sie ihm eine gezieltere Aufgabe oder leeren Sie die Unterhaltung."
      global_memory: "Ursache: Das globale Gedächtnis belegt den größten Teil des Kontexts. Um die Demo fortzusetzen: Entfernen Sie Einträge über „Gedächtnis bearbeiten“ oder deaktivieren Sie den Baustein Globales Gedächtnis."
      skill_body: "Ursache: Die Skills (ihr Katalog und die geladenen Skills) belegen den größten Teil des Kontexts. Um die Demo fortzusetzen: Leeren Sie die Unterhaltung, um die geladenen Skills zu entladen, oder deaktivieren Sie den Baustein Skills."
