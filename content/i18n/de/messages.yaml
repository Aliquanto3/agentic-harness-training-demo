      user_message: "Ursache: Die Nachricht allein ist zu lang. Um die Demo fortzusetzen: Kürzen Sie die Nachricht und senden Sie sie erneut."
      rag_excerpt: "Ursache: Die RAG-Auszüge belegen den größten Teil des Kontexts. Um die Demo fortzusetzen: Deaktivieren Sie den RAG-Baustein oder senken Sie [rag] top_k in settings.json."
