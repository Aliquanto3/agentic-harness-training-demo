# German translation of content/rag_lab.yaml (languages 4/5, AD-19): same keys, same stage,
# option and param ids, same placeholders.

title_text: "RAG-Werkstatt: die RAG-Architektur zum Ausprobieren"
intro_text: >-
  Ein RAG in zwei Phasen: Die Indexierung (Build) legt die Chunks des Korpus ein für alle Mal
  in einem Vector Store ab; die Anfrage (Run) sucht darin bei jeder Frage die nützlichen Chunks
  und setzt sie in den Prompt des Modells. Starten Sie die Kette mit einer Frage, um zu sehen,
  was jeder Schritt erhält, was er erzeugt und was er kostet. Das ist eine Spielwiese: Der
  RAG-Baustein der Werkstatt ändert sich nicht.
busy_text: "Derzeit nicht verfügbar: {raison}"

chain_title_text: "Die RAG-Kette, Schritt für Schritt"
chain_help_text: >-
  Die Sequenz der Schritte, die Komponenten, die sie anspricht, und der Fokus auf dem gewählten
  Schritt. Im Modus Abspielen erscheinen die Schritte und ihre Komponenten nacheinander, von
  Hand (◀ ▶) oder im Lauf einer Ausführung. Im Modus Zusammenstellen lassen sich die Schritte des Retrieval-Segments
  (Dense retrieval, BM25, Fusion, Reranking) entfernen, hinzufügen und verschieben; die
  Generation ist eingezeichnet, um zu zeigen, was das Modell erhalten würde, wird hier aber
  nicht ausgeführt.

