# One card per stage kind: its name and what it does (2 to 3 sentences).
stages:
  chunking:
    label_text: "Chunking"
    explain_text: >-
      Die Dokumente des Korpus werden in Auszüge zerlegt: Absätze werden zusammengefasst,
      solange sie in die Maximalgröße passen, ein zu langer Absatz wird am Satzende getrennt.
      Ein zu kleiner Auszug verliert seinen Kontext; ein zu großer verwässert die Information.
  embedding:
    label_text: "Embedding"
    explain_text: >-
      Ein Embedding-Modell wandelt jeden Auszug, dann die Frage, in einen Zahlenvektor um.
      Zwei Texte mit ähnlicher Bedeutung ergeben nahe Vektoren, auch ohne gemeinsames Wort.
  vector_store:
    label_text: "Vektordatenbank"
    explain_text: >-
      Die Vektoren der Auszüge werden in einer Datenbank abgelegt, ein für alle Mal berechnet:
      Das ist die Indexierung. Bei jeder Frage wird nur noch die Frage eingebettet.
  vector_search:
    label_text: "Suche"
    explain_text: >-
      Die Datenbank liefert die Auszüge, deren Vektor dem der Frage am nächsten liegt
      (Kosinus-Ähnlichkeit), ohne Schwelle: die k nächsten, ob relevant oder nicht.
  lexical_search:
    label_text: "Lexikalische Suche BM25"
    explain_text: >-
      Eine Suche nach Wörtern, ohne Embedding: Auszüge, die Wörter mit der Frage teilen,
      rücken nach vorn, wobei ein seltenes Wort mehr wiegt als ein häufiges (BM25); Akzente,
      Umlaute und kurze deutsche Füllwörter (der, und, von…) werden ignoriert. Sie findet ein
      Kürzel, einen Code oder eine exakte Zahl („HR“, „35“), die ein Embedding übersehen kann.
  fusion:
    label_text: "Fusion"
    explain_text: >-
      Zwei Suchen ergeben zwei Rankings; die Reciprocal Rank Fusion kombiniert sie: Jeder
      Auszug erhält in jeder Liste 1 / (60 + sein Rang). Ein Auszug, den beide weit oben
      einordnen, rückt nach vorn: Das ist die hybride Suche.
  rerank:
    label_text: "Reranking"
    explain_text: >-
      Ein Reranker liest die Frage und jeden Kandidaten zusammen und bewertet ihre Relevanz.
      Er ist langsamer als eine Vektorsuche, sieht nur die Kandidaten, die sie behalten hat,
      und ordnet sie dann neu.
  context:
    label_text: "Aufbau des Kontexts"
    explain_text: >-
      Nur die ersten Auszüge kommen in den Kontext, nummeriert, mit dem Titel ihres
      Dokuments, vor der Frage. Jeder Auszug kostet Tokens im Fenster des Modells.
  generation:
    label_text: "Generierung"
    explain_text: >-
      Das Modell liest diesen Kontext und die Frage und antwortet dann gestützt auf die
      Auszüge. Eine gute Antwort hängt davon ab, was die vorigen Schritte ihm geliefert haben.

