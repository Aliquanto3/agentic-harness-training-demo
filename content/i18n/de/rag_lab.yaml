# A stage of the chain: its technical name (English, the same in the three languages) and
# what it does (2 to 3 sentences).
stages:
  chunking:
    label_text: "Chunking"
    explain_text: >-
      Die Dokumente des Korpus werden in Chunks zerlegt: Absätze werden zusammengefasst,
      solange sie in die Maximalgröße passen, ein zu langer Absatz wird am Satzende getrennt.
      Ein zu kleiner Chunk verliert seinen Kontext; ein zu großer verwässert die Information.
  embedding:
    label_text: "Embedding"
    explain_text: >-
      Ein Embedding-Modell wandelt jeden Chunk, dann die Frage, in einen Zahlenvektor um. Zwei
      Texte mit ähnlicher Bedeutung ergeben nahe Vektoren, auch ohne gemeinsames Wort.
  vector_store:
    label_text: "Vector store"
    explain_text: >-
      Die Vektoren der Chunks werden in einem Vector Store abgelegt, ein für alle Mal
      berechnet: Das ist die Indexierung. Er findet schnell die Vektoren, die einem anderen am
      nächsten liegen; bei jeder Frage wird nur noch die Frage eingebettet.
  vector_search:
    label_text: "Dense retrieval"
    explain_text: >-
      Der Vector Store liefert die Chunks, deren Vektor dem der Frage am nächsten liegt
      (Kosinus-Ähnlichkeit), ohne Schwelle: die k nächsten, ob relevant oder nicht.
  lexical_search:
    label_text: "BM25"
    explain_text: >-
      Eine Suche nach Schlüsselwörtern, ohne Embedding: Chunks, die Wörter mit der Frage
      teilen, rücken nach vorn, wobei ein seltenes Wort mehr wiegt als ein häufiges (BM25);
      Akzente, Umlaute und kurze deutsche Füllwörter (der, und, von…) werden ignoriert. Sie
      findet ein Kürzel, einen Code oder eine exakte Zahl („HR“, „35“), die ein Embedding
      übersehen kann.
  fusion:
    label_text: "Fusion (RRF)"
    explain_text: >-
      Zwei Suchen ergeben zwei Rankings; die Reciprocal Rank Fusion (RRF) kombiniert sie:
      Jeder Chunk erhält in jeder Liste 1 / (60 + sein Rang). Ein Chunk, den beide weit oben
      einordnen, rückt nach vorn: Das ist die hybride Suche.
  rerank:
    label_text: "Reranking"
    explain_text: >-
      Ein Reranker liest die Frage und jeden Kandidaten zusammen und bewertet ihre Relevanz.
      Das Dense retrieval verglich zwei getrennt berechnete Vektoren; der Reranker liest beide
      Texte nebeneinander: Er urteilt besser, ist aber viel langsamer. Deshalb sieht er nur die
      behaltenen Kandidaten und ordnet sie dann neu.
  context:
    label_text: "Prompt augmentation"
    explain_text: >-
      Nur die ersten Chunks kommen in den Prompt, nummeriert, mit dem Titel ihres Dokuments,
      vor der Frage: Das ist der erweiterte Prompt. Jeder Chunk kostet Tokens im Fenster des
      Modells.
  generation:
    label_text: "Generation"
    explain_text: >-
      Das LLM liest den erweiterten Prompt und antwortet gestützt auf die Chunks. Eine gute
      Antwort hängt davon ab, was die vorigen Schritte ihm geliefert haben.

