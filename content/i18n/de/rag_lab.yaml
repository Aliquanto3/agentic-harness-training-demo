title_text: "RAG-Werkstatt: die RAG-Architektur zum Ausprobieren"
intro_text: >-
  Eine RAG-Kette, Teil für Teil: Der Korpus wird in Auszüge zerlegt, jeder Auszug wird zu
  einem Vektor, die Vektoren werden in einer Datenbank abgelegt, dann wird die Frage mit ihnen
  verglichen, um die nützlichen Auszüge zu finden, die ein Reranker neu ordnen kann, bevor sie
  in den Kontext des Modells gelangen. Starten Sie die Kette mit einer Frage, um zu sehen, was
  jeder Schritt erhält, was er erzeugt und was er kostet. Das ist eine Spielwiese: Der
  RAG-Baustein der Werkstatt ändert sich nicht.
back_text: "← Werkstatt"
busy_text: "Derzeit nicht verfügbar: {raison}"

chain_title_text: "Die Kette"
chain_help_text: >-
  Die Schritte, von links nach rechts. Zwischen der Vektordatenbank und dem Kontext lassen
  sich Suchen, Fusion und Reranking entfernen, hinzufügen und verschieben. Die Generierung ist
  eingezeichnet, um zu zeigen, was das Modell erhalten würde, wird hier aber nicht ausgeführt.

