# Story 5 vom 2026-09-30: die lebendige Verteilung (Stufe 3 seit Lot 6), der A/B-Vergleich
# (Abschnitt 6), das Schema des Fensters (Abschnitt 5).
distribution:
  title_text: "Was die Einstellungen mit den Kandidaten machen"
  intro_text: >-
    Die Kandidaten eines bereits erzeugten Tokens, so wie das Modell sie gesehen hat.
    Bewegen Sie einen Regler: WaveStack berechnet neu, welche im Rennen bleiben und welche
    Chance jeder hat, gezogen zu werden, ohne neue Generierung. Die Wahrscheinlichkeit des
    Modells bewegt sich nicht.
  empty_text: >-
    Ziehen Sie das nächste Token, unten. Erzeugen Sie eine Antwort mit aktiviertem
    „Kandidaten-Tokens zeigen“ (Abschnitt 6): Die Kandidaten ihres ersten Tokens erscheinen
    auch hier.
  token_text: "Token {index} der letzten Generierung (A bei einem Vergleich): {texte}. Klicken Sie auf einen anderen Chip in Abschnitt 6, um ihn zu wählen."
  probability_text: "Wahrscheinlichkeit des Modells"
  chance_text: "Chance, gezogen zu werden"
  dropped_text: "verworfen"
  kept_text: "{gardes} Kandidaten behalten unter den {lus} wahrscheinlichsten gelesenen."
  more_text: "… und {reste} weitere gelesene Kandidaten, weiter unten, nicht angezeigt."
  tail_text: "Rest des Vokabulars"
  tail_help_text: >-
    WaveStack behält die {lus} wahrscheinlichsten Kandidaten jedes Tokens; der Rest des
    Vokabulars wiegt {reste} der Wahrscheinlichkeit. Die Chance, gezogen zu werden, wird nur
    unter den behaltenen Kandidaten verteilt: eine Näherung, treu, solange dieser Rest klein
    ist.

compare:
  title_text: "Zwei Einstellungen vergleichen"
  intro_text: >-
    Derselbe Prompt, zweimal erzeugt: A mit den Einstellungen aus Stufe 3, B mit den
    folgenden. Ein einziges Modell läuft auf dem Prozessor: B beginnt, wenn A fertig ist.
    „Stoppen“ stoppt beide.
  b_settings_text: "Einstellungen B"
  button_text: "Vergleichen"
  running_text: "Vergleich läuft: A, dann B…"
  lane_a_text: "A"
  lane_b_text: "B"
  waiting_text: "Warten auf das Ende von A."
  empty_text: "Noch nichts."

window:
  title_text: "Das Fenster, Token für Token"
  prompt_text: "Prompt: {tokens}"
  free_text: "Frei"
  reserve_text: "Ausgabereserve: {reserve}"
  output_text:
    one: "Antwort: {tokens} Token"
    other: "Antwort: {tokens} Tokens"
  output_fragments_text:
    one: "Antwort: {tokens} Fragment empfangen"
    other: "Antwort: {tokens} Fragmente empfangen"
  caption_text: >-
    Das Fenster fasst {fenetre} Tokens: {utilisables} für den Prompt, {reserve} für die
    Antwort reserviert. Bei jedem Schritt liest das Modell das ganze bisher gefüllte Fenster
    erneut (der Cache erspart ihm, alles neu zu berechnen), und das gezogene Token kommt ans
    Ende: Der Lesekopf gleitet um ein Token weiter. Ein Prompt, der länger als sein Anteil
    ist, wird nicht gesendet.
