  more_text: "… und {reste} weitere Tokens, nicht angezeigt (höchstens 512 Chips)."
  special_text: "Spezial"
  special_help_text: >-
    Spezial-Token: eine Markierung der Vorlage (Anfang oder Ende einer Nachricht), die als
    ein einziges Token gelesen wird.
  blanks_text: "␣ markiert ein Leerzeichen, ↵ einen Zeilenumbruch: Sie sind Tokens wie alle anderen."
  exact_text: "Exakte Zerlegung durch den Tokenizer des aktiven Modells."
  estimate_text: >-
    Schätzung des Harness: ≈ {estimation} Tokens ({caracteres} Zeichen, bei {ratio} Zeichen
    pro Token).
