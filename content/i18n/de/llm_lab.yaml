vectorization:
  title_text: "Vom Text zum Vektor"
  help_text: >-
    Jede Kennung wählt eine Zeile der Embedding-Tabelle. Diese Zeile ist ein Zahlenvektor,
    den die Schichten des Modells nacheinander umwandeln.
  unknown_text: "unbekannt"
  steps:
    text_text: "Text"
    tokens_text: "Tokens"
    ids_text: "Kennungen"
    table_text: "Embedding-Tabelle"
    table_caption_text: "{vocabulaire} Zeilen (Vokabular) × {dimension} Spalten (Dimension)"
    params_text: "gelernte Zahlen: {parametres}"
    vector_text: "Vektor"
    vector_caption_text: "{dimension} Zahlen pro Token"
    layers_text: "Schichten"
    layers_caption_text: "{couches} Schichten, {tetes} Attention-Heads"
    layers_only_caption_text: "{couches} Schichten"

sampling:
  reset_text: "Zurück zu den Werten des Harness"
  unsupported_text: "Nicht einstellbar"
  settings:
    temperature:
      label_text: "Temperatur"
      help_text: >-
        Glättet oder verschärft die Wahrscheinlichkeiten vor dem Ziehen. Bei 0 nimmt das
        Modell immer das wahrscheinlichste Token (jedes Mal dieselbe Antwort); über 1 haben
        auch unwahrscheinliche Tokens eine Chance.
    top_k:
      label_text: "Top-k"
      help_text: >-
        Behält nur die k wahrscheinlichsten Tokens; alle anderen werden vor dem Ziehen
        verworfen. Bei 0 ist Top-k ausgeschaltet: Es verwirft kein Token.
    top_p:
      label_text: "Top-p"
      help_text: >-
        Behält die wahrscheinlichsten Tokens, bis ihre summierten Wahrscheinlichkeiten p
        erreichen; 1 verwirft nichts.
    min_p:
      label_text: "Min-p"
      help_text: >-
        Verwirft jedes Token, dessen Wahrscheinlichkeit unter dem Min-p-Fachen der des
        wahrscheinlichsten liegt; 0 verwirft nichts.

