        Glättet oder verschärft die Wahrscheinlichkeiten vor dem Ziehen. Bei 0 nimmt das
        Modell immer das wahrscheinlichste Token (jedes Mal dieselbe Antwort); über 1 haben
        auch unwahrscheinliche Tokens eine Chance.
    top_k:
      label_text: "Top-k"
      help_text: >-
        Behält nur die k wahrscheinlichsten Tokens; alle anderen werden vor dem Ziehen
        verworfen. Bei 0 ist Top-k ausgeschaltet: Es verwirft kein Token.
    top_p:
      label_text: "Top-p"
      help_text: >-
        Behält die wahrscheinlichsten Tokens, bis ihre summierten Wahrscheinlichkeiten p
        erreichen; 1 verwirft nichts.
    min_p:
      label_text: "Min-p"
      help_text: >-
        Verwirft jedes Token, dessen Wahrscheinlichkeit unter dem Min-p-Fachen der des
        wahrscheinlichsten liegt; 0 verwirft nichts.

