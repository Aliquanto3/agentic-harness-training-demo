# Une étape de la chaîne : son nom technique (en anglais, le même dans les trois langues) et
# ce qu'elle fait (2 à 3 phrases).
stages:
  chunking:
    label_text: "Chunking"
    explain_text: >-
      Les documents du corpus sont coupés en chunks : les paragraphes sont regroupés tant
      qu'ils tiennent dans la taille maximale, un paragraphe trop long est coupé en fin de
      phrase. Un chunk trop petit perd son contexte ; trop grand, il noie l'information.
  embedding:
    label_text: "Embedding"
    explain_text: >-
      Un modèle d'embedding transforme chaque chunk, puis la question, en un vecteur de
      nombres. Deux textes au sens proche donnent des vecteurs proches, même sans mot commun.
  vector_store:
    label_text: "Vector store"
    explain_text: >-
      Les vecteurs des chunks sont rangés dans un vector store, calculé une fois pour toutes :
      c'est l'indexation. Il sait retrouver vite les vecteurs les plus proches d'un autre ; à
      chaque question, on ne vectorise plus que la question.
  vector_search:
    label_text: "Dense retrieval"
    explain_text: >-
      Le vector store rend les chunks dont le vecteur est le plus proche de celui de la
      question (similarité cosinus), sans seuil : les k plus proches, pertinents ou non.
  lexical_search:
    label_text: "BM25"
    explain_text: >-
      Une recherche par mots-clés, sans embedding : les chunks qui partagent des mots avec la
      question passent devant, un mot rare pesant plus qu'un mot courant (BM25) ; les accents et
      les petits mots (le, de, et…) sont ignorés. Elle retrouve un sigle, un code ou un nombre
      exact (« RH », « 35 ») qu'un embedding peut manquer.
  fusion:
    label_text: "Fusion (RRF)"
    explain_text: >-
      Deux recherches donnent deux classements ; la fusion des rangs réciproques (RRF) les
      combine : chaque chunk gagne 1 / (60 + son rang) dans chaque liste. Un chunk bien classé
      par les deux passe devant : c'est la recherche hybride.
  rerank:
    label_text: "Reranking"
    explain_text: >-
      Un reranker relit la question et chaque candidat ensemble, et note leur pertinence. Le
      Dense retrieval comparait deux vecteurs calculés séparément ; le reranker lit les deux
      textes côte à côte : il juge mieux, mais il est bien plus lent. C'est pourquoi il ne voit
      que les candidats retenus, puis les réordonne.
  context:
    label_text: "Prompt augmentation"
    explain_text: >-
      Seuls les premiers chunks entrent dans le prompt, numérotés, avec le titre de leur
      document, avant la question : c'est le prompt augmenté. Chaque chunk coûte des tokens
      dans la fenêtre du modèle.
  generation:
    label_text: "Generation"
    explain_text: >-
      Le LLM lit le prompt augmenté et répond en s'appuyant sur les chunks. Une bonne réponse
      dépend de ce que les étapes précédentes lui ont apporté.

