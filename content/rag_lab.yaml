  Les étapes, de gauche à droite. Entre la base vectorielle et le contexte, les recherches, la
  fusion et le reranking se retirent, s'ajoutent et se déplacent. La génération est dessinée
  pour montrer ce que le modèle recevrait, mais elle ne s'exécute pas ici.

