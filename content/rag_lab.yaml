# Une carte par type d'étape : son nom et ce qu'elle fait (2 à 3 phrases).
stages:
  chunking:
    label_fr: "Découpage"
    explain_fr: >-
      Les documents du corpus sont coupés en extraits : les paragraphes sont regroupés tant
      qu'ils tiennent dans la taille maximale, un paragraphe trop long est coupé en fin de
      phrase. Un extrait trop petit perd son contexte ; trop grand, il noie l'information.
  embedding:
    label_fr: "Embedding"
    explain_fr: >-
      Un modèle d'embedding transforme chaque extrait, puis la question, en un vecteur de
      nombres. Deux textes au sens proche donnent des vecteurs proches, même sans mot commun.
  vector_store:
    label_fr: "Base vectorielle"
    explain_fr: >-
      Les vecteurs des extraits sont rangés dans une base, calculée une fois pour toutes :
      c'est l'indexation. À chaque question, on n'embedde plus que la question.
  vector_search:
    label_fr: "Recherche"
    explain_fr: >-
      La base rend les extraits dont le vecteur est le plus proche de celui de la question
      (similarité cosinus), sans seuil : les k plus proches, pertinents ou non.
  lexical_search:
    label_fr: "Recherche lexicale BM25"
    explain_fr: >-
      Une recherche par mots, sans embedding : les extraits qui partagent des mots avec la
      question passent devant, un mot rare pesant plus qu'un mot courant (BM25) ; les accents et
      les petits mots (le, de, et…) sont ignorés. Elle retrouve un sigle, un code ou un nombre
      exact (« RH », « 35 ») qu'un embedding peut manquer.
  fusion:
    label_fr: "Fusion"
    explain_fr: >-
      Deux recherches donnent deux classements ; la fusion des rangs réciproques les combine :
      chaque extrait gagne 1 / (60 + son rang) dans chaque liste. Un extrait bien classé par les
      deux passe devant : c'est la recherche hybride.
  rerank:
    label_fr: "Reranking"
    explain_fr: >-
      Un reranker relit la question et chaque candidat ensemble, et note leur pertinence. Plus
      lent qu'une recherche vectorielle, il ne voit que les candidats qu'elle a retenus, puis
      les réordonne.
  context:
    label_fr: "Construction du contexte"
    explain_fr: >-
      Seuls les premiers extraits entrent dans le contexte, numérotés, avec le titre de leur
      document, avant la question. Chaque extrait coûte des tokens dans la fenêtre du modèle.
  generation:
    label_fr: "Génération"
    explain_fr: >-
      Le modèle lit ce contexte et la question, puis répond en s'appuyant sur les extraits.
      Une bonne réponse dépend de ce que les étapes précédentes lui ont apporté.

