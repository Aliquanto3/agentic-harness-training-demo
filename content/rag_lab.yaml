title_fr: "Atelier RAG : l'architecture RAG à manipuler"
intro_fr: >-
  Une chaîne RAG, pièce par pièce : le corpus est découpé en extraits, chaque extrait devient
  un vecteur, les vecteurs sont rangés dans une base, puis la question est comparée à eux pour
  retrouver les extraits utiles, qu'un reranker peut réordonner avant qu'ils n'entrent dans le
  contexte du modèle. Lancez la chaîne sur une question pour voir ce que chaque étape reçoit,
  produit, et ce qu'elle coûte. C'est un bac à sable : la brique RAG de l'atelier ne change pas.
