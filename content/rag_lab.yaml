title_text: "Atelier RAG : l'architecture RAG à manipuler"
intro_text: >-
  Un RAG en deux temps : l'indexation (build) range une fois pour toutes les chunks du corpus
  dans un vector store ; la requête (run), à chaque question, y cherche les chunks utiles et les
  place dans le prompt du modèle. Lancez la chaîne sur une question pour voir ce que chaque
  étape reçoit, produit, et ce qu'elle coûte. C'est un bac à sable : la brique RAG de l'atelier
  ne change pas.
busy_text: "Indisponible pour l'instant : {raison}"

chain_title_text: "La chaîne RAG, étape par étape"
chain_help_text: >-
  La séquence des étapes, les composants qu'elle sollicite et le focus sur l'étape choisie. En
  mode Dérouler, les étapes et leurs composants arrivent un à un, à la main (◀ ▶) ou au fil
  d'une exécution. En mode Composer, les étapes du segment de récupération (Dense retrieval,
  BM25, Fusion, Reranking) se retirent, s'ajoutent et se déplacent ; la Generation est dessinée
  pour montrer ce que le modèle recevrait, mais elle ne s'exécute pas ici.

