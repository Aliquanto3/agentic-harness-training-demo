[project]
name = "wavestack"
version = "0.1.0"
description = "Démonstrateur pédagogique d'un harnais agentique, brique par brique, en local sur CPU."
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn>=0.53,<0.54",
    "pydantic>=2.13,<3",
    "httpx>=0.28,<0.29",
    "truststore>=0.10,<0.11",
    "psutil>=7.2,<8",
    "llama-cpp-python>=0.3.35,<0.4",
    "jinja2>=3.1.6,<4",
    "pyyaml>=6.0.3,<7",
    "mcp>=2.2,<2.3",
    "httpx2>=2.13,<3",
    "anyio>=4.15,<5",
    "mcp-types>=2.2,<2.3",
    "sqlite-vec==0.1.9",
]

[project.scripts]
wavestack = "wavestack.cli:main"

[project.optional-dependencies]
compression = [
    "headroom-ai==0.38.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16,<0.17",
    "pytest>=9.1,<10",
    "starlette>=1.7,<2",
]

[tool.uv]
no-build-package = ["llama-cpp-python"]

[[tool.uv.index]]
name = "abetlen-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true

[tool.uv.sources]
llama-cpp-python = { index = "abetlen-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wavestack"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".claude", "_bmad", "_bmad-output"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
markers = [
    "model: requires a real GGUF file on disk (skipped by default)",
]
addopts = "-m 'not model'"
testpaths = ["tests"]
