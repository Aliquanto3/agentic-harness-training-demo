- id: "2"
  title: "Langues (2/5) : renommage des champs *_fr, catalogue ui.yaml et t(), interface principale"
  description: >-
    Renommer les champs *_fr en *_text partout, poser le catalogue d'interface (ui.yaml par
    langue, route, i18n.js et t()) et traduire l'écran principal, formats Intl et barre haute
    compris (CAP-1, contraintes « Renommage », « Textes de l'interface » et « L'allemand est la
    langue la plus longue » de SPEC.md).
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Lire i18n-conventions.md avant tout. Trois commits dans cet ordre : (1) renommage pur
    *_fr -> *_text, sans aucun texte changé, suite verte avant et après ; (2) mécanisme
    ui.yaml, route, i18n.js, t() ; (3) traductions en et de. Barre haute : la faire tenir en
    de à 1 280 et 1 600 px, normal et projection (entrée « Barre haute saturée » de
    deferred-work.md). Reprendre les textes du code de langue restés français côté front.
    Exécution sur ce PC (16 Go) : pytest en deux moitiés, E2E par tranches --only, toujours
    au premier plan, jamais deux suites à la fois.
