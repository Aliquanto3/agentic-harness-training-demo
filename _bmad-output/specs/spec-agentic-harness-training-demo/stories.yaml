    « Hooks » (UJ-2) s'appuie sur la bande des points d'accroche (8e).
  spec_checkpoint: false
  done_checkpoint: true
  invoke_dev_with: >-
    Implémenter le schéma de contenu des scénarios (AD-19) et la réinitialisation
    (AD-17). Un scénario par brique construite dans les stories 1 à 9.

- id: "11"
  title: Modèles cloud via API (Groq, Mistral)
  description: >-
    Modèles cloud déclarés en configuration (préréglages Groq et Mistral, exemples
    Google, NVIDIA et OpenRouter avec avertissement), choisis au diagnostic avec
    saisie de la clé, test réel, infobulle par fournisseur et avertissement à
    confirmer ; mêmes tours qu'en local, appels tracés comme données sortantes,
    refus du fournisseur expliqués (CAP-43, CAP-3, CAP-10, CAP-31, CAP-33, CAP-35).
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Suivre le spine du 2026-09-24 (update cloud FR-43). Adaptateur openai_chat
    derrière le port Engine (AD-5) : il reçoit un ChatBody que context seul écrit
    (AD-4, mode chat) et l'envoie octet pour octet, avec le client de net (AD-15,
    origin = model, follow_redirects=False, hôtes des entrées enabled autorisés).
    Clé lue par config.cloud_key(entry) seulement, écrite par config.write_api_key
    (AD-20), SecretStr de bout en bout, jamais tracée. La session attribue le
    tool_call_id (hachage base 62 de « step_id#index », unicité vérifiée par tour,
    AD-4). Tokens estimés avant l'envoi, puis context_reconciled avec les mêmes
    champs de jauge que context_rendered (AD-2, AD-9), ratio appris sur les
    appels réels seulement. Fenêtre cloud = min(window ou fenêtre configurée,
    context, tpm // 2), avec window_source (AD-9). CloudModel et fusion par id
    (AD-20), capacités déclarées (AD-6), issues fournisseur en liste fermée, sans
    nouvel essai (AD-16). Au diagnostic (AD-3, AD-21) : set_api_key,
    test_cloud_model (portée diag, au plus deux appels) et
    select_model{kind: cloud, ref, acknowledged: true}, refusé sans acknowledged ;
    select_model passe en classe (b), le code de la story 1b s'aligne. Effets
    SettingWrite et ApiKeySet (AD-23), active_model dans /api/state (AD-12),
    indicateur de modèle et bandeau de Contexte LLM (EXPERIENCE.md). Aucune
    nouvelle dépendance ; tests avec httpx.MockTransport injecté par net. Point
    sensible (secrets, sortie réseau) : faire vérifier la garde et le test de clé
    sentinelle avant la clôture.

- id: "12"
  title: "Tests préalables : Headroom, embedding et reranking"
  description: >-
    Vérifie headroom-ai et choisit les modèles d'embedding et de reranking avant
    d'écrire une brique qui en dépend (CAP-32, CAP-17 à CAP-19). Ouvre le palier 2
    et ne livre aucune brique : le résultat est un verdict chiffré.
  spec_checkpoint: false
  done_checkpoint: true
  invoke_dev_with: >-
    Story d'investigation, critères de la section Deferred du spine. Headroom
    (headroom-ai 0.38.0) : fonctionne hors ligne sous la garde réseau (AD-15), sans
    téléchargement à l'import (LITELLM_LOCAL_MODEL_COST_MAP=True, cache tiktoken
    fourni par TIKTOKEN_CACHE_DIR), sans torch, respecte la règle d'adoption d'AD-15,
    tient dans le budget d'AD-8 (RSS mesuré), licence compatible (NFR-10).
    Embedding et reranking : GGUF chargés par llama-cpp-python via le LoadRegistry
    (AD-8, AD-22), sinon repli fastembed (licence et règle d'adoption vérifiées).
    Livrer le verdict avec les mesures (retenu ou repli, RSS, licence, accès réseau
    observés) pour mettre à jour la Stack et le Deferred du spine ; n'ajouter aucune
    dépendance au projet pour un candidat écarté. Dépend de la garde réseau
    (stories 5 et 6). Doit être terminée avant les stories 15, 16 et 20.

- id: "13"
  title: Raisonnement
  description: >-
    Brique raisonnement activable, affichage du raisonnement au choix dans la vue
    humain et toujours dans Contexte LLM, indisponible avec sa raison si le modèle ne
    raisonne pas (CAP-10).
  spec_checkpoint: false
  done_checkpoint: true
  invoke_dev_with: >-
    Brique au contrat d'AD-12, disponibilité tirée de la capacité raisonnement du
    registre (AD-6). Le séparateur incrémental et le canal reasoning de model_delta
    (AD-2, AD-6) viennent de la story 3 : les vérifier, ne pas en créer d'autres.
    Réserve de sortie de 1 536 tokens quand la brique est active, aperçu et jauge
    recalculés (AD-9). En local : variable de raisonnement du gabarit. En cloud
    (story 11) : reasoning.on ou reasoning.off écrits par context dans le ChatBody,
    reasoning.always affiché « toujours active pour ce modèle » avec sa raison et
    réserve maintenue brique éteinte, reasoning.resend respecté (AD-4, AD-6, AD-20).
    Option « Afficher le raisonnement » et reasoning-block (EXPERIENCE.md). Livrer le
    scénario de la brique au schéma de la story 10 (AD-19). Dépend des stories 3, 10
    et 11.

- id: "14"
  title: Mémoire globale
  description: >-
    Mémoire persistante d'une conversation à l'autre, injectée dans le contexte,
    écrite par le modèle ou forcée, consultable et modifiable dans le tiroir
    d'édition (CAP-13).
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Segment global_memory dans le message système stable, lu au début du tour et
    figé dans le TurnState pour tous les appels du tour (AD-4, AD-17). Écriture par
    le méta-outil remember (réponse tool_result de la brique global_memory) et par
    l'action forcée « Écrire en mémoire », tous deux posés en story 9 (AD-25) ; toute
    écriture est un Effect MemoryWrite appliqué par la session seule, avec
    effect_applied sur file.memory (AD-23), fichier dans le dossier de données
    (AD-20). Tiroir d'édition : consulter, modifier, supprimer une entrée, tout
    effacer, par intentions de classe (b) (AD-3, EXPERIENCE.md). Mémoire de
    démonstration publiable dans content/memory (AD-19, NFR-11), restaurée par la
    réinitialisation de la story 10 (CAP-41). Badge de déclenchement modèle ou forcé
    sur chaque écriture. Livrer le scénario de la brique. Dépend des stories 9 et 10.

- id: "15"
  title: Corpus de démonstration et RAG simple
  description: >-
    Corpus français fourni avec son index local, et recherche RAG visible à chaque
    tour : requête, extraits avec score, position dans le contexte (CAP-17, CAP-18).
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Corpus publiable dans content/corpus (NFR-11). Index sqlite-vec précalculé par
    scripts/build_rag_index.py et fourni dans data/, avec l'identifiant du modèle
    d'embedding retenu en story 12 ; brique indisponible avec sa raison si le modèle
    chargé diffère, ou « modèle absent » avec l'action Télécharger (AD-21, AD-22).
    Port Retriever.search(query) → extraits scorés ; embedding chargé par le
    LoadRegistry et compté même quand le modèle actif est cloud (AD-8). Segments
    rag_excerpt dans le message utilisateur du tour (AD-4), extraits comptés à leur
    maximum déclaré dans l'aperçu (AD-9). Étape de recherche dépliable dans
    Orchestration ; nœud file.rag_index en fichier local dans le schéma. Livrer le
    scénario de la brique. Dépend des stories 10, 11 et 12.

- id: "16"
  title: Reranking
  description: >-
    Sous-option de la brique RAG qui réordonne les extraits, avec l'ordre avant et
