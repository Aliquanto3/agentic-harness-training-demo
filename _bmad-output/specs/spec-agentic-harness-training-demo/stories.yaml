  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Implémenter cli/config/models selon AD-7 (découverte + sonde GGUF), AD-20 (dossier
    de données hors dépôt), AD-21 (lancement, diagnostic bloquant terminal + navigateur).

