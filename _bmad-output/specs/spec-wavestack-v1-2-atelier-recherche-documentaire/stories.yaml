  done_checkpoint: true
  invoke_dev_with: >-
    CRAG réutilise le passage_filter de la story 8. Arbre RAPTOR précalculé avec la mesure de
    sa construction. Fiches en fr, en, de.
- id: "13"
  title: GraphRAG simplifié
  description: >-
    CAP-7 (partie) : extraction d'entités et de relations, communautés, requête locale et
    globale, sur un graphe précalculé, avec bouton « reconstruire ».
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Implémentation maison, LightRAG en inspiration seulement. Trancher networkx (extra épinglé)
    ou union-find maison pour les communautés, et le consigner. Le coût mesuré doit montrer
    « plus cher à toutes les étapes ». Fiche en fr, en, de.
- id: "14"
  title: LLM Wiki
  description: >-
    CAP-7 (partie) : compilation d'un wiki Markdown depuis les sources, requête sur le wiki,
    passe de lint, wiki précalculé.
  done_checkpoint: true
  invoke_dev_with: >-
    Pattern de Karpathy, implémentation maison. Mise à jour = recompilation des pages touchées
    puis lint, mesurée. Fiche en fr, en, de.
- id: "15"
  title: Vue Évaluer
  description: >-
    CAP-11 : verdicts des juges par question et critère face à l'annotation humaine, agrégats
    avec n et bandeau, quatre pièges démontrés sur des cas livrés.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Métriques recalculées en interne selon evaluation.md. Adaptateurs Ragas et DeepEval dans
    l'extra eval-adapters, à écarter s'ils tirent torch ou un service. Choix du second juge selon
    la réponse d'Anaël à la question ouverte.
- id: "16"
  title: Arbre des étapes et export OpenTelemetry
  description: >-
    CAP-12 : arbre étape, sous-étape, appel de modèle dans l'onglet Construire ; export OTLP aux
    conventions GenAI derrière l'extra otel, rien ne sort sans URL réglée.
  done_checkpoint: true
  invoke_dev_with: >-
    Renseigner parent_step dans les événements de l'atelier. Test avec un faux collecteur OTLP
    HTTP local. Aucun service embarqué.
- id: "17"
  title: Document piégé
  description: >-
    CAP-13 : injection indirecte, PoisonedRAG et empoisonnement du graphe, avec et sans
