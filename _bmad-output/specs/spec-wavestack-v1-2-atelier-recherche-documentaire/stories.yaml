- id: "1"
  title: Corpus Exemplia enrichi et jeu de questions
  description: >-
    CAP-1 et CAP-2 : 25 à 30 documents (renvois multi-sauts, versions datées, monolingues,
    piégé et sentinelle inactifs, marquage d'audience) et au moins 3 questions par type en fr, en, de.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Contenu seulement, pas de nouvelle étape. Suivre corpus-et-questions.md. Mesurer les tokens
    par langue (cible ~12 000, plafond 16 384 avec question et réponse). Exempter nommément les
    documents monolingues du contrôle de miroir. Test : chaque extrait attendu existe dans son
    document, dans chaque langue de la question. Les 8 documents existants restent.
- id: "2"
  title: Banc préalable System One et fenêtre de 16 384 tokens
  description: >-
    Préalable à CAP-6 et CAP-7 : mesurer des candidats filtre de passages et contrôle d'ancrage
    sur le jeu de questions, et vérifier que Qwen3.5-2B avec 16 384 tokens tient dans 4 Go.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Sur le modèle de tools/bench/v2s6_decision_bench.py et decision-model-candidates.md.
    Candidats : reranker déjà livré utilisé comme filtre, petits NLI en ONNX, SLM juge
    Qwen3.5-2B + GBNF. Ni torch ni service. Rapport versionné dans le dossier de la spec ;
    l'hypothèse 16 384 tokens / 4 Go est confirmée ou infirmée dans .memlog.md.
- id: "3"
  title: Coûts en trois temps et mesure de l'embedding, du reranking et de l'indexation
  description: >-
    CAP-8 : coûts de construction, de mise à jour et de requête par exécution, embedding,
    reranking et indexation compris, avertissement des deux périmètres conservé.
  done_checkpoint: true
  invoke_dev_with: >-
    Fondation des stories d'architecture. Étendre RagLabStageEndedPayload et greenops.py ;
    retirer la limite de docs/guide.md:750. Boutons Ajouter, Modifier et Supprimer un document
    sur les documents versionnés de la story 1. Notion de coût « mesuré à la construction »
    pour le contenu précalculé.
- id: "4"
  title: Onglets de vue et comparaison de deux exécutions
  description: >-
    CAP-9 et la coquille de vues.md : onglets Construire, Comparer, Évaluer, Attaquer, Fiches
    sur /rag renommée, épingle d'une exécution, colonnes Épinglée et Courante avec écarts.
  done_checkpoint: true
  invoke_dev_with: >-
    Les onglets Évaluer, Attaquer et Fiches restent vides (« à venir ») jusqu'à leurs stories.
    Pas de retour de LANES_MAX ni de compare() : deux runs successifs. L'épingle survit au
    rechargement. Sélecteurs E2E du lot 5 conservés. Sélecteur de question préparée (story 1).
- id: "5"
  title: Compréhension de la requête
  description: >-
    CAP-3 : options rewrite, decompose, follow_up et hyde, requêtes produites visibles dans le
    focus.
  done_checkpoint: true
  invoke_dev_with: >-
    Chaque story qui ajoute une option écrit sa fiche composant (CAP-17) en fr, en, de. Faux
    moteur en test. E2E : décomposition d'une question multi-sauts en au moins 2 sous-requêtes.
- id: "6"
  title: Découpage sémantique, parent-enfant et contextual retrieval
  description: >-
    CAP-4 : trois options de découpage, chunks visibles dans le focus, contextes précalculés
    pour le contextual retrieval ; late chunking fait ou reporté.
  done_checkpoint: true
  invoke_dev_with: >-
    Contextes livrés sous content/ avec la mesure de leur construction ; bouton « reconstruire ».
    Fiches composant en fr, en, de.
- id: "7"
  title: Construction du contexte
  description: >-
    CAP-5 : budget de tokens signalé, ordre « extrémités d'abord », compression avec tokens
    avant et après, prompt final visible.
  done_checkpoint: true
  invoke_dev_with: >-
    Compression via l'extra compression existant (headroom), indisponibilité affichée sinon.
    Fiches composant en fr, en, de.
- id: "8"
  title: Couche de décision System One
  description: >-
    CAP-6 : routeur de stratégie, filtre de passages, contrôle d'ancrage, avec auteur,
    probabilité, seuil réglable et cascade vers le SLM juge.
  done_checkpoint: true
  invoke_dev_with: >-
    Modèles choisis par le rapport de la story 2 ; routeur sur deberta_xsmall. Jev en option
    cloud dans content/cloud.yaml seulement si sa référence d'API est fournie, sinon noté dans
    deferred-work.md. Fiches composant en fr, en, de.
- id: "9"
  title: Diagnostic du bon extrait et « Où naît l'erreur »
  description: >-
    CAP-10 : rang du passage attendu à chaque étape, étape fautive désignée, trois cas d'échec
    rejoués sans appel au modèle.
  done_checkpoint: true
  invoke_dev_with: >-
    Reprend les CAP-2 à CAP-4 de la spec V2 (stories 2 à 4 en brouillon) : les marquer
    absorbées dans la spec V2. Aucune moyenne hors de l'onglet Évaluer.
- id: "10"
  title: Architectures sans index, contexte long et CAG
  description: >-
    CAP-7 (partie) : préréglages long_context et cag, avec coûts en trois temps et refus
    expliqué si la fenêtre n'est pas sur 16 384 tokens.
  done_checkpoint: true
  invoke_dev_with: >-
    CAG par le préfixe en cache : engine.snapshot/restore pour le moteur intégré, cache_prompt
    pour llama-server (brownfield.md). Mise à jour du CAG = rechargement complet, mesuré. Fiches
    d'architecture en fr, en, de.
- id: "11"
  title: Recherche agentique et PageIndex
  description: >-
    CAP-7 (partie) : agent qui lit les fichiers avec des outils, et navigation dans un arbre de
    sections sans vecteurs.
  done_checkpoint: true
  invoke_dev_with: >-
    Agentique : réutiliser la brique outils et MCP (list_files, grep, read_file limités au
    corpus). Arbre PageIndex précalculé avec bouton « reconstruire ». Fiches en fr, en, de.
- id: "12"
  title: RAPTOR et Corrective RAG
  description: >-
    CAP-7 (partie) : arbre de résumés hiérarchiques précalculé, et filtre de passages suivi d'un
