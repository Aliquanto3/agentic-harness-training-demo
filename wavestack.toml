# Fournisseurs natifs 3/5 : Claude d'Anthropic par l'API Messages (api = "anthropic_messages",
# HTTP brut, sans SDK ; la couche compatible OpenAI d'Anthropic ne renvoie pas la réflexion).
# Prix relevés sur platform.claude.com/docs/en/about-claude/pricing le 2026-10-03 : cache lu
# à 0,1 fois l'entrée, écrit (5 minutes) à 1,25 fois ; WaveStack n'active jamais le cache de
# prompt (pas de cache_control), ces prix ne servent qu'à compter juste si Anthropic en fait.
# Conditions relevées le 2026-10-03 : les données de l'API ne servent pas à l'entraînement
# sans permission expresse ; suppression sous 30 jours ; inférence « global » par défaut (ou
# « us » à 1,1 fois le prix, inference_geo, Claude 4.6 et après seulement), stockage aux
# États-Unis : pas de résidence dans l'UE.
# En-têtes fixes : anthropic-version, et la bêta thinking-binding-controls-2026-08-01 qui
# permet block_binding. WaveStack réécrit l'historique par conception (fenêtre, troncature,
# compression, mémoire, briques changées) : avec prefix_mismatch_behavior = "drop_block",
# Anthropic jette la réflexion devenue invalide au lieu de refuser l'appel (400), et le journal
# le dit (événement reasoning_dropped). Haiku 4.5 et Sonnet 5 ne font pas ce contrôle
# d'historique (propre à Opus 5.5 et Fable 5.1, seuls à pouvoir produire cet
# événement) : l'en-tête leur est envoyé quand même.
# block_binding n'est déclaré que dans reasoning.on : avec { type = "disabled" }, Anthropic le
# refuse (400 « thinking.disabled.block_binding: Extra inputs are not permitted », mesuré sur
# les deux modèles le 2026-10-03), et sans réflexion aucun bloc n'est renvoyé.
# Réflexion : renvoyée telle quelle, signature comprise (resend, format thinking_blocks), au
# seul modèle qui l'a produite ; sans elle, une boucle d'outils avec réflexion est refusée.
# La clé vient de ANTHROPIC_API_KEY ou se saisit au diagnostic (en-tête x-api-key).
# Haiku 4.5 : réflexion manuelle, budget de 1 024 tokens, sous la réserve de 1 536 (512 restent
# à la réponse) ; température réglable au « LLM nu », réflexion éteinte seulement (Anthropic
# la refuse avec la réflexion). Pas de top-p : Haiku 4.5 refuse temperature et top_p ensemble
# (400, guide de migration d'Anthropic relu le 2026-10-03).
[[cloud.models]]
id = "claude_haiku"
provider = "Anthropic"
base_url = "https://api.anthropic.com/v1"
model = "claude-haiku-4-5"
api = "anthropic_messages"
auth_header = { name = "x-api-key", scheme = "" }
extra_headers = { "anthropic-version" = "2023-06-01", "anthropic-beta" = "thinking-binding-controls-2026-08-01" }
tools = true
context = 200000
hosting_text = "Anthropic, États-Unis (inférence « global » par défaut ; pas de résidence dans l'UE)"
training = "no"
notes_text = "Les données envoyées par l'API ne servent pas à l'entraînement sans permission expresse et sont supprimées sous 30 jours (conditions relevées le 2026-10-03). Prix et quotas à lire dans la console Anthropic."
key_env = "ANTHROPIC_API_KEY"
sampling = ["temperature"]
pricing = { input_usd_per_mtok = 1.0, output_usd_per_mtok = 5.0, cache_read_usd_per_mtok = 0.10, cache_write_usd_per_mtok = 1.25, checked = "2026-10-03" }
# GreenOps : EcoLogits 0.11.2 connaît claude-haiku-4-5 chez anthropic.
impacts = { provider = "anthropic", model = "claude-haiku-4-5" }

[cloud.models.reasoning]
