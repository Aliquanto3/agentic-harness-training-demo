# provider = "Google AI Studio"
# base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
# model = "gemini-2.5-flash"
# tools = true
# context = 1048576
# hosting_fr = "Google (hébergement non précisé)"
# training = "yes"
# notes_fr = "Clause EEE : l'offre gratuite ne doit pas servir à des utilisateurs de l'EEE, de Suisse ou du Royaume-Uni. Contenus lus par des relecteurs humains, sans opt-out."
#
# NVIDIA : offre d'essai, « limited trial purposes only », hors production ; les contenus
# sont collectés (§3.3 des conditions).
