measured_rss_mb = 1055
files = [
    { url = "https://huggingface.co/Qwen/Qwen3-Embedding-0.6B-GGUF/resolve/370f27d7550e0def9b39c1f16d3fbaa13aa67728/Qwen3-Embedding-0.6B-Q8_0.gguf", path = "embedding/Qwen3-Embedding-0.6B-Q8_0.gguf", size = 639150592, sha256 = "06507c7b42688469c4e7298b0a1e16deff06caf291cf0a5b278c308249c3e439" },
]

# Lot 5c-2 : les modèles de reranking que l'atelier propose en plus de celui de la brique
# ([rag.reranker], option « Modèle de reranking de la brique RAG »). Même schéma que
# [rag.reranker] ; fichiers sous reranker/, sha256 vérifié au chargement ; mêmes règles d'id que
# [[rag_lab.embeddings]] (unique, 32 caractères au plus, ni « declared » ni l'id de la brique).
# Lus dans ce fichier seulement. Le format de la paire se lit dans l'en-tête du GGUF : un
# reranker d'architecture LLM (Qwen3-Reranker) passe par son gabarit
# tokenizer.chat_template.rerank et rend déjà une probabilité (pas de sigmoïde) ; un
# cross-encoder BERT à identifiants de segment (token_type_count ≥ 2, ms-marco MiniLM) est
# refusé : llama.cpp ne les transmet pas. L'atelier ne les télécharge pas encore : un fichier
# absent rend l'option indisponible, avec son chemin sous models/.
# Valeurs de l'essai du 2026-10-05 (essai-modeles-5c.md) ; RSS mesuré sur le PC de
# développement, à remesurer sur le PC cible.
[[rag_lab.rerankers]]
id = "qwen3-reranker-0.6b"
backend = "llama_cpp"
label_text = "Qwen3-Reranker 0.6B (Qwen, GGUF Q8_0)"
license = "Apache-2.0"
max_tokens = 1024  # une paire passée par le gabarit, en tokens (l'extrait est coupé au-delà)
load_path = "reranker/qwen3-reranker-0.6b-q8_0.gguf"
measured_rss_mb = 937
files = [
    { url = "https://huggingface.co/ggml-org/Qwen3-Reranker-0.6B-Q8_0-GGUF/resolve/a02f48bb4f057028298c21fa033da2b30d7742d5/qwen3-reranker-0.6b-q8_0.gguf", path = "reranker/qwen3-reranker-0.6b-q8_0.gguf", size = 639153184, sha256 = "22c9979ce4fbcdc5acdc310c6641c32797eff1aa980b8f7a2db8a8ea23429a48" },
]

[tools]
# Bornes de la boucle de tour (AD-10), affichées sur la carte de la brique outils.
# Appels au modèle par tour, dont les nouveaux essais après un appel mal formé.
max_calls = 6
max_retries = 2
# Outil fetch_page : https uniquement, vers ces hôtes seulement (aussi présents dans
# [net] allowed_hosts). Le texte de la page est coupé à fetch_page_max_chars caractères.
fetch_page_hosts = ["fr.wikipedia.org", "calendrier.api.gouv.fr"]
fetch_page_max_chars = 4000
# Borne d'un résultat d'outil, en tokens, pour les outils réseau et MCP (locaux compris),
# dans le tour, le sous-agent et les actions forcées ; jamais les outils natifs locaux comme
# read_file, ni un message d'erreur, ni le résultat du sous-agent (delegate). Le harnais coupe
# au plus près de la borne, au dernier saut de ligne s'il tombe dans la seconde moitié du
# texte gardé, avant la compression, et le signale au modèle et dans Orchestration.
# Plancher 200.
result_max_tokens = 1200

[reasoning]
# Budget de raisonnement (lot C, décision N4), en mode local seulement : quand la réflexion
# atteint budget_tokens tokens sans s'être fermée, le harnais arrête la génération, ferme
# lui-même la réflexion (le </think> du gabarit) et relance le modèle, qui garde le reste de la
# réserve de sortie (1 536 tokens avec le raisonnement) pour la réponse. Les modèles cloud gèrent
# leur propre effort de raisonnement. Borné entre 128 et 1 408 (1 536 − 128). Mesuré sur le PC
# cible (2026-09-27, Qwen3.5-2B, ≈ 9,5 tokens/s) sur le prompt du train : 127 à 134 s avec 1 024,
# 111 s avec 768, pour une réponse visée en moins de 120 s. Baissez-le si les réponses arrivent
# trop tard.
budget_tokens = 768

[compression]
# Compression du contexte (story 20, AD-22) par Headroom, dépendance optionnelle installée
# par `uv sync --extra compression`. Un résultat d'outil ou un extrait RAG plus court que
# min_chars caractères n'est pas compressé. cost_mb : mémoire ajoutée par Headroom, en Mo,
# contrôlée par le budget [memory] au chargement. 84 Mo ajoutés au pic sur le PC cible
# (2026-09-27, banc headroom, comptage gpt-4), plus 30 %, arrondi : 110 (lot J), au-dessus des
# 107 Mo mesurés au pic sous Linux.
min_chars = 300
cost_mb = 110

[subagent]
# Sous-agent (story 19, AD-10, AD-11) : les outils qu'il peut utiliser, s'ils sont activés
# dans la brique Outils (un nom inconnu est signalé au lancement), et ses appels au modèle
# par délégation. Ses nouveaux essais après un appel refusé suivent [tools] max_retries et
# comptent dans ces appels. Il ne raisonne pas (la brique Raisonnement ne contribue qu'au
# contexte principal), sauf un modèle cloud qui raisonne toujours.
tools = ["read_file", "fetch_page"]
max_calls = 4

[mcp]
# Serveurs MCP (story 6) : un serveur n'est contacté qu'à l'activation de sa sous-option.
# Délai de connexion (initialize puis tools/list) et délai d'un appel d'outil, en secondes.
connect_timeout_s = 15
call_timeout_s = 30
# Écart à l'instantané (AD-9) : à la connexion d'un serveur public qui a un instantané dans
# content/mcp_snapshots/ (scripts/snapshot_mcp.py), WaveStack compare sa liste d'outils
# (tools/list) à l'instantané. Au-delà de ce seuil, un avertissement qui nomme le serveur
# s'affiche sur la carte MCP : la jauge prévue pour les scénarios MCP peut ne plus tenir. Écart =
# le plus grand de deux rapports : outils ajoutés ou retirés sur le nombre d'outils de
# l'instantané, et variation du poids de leur documentation (description et schéma, en
# caractères). 0.2 = 20 % (borné de 0 à 10) ; sans instantané, aucune comparaison.
snapshot_drift_threshold = 0.2

[mcp.urls]
# Serveurs publics en Streamable HTTP ; leurs hôtes sont aussi dans [net] allowed_hosts.
datagouv = "https://mcp.data.gouv.fr/mcp"
mslearn = "https://learn.microsoft.com/api/mcp"

[finops]
# Estimateur FinOps : le coût de chaque appel cloud se calcule à partir des prix déclarés par
# l'entrée [[cloud.models]] (pricing), en dollars, la devise de facturation. Le total de la
# séance est aussi converti en euros à ce taux (euros pour un dollar ; 0,86 par défaut, borné
# de 0,5 à 2 ; une valeur illisible, nan ou inf, vaut 0,86). Taux relevé le 2026-09-30, à
# mettre à jour avec les prix.
# Un appel arrêté (« Arrêter ») compte son entrée telle qu'envoyée, et la sortie reçue avant
# l'arrêt. L'estimation suit le prix catalogue. Les tokens d'entrée lus ou écrits dans le cache
# du fournisseur sont comptés à leurs prix quand l'entrée les déclare (pricing :
# cache_read_usd_per_mtok, cache_write_usd_per_mtok), au prix d'entrée sinon. Prix par palier
# ou pour les longs contextes, prix du traitement par lots (batch) et offres gratuites ne sont
# pas pris en compte.
eur_per_usd = 0.86
# Plafond de dépense de la séance, en dollars (5 par défaut ; une valeur illisible, nan, inf,
# négative ou booléenne vaut 5 ; aucune valeur ne le désactive, et 0 refuse tout appel tarifé).
# Quand le total de la séance (tous les appels tarifés : tours, sous-agent, « Tester », « LLM
# nu ») l'a atteint, un appel à un modèle qui déclare ses prix n'est pas envoyé ; les modèles
# sans prix (local, Gemma) restent utilisables. Les appels déjà en cours ne sont jamais
# interrompus : le total peut dépasser le plafond du coût de chacun d'eux. Pour le relever :
# settings.json, WaveStack arrêté, puis relancer (le total ne revient à zéro qu'au relancement).
max_session_usd = 5

[greenops]
# Estimateur GreenOps : l'énergie (Wh) et les émissions (g CO₂e) estimées de chaque appel au
# modèle, sans aucun appel réseau.
# - Modèle cloud : méthode EcoLogits (bibliothèque ecologits, cœur seul, hors ligne ;
#   ecologits.ai), à partir des tokens de sortie (raisonnement compris) et de la durée de
#   l'appel, sous les noms que déclare le champ impacts de l'entrée [[cloud.models]]. Une
#   fourchette (min–max) quand EcoLogits en donne une ; cycle de vie compris (fabrication des
#   serveurs et usage).
# - Modèle local : CodeCarbon hors ligne (extra greenops : uv sync --extra greenops ;
#   codecarbon.io), autour de chaque génération : le processus de WaveStack pour le moteur
#   intégré, le poste entier pour Ollama et llama-server. Sous Windows sans RAPL ni droits
#   administrateur, CodeCarbon estime la puissance (TDP × charge) : c'est une estimation, pas
#   une mesure. Seule son énergie est gardée (ni GPU, ni fichier emissions.csv).
# Intensité carbone de l'électricité d'un appel local, en g CO₂e par kWh (0 à 2 000 ; une
# valeur illisible, nan ou inf, vaut 41,4) : 41,4 par défaut, le facteur du mix France
# d'EcoLogits (production de l'électricité en cycle de vie). Pour comparaison, RTE (bilan
# électrique 2025) : 19,6 g en émissions directes, environ 29 g en cycle de vie.
# Attention, les deux chiffres ne couvrent pas le même périmètre : en local, l'électricité
# consommée seulement (kWh × intensité, sans la fabrication du poste) ; en cloud, le cycle de
# vie d'EcoLogits (l'électricité des serveurs et une part de leur fabrication).
local_gco2e_per_kwh = 41.4
# Mémoire de CodeCarbon (et de pandas), comptée par le budget une seule fois, à vie, à son
# premier usage (un module Python ne se décharge pas), en Mo : environ 70 Mo mesurés. Refusée
# par le budget, l'empreinte locale est indisponible, avec la raison.
codecarbon_cost_mb = 80

[cloud]
# Modèles cloud compatibles OpenAI (story 11, AD-4, AD-5, AD-20). Aucune clé ici : la clé
# se saisit au diagnostic et reste dans api_keys.json, dans le dossier de données, ou vient
# de la variable d'environnement que nomme key_env (jamais sa valeur ici). Une clé saisie
# passe avant la variable.
# hosting_text et notes_text d'une entrée [[cloud.models]] sont saisis par l'opérateur et
# affichés tels quels dans l'avertissement et le bandeau du modèle, quelle que soit la langue
# de l'interface (fr, en ou de), même après un changement de langue en cours de séance : ils
# n'ont pas de traduction. Pour une séance dans une autre langue que le français, redéclarez-
# les dans settings.json (même id) dans cette langue (décision d'Anaël du 2026-10-01).
# Tokens estimés en mode chat : caractères / chars_per_token, puis corrigés par le ratio
# réel usage.prompt_tokens / estimation (borné à [0,8 ; 1,5], initialisé à estimate_ratio).
chars_per_token = 4
estimate_ratio = 1.0
# Délais de l'appel au modèle cloud, en secondes : connexion, puis lecture du flux.
connect_timeout_s = 10
read_timeout_s = 60
# Marqueurs de gabarit neutralisés dans tout texte du harnais (AD-4, étape 2).
neutralize_markers = [
    "<|im_start|>", "<|im_end|>", "<|endoftext|>", "<|start|>", "<|end|>", "<|message|>",
    "<|channel|>", "<|return|>", "<|call|>", "<|begin_of_text|>", "<|eot_id|>",
    "<|start_header_id|>", "<|end_header_id|>", "[INST]", "[/INST]", "<s>", "</s>",
]

# Préréglage Groq : le plus rapide ; tous ses modèles gèrent l'appel d'outils.
# gpt-oss raisonne toujours : réserve de 1 536 tokens. Quota de 8 000 tokens par minute :
# fenêtre de 4 000 (tpm // 2), donc 2 464 tokens utilisables.
[[cloud.models]]
id = "groq"
provider = "Groq"
base_url = "https://api.groq.com/openai/v1"
model = "openai/gpt-oss-120b"
stream_usage = true
tools = true
context = 131072
tpm = 8000
hosting_text = "États-Unis (Groq)"
training = "no"
notes_text = "Aucune rétention des entrées et sorties par défaut, 30 jours au plus pour le débogage ou la lutte contre les abus. Quotas à lire dans la console Groq."
reasoning = { format = "field", always = true, on = { reasoning_effort = "low" }, resend = false }
key_env = "GROQ_API_KEY"
# Écran « LLM nu » (story 29) : les réglages d'échantillonnage que l'API compatible OpenAI
