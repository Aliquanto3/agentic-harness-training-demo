# Préréglage Gemini (Google AI Studio, API compatible OpenAI ; vérifié sur ai.google.dev le
# 2026-09-29, conditions relues le 2026-09-30). Offre payante obligatoire, clause EEE : « You
# may use only Paid Services when making API Clients available to users in the European
# Economic Area, Switzerland, or the United Kingdom » (un « API Client » : site, application ou
# service). Données : sur l'offre payante, rien ne sert à l'entraînement ; sur l'offre
# gratuite, les contenus servent à améliorer les produits Google et peuvent être lus par des
# relecteurs humains, sauf pour les utilisateurs de l'EEE, de Suisse et du Royaume-Uni, à qui
# Google applique les règles de l'offre payante sur tous les services, quota gratuit compris.
# gemini-3.5-flash-lite (stable) : 1 048 576 tokens en entrée, 65 536 en sortie ; niveaux de
# raisonnement minimal (par défaut), low, medium et high ; 0,30 $ / 2,50 $ par million de
# tokens (entrée / sortie), aucune hausse annoncée pour ce modèle.
# Raisonnement : allumé, thinking_level "high" avec include_thoughts, seule façon de
# recevoir le texte du raisonnement (à "low", le modèle ne réfléchit pas sur des questions
# simples ni sur le prompt du scénario Raisonnement : recette réelle du 2026-09-30 ; à
# "medium", le résumé de la réflexion manque souvent en streaming quand elle reste courte :
# sonde du 2026-10-03, 3 fois sur 8 contre 4 sur 4 à "high"), que
# Gemini écrit dans content entre <thought> et </thought> (relevé sur l'API réelle le
# 2026-09-29 ; s'il change, changez tags ou format dans settings.json) ; éteint,
# reasoning_effort "minimal". reasoning_effort et thinking_config ne se combinent pas. Son
# usage.completion_tokens ne compte pas les tokens de réflexion : WaveStack lit total_tokens −
# prompt_tokens.
# tool_call_extra : Gemini 3.x signe une réponse qui appelle des outils (une signature de
# pensée, sur le premier appel seulement quand il y en a plusieurs en parallèle, relevé le
# 2026-09-29) et refuse (400) un appel du tour en cours rejoué sans elle ; WaveStack la renvoie
# telle quelle, à Gemini seulement. Un appel que le harnais fabrique (action forcée) n'en a
# pas : il porte la valeur de contournement documentée par Google.
# Secours, dans settings.json (fusion par id, champ par champ). null ne retire qu'une clé de
# premier niveau de reasoning.on ou reasoning.off (extra_body, reasoning_effort) : un null
# plus profond est envoyé tel quel, et tool_call_extra ou tags à null rendent l'entrée
# invalide.
# - gemini-3.6-flash accepte aussi minimal : {"id": "gemini", "model": "gemini-3.6-flash"}
#   (0,75 $ / 3,75 $, puis 1,50 $ / 7,50 $ au 2027-01-01). Les 3.7 et 3.8 Flash n'ont pas
#   minimal : il faudrait "off": {"reasoning_effort": "low"}, et le modèle raisonnerait alors
#   même brique Raisonnement éteinte (réflexion facturée, invisible, prise sur la réserve de
#   512 tokens de la réponse).
# - gemini-2.5-flash, réservé aux projets qui l'ont déjà utilisé : "model": "gemini-2.5-flash"
#   et "reasoning": {"on": {"extra_body": null, "reasoning_effort": "low"}, "off":
#   {"reasoning_effort": "none"}} (1 024 tokens de raisonnement, dans la réserve de 1 536).
# - extra_body refusé : "on": {"extra_body": null, "reasoning_effort": "low"} ; le modèle
#   raisonne alors sans montrer son raisonnement.
[[cloud.models]]
id = "gemini"
provider = "Google AI Studio"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
model = "gemini-3.5-flash-lite"
stream_usage = true
tools = true
context = 1048576
hosting_text = "Google (hébergement non précisé)"
training = "no"
notes_text = "Offre payante obligatoire (clause EEE : un client d'API mis à disposition d'utilisateurs de l'EEE, de Suisse ou du Royaume-Uni doit utiliser l'offre payante). Sur l'offre payante, rien n'est utilisé pour l'entraînement ; ces règles de données s'appliquent aussi aux utilisateurs de l'EEE sur le quota gratuit (conditions relues le 2026-09-30). Prix à vérifier dans la console : hausse au 2027-01-01 pour les 3.6 à 3.8 Flash."
key_env = "GEMINI_API_KEY"
tool_call_extra = { extra_content = { google = { thought_signature = "skip_thought_signature_validator" } } }
# FinOps : prix de gemini-3.5-flash-lite, relevés sur ai.google.dev/pricing (offre payante).
# Les tokens de réflexion sont facturés comme sortie.
pricing = { input_usd_per_mtok = 0.30, output_usd_per_mtok = 2.50, checked = "2026-09-29" }
# GreenOps : architecture non publiée et multimodale, d'où une large fourchette d'EcoLogits.
impacts = { provider = "google_genai", model = "gemini-3.5-flash-lite" }

[cloud.models.reasoning]
format = "think_tags"
tags = ["<thought>", "</thought>"]
on = { extra_body = { google = { thinking_config = { thinking_level = "high", include_thoughts = true } } } }
off = { reasoning_effort = "minimal" }
always = false
resend = false

