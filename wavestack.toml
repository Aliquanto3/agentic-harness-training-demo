# Exemples à recopier dans settings.json (entrée complète, enabled = true), avec leur
# avertissement. Leur hôte rejoint alors la liste d'adresses autorisées.
# Champs facultatifs de toute entrée : key_env (nom d'une variable d'environnement qui
# fournit la clé, par exemple "OPENROUTER_API_KEY"), min_interval_s (secondes au moins entre
# deux envois au même modèle, de 0 exclu à 60), sampling (story 29 : les réglages que
# l'écran « LLM nu » peut envoyer, parmi "temperature" et "top_p" ; vide par défaut, réglés
# par le fournisseur) et tool_call_extra (ce qu'ajoute à chaque appel d'outil fabriqué par
# le harnais un fournisseur qui l'exige, comme Gemini ci-dessus) et pricing (FinOps : prix
# d'entrée et de sortie en dollars par million de tokens, avec la date du relevé, et, facultatifs,
# cache_read_usd_per_mtok et cache_write_usd_per_mtok, prix des tokens d'entrée lus ou écrits
# dans le cache du fournisseur, au prix d'entrée s'ils manquent ; sans pricing, aucun coût n'est
# estimé ni affiché pour ce modèle, et le plafond [finops] max_session_usd ne le bloque jamais)
# et impacts (GreenOps : provider et model
# tels qu'EcoLogits les connaît, zone facultative, code ISO à trois lettres du mix électrique,
# par défaut celui du fournisseur dans EcoLogits ; note_text facultative, ajoutée à l'infobulle ;
# sans lui, aucune empreinte n'est estimée).
#
# NVIDIA : offre d'essai, « limited trial purposes only », hors production ; les contenus
# sont collectés (§3.3 des conditions).
# [[cloud.models]]
# id = "nvidia"
# provider = "NVIDIA"
# base_url = "https://integrate.api.nvidia.com/v1"
# model = "meta/llama-3.3-70b-instruct"
# tools = true
# context = 131072
# hosting_text = "NVIDIA (hébergement non précisé)"
# training = "yes"
# trial = true
# notes_text = "Offre d'essai réservée à l'évaluation interne, pas à un usage durable. Environ 40 requêtes par minute."
#
# OpenRouter : le catalogue « :free » change presque chaque jour, et la politique de
# données dépend du fournisseur vers lequel la requête est routée. 50 requêtes par jour
# sans crédits achetés.
# [[cloud.models]]
# id = "openrouter"
# provider = "OpenRouter"
# base_url = "https://openrouter.ai/api/v1"
# model = "meta-llama/llama-3.3-70b-instruct:free"
# tools = true
# context = 131072
# hosting_text = "Selon le fournisseur routé par OpenRouter"
# training = "yes"
# notes_text = "Catalogue gratuit instable : vérifiez le nom du modèle avant la séance. Politique de données propre à chaque fournisseur routé. 50 requêtes par jour sans crédits."
