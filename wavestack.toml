# Configuration par défaut de WaveStack.
# Surchargée par settings.json (dans le dossier de données, AD-20), jamais l'inverse.

[server]
port = 8420

[net]
# Hôtes autorisés pour toute sortie réseau (AD-15). Les suffixes "*.host" sont acceptés.
allowed_hosts = [
    "huggingface.co",
    "*.hf.co",
    # Outils réseau (story 5b).
    "fr.wikipedia.org",
    "calendrier.api.gouv.fr",
    # Serveurs MCP publics (story 6).
    "mcp.data.gouv.fr",
    "learn.microsoft.com",
]
# Contact envoyé dans l'User-Agent à chaque service sortant : la politique robots de Wikimedia
# l'exige (403 sans lui). Une URL ou une adresse électronique, en ASCII ; valeur par défaut si
# absent ou invalide.
contact = "https://github.com/Aliquanto3/agentic-harness-training-demo"
# Adresse fixe utilisée par la sonde de connectivité du diagnostic (CAP-39).
connectivity_probe_host = "huggingface.co"

[net.loopback_ports]
# Serveurs locaux déjà lancés, sondés jamais lancés (AD-7).
ollama = 11434
llama_server = 8080

[model_servers]
# Serveurs locaux déjà lancés par l'utilisateur (story 18) : Ollama et llama-server, jamais
# lancés ni arrêtés par WaveStack. Délais en secondes : connexion, puis lecture de la réponse
# (le premier appel d'Ollama charge le modèle, d'où une lecture longue).
connect_timeout_s = 2
read_timeout_s = 300

[context]
# Fenêtre de contexte, en tokens (AD-9) : 4 096 par défaut, la taille pour laquelle les
# scénarios sont conçus. Elle se règle aussi dans l'interface (« Fenêtre ▾ » de la barre haute :
# 4 096, 8 192 ou 16 384), et ce choix, écrit dans settings.json ("context": {"window": …}),
# prend le pas sur cette valeur aux lancements suivants. Une autre valeur mise ici reste lue,
# mais le panneau ne la propose pas. Donnez à llama-server un `-c` égal à la fenêtre choisie
# (réglage de l'interface, sinon cette valeur).
window = 4096
near_limit_ratio = 0.8

[memory]
# Budget mémoire de WaveStack (AD-8, NFR-2) : un changement de modèle est refusé si ce
# qu'occupe WaveStack sans le modèle actif, plus le coût du nouveau, dépasse ce budget. Sans le
# modèle actif : la mémoire mesurée (WaveStack et ses processus enfants) moins la part du
# modèle, jamais sous la mémoire mesurée juste avant la création de son moteur. Le modèle actif reste alors chargé. Le modèle d'embedding du RAG
# (story 15) et le reranker (story 16) sont refusés de même, avec la brique ou sa sous-option
# indisponible. Story 24 : le budget est calculé une seule fois, au lancement ; le diagnostic
# (ligne « memory ») et chaque refus donnent le budget retenu et son calcul.
# Mode du budget : "dynamic" (défaut, et pour toute valeur inconnue) ou "fixed".
#   dynamic : min(budget_mb, budget_ram_ratio × RAM disponible au lancement), jamais sous
#             512 Mo ; si la RAM est illisible, budget_mb. Fermer des applications puis relancer WaveStack l'agrandit,
#             jusqu'au plafond.
#   fixed   : budget_mb, quelle que soit la RAM du poste.
budget_mode = "dynamic"
# En Mo : le plafond du budget en mode "dynamic", la valeur du budget en mode "fixed".
budget_mb = 4096
# Part de la RAM disponible au lancement retenue en mode "dynamic" (0,6 ; bornée de 0,1 à 0,9 ;
# une valeur illisible vaut 0,6).
budget_ram_ratio = 0.6
# Marge ajoutée au coût estimé de chaque modèle local (poids, cache KV à la fenêtre ; pour
# l'embedding, sa taille quand aucune mesure n'est déclarée), en Mo.
load_margin_mb = 256

[rag]
# RAG simple (story 15, AD-22). L'index sqlite-vec est construit hors ligne par
# `uv run python scripts/build_rag_index.py` ; un chemin relatif part de la racine du dépôt.
index_path = "data/rag_index.sqlite"
# Extraits placés dans le contexte à chaque tour, les plus proches de la question, sans seuil
# (de 1 à 20).
top_k = 3
# Taille maximale d'un extrait au découpage, en caractères (reconstruisez l'index après
# l'avoir changée).
chunk_max_chars = 700
# Reranking (story 16, sous-option de la brique RAG) : candidats retenus par l'embedding, puis
# réordonnés par le reranker, qui n'en garde que top_k. Un passage du reranker par candidat :
# à baisser si l'étape « Reranking » est trop lente sur le poste (NFR-1). De top_k à 20.
rerank_candidates = 8

[rag.embedding]
# Le seul endroit qui nomme le modèle d'embedding : valeurs du verdict de la story 12
# (provisoire, mesure sur le PC cible à faire). `id` est écrit dans l'index : un autre
# modèle rend la brique indisponible jusqu'à la reconstruction de l'index.
id = "granite-embedding-107m-multilingual-q8_0"
backend = "llama_cpp"
label_fr = "Granite Embedding 107M multilingue (IBM, GGUF Q8_0)"
license = "Apache-2.0"
dims = 384        # carte HF : hidden_size 384, pooling CLS lu dans le GGUF
max_tokens = 512  # carte HF : max_position_embeddings 514 (XLM-RoBERTa)
query_prefix = "" # aucun préfixe sur la carte IBM
passage_prefix = ""
# Relatif au dossier des modèles (models/ dans le dossier de données).
load_path = "embedding/granite-embedding-107m-multilingual-Q8_0.gguf"
# Banc de la story 12 sur le PC cible (2026-09-27) : pic 481 Mo, base 53 Mo.
measured_rss_mb = 430
# sha256 et commit relevés sur le PC cible (2026-09-27), identiques à l'oid LFS de Hugging Face.
files = [
    { url = "https://huggingface.co/bartowski/granite-embedding-107m-multilingual-GGUF/resolve/52fed1c818636b7cb8c4e4e3ae73189efeb78081/granite-embedding-107m-multilingual-Q8_0.gguf", path = "embedding/granite-embedding-107m-multilingual-Q8_0.gguf", size = 121020096, sha256 = "15691dfe830257f569a1e3521977351d16eac18e48e414908dc98ed9b8455e07" },
]

[rag.reranker]
# Le seul endroit qui nomme le modèle de reranking (story 16) : valeurs du verdict de la
# story 12 (provisoire, mesure sur le PC cible à faire). Chargé par llama.cpp en pooling RANK,
# une paire question-extrait par passage ; le score est ramené entre 0 et 1 (sigmoïde).
id = "bge-reranker-v2-m3-q4_k_m"
backend = "llama_cpp"
label_fr = "BGE Reranker v2 M3 (BAAI, GGUF Q4_K_M)"
license = "Apache-2.0"
max_tokens = 1024  # longueur d'une paire question + extrait, en tokens (extrait tronqué au-delà)
# Relatif au dossier des modèles (models/ dans le dossier de données).
load_path = "reranker/bge-reranker-v2-m3-Q4_K_M.gguf"
# Banc de la story 12 sur le PC cible (2026-09-27) : pic 789 Mo, base 53 Mo.
measured_rss_mb = 740
# sha256 et commit relevés sur le PC cible (2026-09-27), identiques à l'oid LFS de Hugging Face.
files = [
    { url = "https://huggingface.co/gpustack/bge-reranker-v2-m3-GGUF/resolve/3093af03b1a635e67b084b1d8c03c5f5e020fd05/bge-reranker-v2-m3-Q4_K_M.gguf", path = "reranker/bge-reranker-v2-m3-Q4_K_M.gguf", size = 438376864, sha256 = "e186a244ed455b4ab66ec64339ce7427a6ae13f5c0b5e544de96e50f0f8b3673" },
]

[tools]
# Bornes de la boucle de tour (AD-10), affichées sur la carte de la brique outils.
# Appels au modèle par tour, dont les nouveaux essais après un appel mal formé.
max_calls = 6
max_retries = 2
# Outil fetch_page : https uniquement, vers ces hôtes seulement (aussi présents dans
# [net] allowed_hosts). Le texte de la page est coupé à fetch_page_max_chars caractères.
fetch_page_hosts = ["fr.wikipedia.org", "calendrier.api.gouv.fr"]
fetch_page_max_chars = 4000
# Borne d'un résultat d'outil, en tokens, pour les outils réseau et MCP (locaux compris),
# dans le tour, le sous-agent et les actions forcées ; jamais les outils natifs locaux comme
# read_file, ni un message d'erreur, ni le résultat du sous-agent (delegate). Le harnais coupe
# au plus près de la borne, au dernier saut de ligne s'il tombe dans la seconde moitié du
# texte gardé, avant la compression, et le signale au modèle et dans Orchestration.
# Plancher 200.
result_max_tokens = 1200

[reasoning]
# Budget de raisonnement (lot C, décision N4), en mode local seulement : quand la réflexion
# atteint budget_tokens tokens sans s'être fermée, le harnais arrête la génération, ferme
# lui-même la réflexion (le </think> du gabarit) et relance le modèle, qui garde le reste de la
# réserve de sortie (1 536 tokens avec le raisonnement) pour la réponse. Les modèles cloud gèrent
# leur propre effort de raisonnement. Borné entre 128 et 1 408 (1 536 − 128). Mesuré sur le PC
# cible (2026-09-27, Qwen3.5-2B, ≈ 9,5 tokens/s) sur le prompt du train : 127 à 134 s avec 1 024,
# 111 s avec 768, pour une réponse visée en moins de 120 s. Baissez-le si les réponses arrivent
# trop tard.
budget_tokens = 768

[compression]
# Compression du contexte (story 20, AD-22) par Headroom, dépendance optionnelle installée
# par `uv sync --extra compression`. Un résultat d'outil ou un extrait RAG plus court que
# min_chars caractères n'est pas compressé. cost_mb : mémoire ajoutée par Headroom, en Mo,
# contrôlée par le budget [memory] au chargement. 84 Mo ajoutés au pic sur le PC cible
# (2026-09-27, banc headroom, comptage gpt-4), plus 30 %, arrondi : 110 (lot J), au-dessus des
# 107 Mo mesurés au pic sous Linux.
min_chars = 300
cost_mb = 110

[subagent]
# Sous-agent (story 19, AD-10, AD-11) : les outils qu'il peut utiliser, s'ils sont activés
# dans la brique Outils (un nom inconnu est signalé au lancement), et ses appels au modèle
# par délégation. Ses nouveaux essais après un appel refusé suivent [tools] max_retries et
# comptent dans ces appels. Il ne raisonne pas (la brique Raisonnement ne contribue qu'au
# contexte principal), sauf un modèle cloud qui raisonne toujours.
tools = ["read_file", "fetch_page"]
max_calls = 4

[mcp]
# Serveurs MCP (story 6) : un serveur n'est contacté qu'à l'activation de sa sous-option.
# Délai de connexion (initialize puis tools/list) et délai d'un appel d'outil, en secondes.
connect_timeout_s = 15
call_timeout_s = 30

[mcp.urls]
# Serveurs publics en Streamable HTTP ; leurs hôtes sont aussi dans [net] allowed_hosts.
datagouv = "https://mcp.data.gouv.fr/mcp"
mslearn = "https://learn.microsoft.com/api/mcp"

[cloud]
# Modèles cloud compatibles OpenAI (story 11, AD-4, AD-5, AD-20). Aucune clé ici : la clé
# se saisit au diagnostic et reste dans api_keys.json, dans le dossier de données, ou vient
# de la variable d'environnement que nomme key_env (jamais sa valeur ici). Une clé saisie
# passe avant la variable.
# Tokens estimés en mode chat : caractères / chars_per_token, puis corrigés par le ratio
# réel usage.prompt_tokens / estimation (borné à [0,8 ; 1,5], initialisé à estimate_ratio).
chars_per_token = 4
estimate_ratio = 1.0
# Délais de l'appel au modèle cloud, en secondes : connexion, puis lecture du flux.
connect_timeout_s = 10
read_timeout_s = 60
# Marqueurs de gabarit neutralisés dans tout texte du harnais (AD-4, étape 2).
neutralize_markers = [
    "<|im_start|>", "<|im_end|>", "<|endoftext|>", "<|start|>", "<|end|>", "<|message|>",
    "<|channel|>", "<|return|>", "<|call|>", "<|begin_of_text|>", "<|eot_id|>",
    "<|start_header_id|>", "<|end_header_id|>", "[INST]", "[/INST]", "<s>", "</s>",
]

# Préréglage Groq : le plus rapide ; tous ses modèles gèrent l'appel d'outils.
# gpt-oss raisonne toujours : réserve de 1 536 tokens. Quota de 8 000 tokens par minute :
# fenêtre de 4 000 (tpm // 2), donc 2 464 tokens utilisables.
[[cloud.models]]
id = "groq"
provider = "Groq"
base_url = "https://api.groq.com/openai/v1"
model = "openai/gpt-oss-120b"
stream_usage = true
tools = true
context = 131072
tpm = 8000
hosting_fr = "États-Unis (Groq)"
training = "no"
notes_fr = "Aucune rétention des entrées et sorties par défaut, 30 jours au plus pour le débogage ou la lutte contre les abus. Quotas à lire dans la console Groq."
reasoning = { format = "field", always = true, on = { reasoning_effort = "low" }, resend = false }
key_env = "GROQ_API_KEY"
# Écran « LLM nu » (story 29) : les réglages d'échantillonnage que l'API compatible OpenAI
# accepte ; top-k et min-p ne sont jamais envoyés à un fournisseur. Les tours de l'atelier
# n'en envoient aucun (réglés par le fournisseur).
sampling = ["temperature", "top_p"]

# Préréglage Mistral : fournisseur français, plan gratuit toujours actif (décision du
# 2026-09-25 : mistral-small-latest).
[[cloud.models]]
id = "mistral"
provider = "Mistral AI"
base_url = "https://api.mistral.ai/v1"
model = "mistral-small-latest"
stream_usage = false
tools = true
context = 131072
hosting_fr = "Mistral AI, France (hébergement dans l'UE plausible, non confirmé)"
training = "opt_out"
notes_fr = "Sur le plan gratuit, les prompts servent à l'entraînement par défaut : décochez l'option dans Admin Console > Privacy. Quotas à lire dans la console Mistral."
reasoning = { format = "content_blocks", on = { reasoning_effort = "high" }, off = { reasoning_effort = "none" } }
key_env = "MISTRAL_API_KEY"
# Écran « LLM nu » (story 29) : température et top-p réglables, comme chez Groq.
sampling = ["temperature", "top_p"]
# Le plan gratuit refuse (429) deux requêtes à moins d'une seconde : au moins 1 s entre deux
# envois à ce modèle (tour ou « Tester »). Augmentez la valeur si des 429 persistent.
min_interval_s = 1

# Exemples à recopier dans settings.json (entrée complète, enabled = true), avec leur
# avertissement. Leur hôte rejoint alors la liste d'adresses autorisées.
# Champs facultatifs de toute entrée : key_env (nom d'une variable d'environnement qui
# fournit la clé, par exemple "GOOGLE_API_KEY"), min_interval_s (secondes au moins entre
# deux envois au même modèle, de 0 exclu à 60) et sampling (story 29 : les réglages que
# l'écran « LLM nu » peut envoyer, parmi "temperature" et "top_p" ; vide par défaut, réglés
# par le fournisseur).
#
# Google AI Studio : clause EEE. « You may use only Paid Services when making API Clients
# available to users in the European Economic Area, Switzerland, or the United Kingdom. »
# Sur l'offre gratuite, les contenus servent à améliorer les produits Google et peuvent
# être lus par des relecteurs humains, sans opt-out possible.
